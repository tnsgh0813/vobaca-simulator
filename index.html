      el.remove();
    }

    // 스킬·이벤트 발동 기록: 화면 오른쪽 아래에 카드가 쌓임 (최신이 맨 아래 · 크게). 20초 뒤 또는 다음 턴에 사라짐
    const FEED_MAX = 4, FEED_LIFE = 20000;
    function feedBox() {
      let f = document.getElementById('skillfeed');
      if (!f) { f = document.createElement('div'); f.id = 'skillfeed'; f.className = 'skillfeed'; f.setAttribute('aria-live', 'polite'); f.setAttribute('aria-label', '스킬 · 이벤트 발동 기록'); document.body.appendChild(f); }
      return f;
    }
    function feedRemove(el) {
      if (!el || el.dataset.out) return; el.dataset.out = '1';
      el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(40px)' }], { duration: 260, easing: 'ease-in', fill: 'forwards' }).finished.catch(() => {}).then(() => el.remove());
    }
    function clearFeed(keepRecentMs = 0) {
      const f = document.getElementById('skillfeed'); if (!f) return;
      const now = Date.now();
      for (const el of [...f.children]) if (!keepRecentMs || now - +el.dataset.t > keepRecentMs) feedRemove(el);
    }
    async function skillCut(g, ev) {
      const info = opts.cardInfo(ev.uid); if (!info && !ev.text) return;
      const f = feedBox();
      SND(ev.event ? 'event_play' : 'skill');
      const el = document.createElement('div'); el.className = 'sf-item' + (opts.isTop(ev.p) ? ' opp' : ''); el.dataset.t = String(Date.now());
      el.style.setProperty('--tc', opts.teamColor(ev.p));
      const eff = ev.text || (info && info.ko) || '';
      el.innerHTML = `${info ? `<button type="button" class="sf-card" data-uid="${ev.uid}" title="카드 정보 보기" aria-label="${opts.esc(info.name)} 정보 보기"><img src="${info.img}" alt=""></button>` : ''}
        <div class="sf-info"><span class="sf-who">${opts.esc(g.pname(ev.p))} · ${ev.event ? '이벤트' : '스킬'}</span><b>${opts.esc(ev.label || (info ? info.name : ''))}</b>
        ${eff ? `<p class="sf-eff">${opts.esc(eff)}</p>` : ''}${ev.text && info && info.ko && !ev.event ? `<p class="sf-ko">${opts.esc(info.ko)}</p>` : ''}</div>`;
      f.appendChild(el);
      const live = [...f.children].filter(x => !x.dataset.out);
      if (live.length > FEED_MAX) feedRemove(live[0]);
      el.animate([{ transform: 'translateX(110%)', opacity: 0 }, { transform: 'translateX(-4%)', opacity: 1, offset: .7 }, { transform: 'none', opacity: 1 }], { duration: 320, easing: 'cubic-bezier(.2,.9,.3,1)' });
      setTimeout(() => feedRemove(el), FEED_LIFE);
      // 필드 위의 그 카드도 반짝
      const fu = ev.target != null ? ev.target : ev.uid;   // 수치가 바뀐 카드가 있으면 그 카드를
      const src = fu != null ? document.querySelector(`.mat .card[data-uid="${fu}"]`) : null;
      if (src) src.animate([{ filter: 'brightness(1)', transform: 'scale(1)' }, { filter: 'brightness(1.8) drop-shadow(0 0 10px #fff)', transform: 'scale(1.12)', offset: .3 }, { filter: 'brightness(1)', transform: 'scale(1)' }], { duration: ms(900), easing: 'ease-out' });
      await sleep(ms(ev.event ? 1100 : 900));   // 읽을 틈만 잠깐 주고 진행 (기록은 남아 있음)
    }

    // ───── エンジンイベント → 演出 ─────
    async function play(g, ev) {
      const opp = p => 1 - p;
      switch (ev.type) {
        case 'setStart': {
          setOP(null); setVisible(false); SND('whistle', { long: true });
          await showBanner(`<b>세트 ${ev.setNo}</b><span>서브: ${opts.esc(g.pname(ev.server))}</span>`, 'set', 1000);
          return;
        }
        case 'offense': {
          const p = ev.p, o = opp(p), tier = tierOf(ev.kind, ev.value);
          if (ev.kind === 'serve') {
            // 공을 띄우고 → 카드가 뛰어올라 직접 친다
            place({ p, s: 'serve' }); setVisible(true); setOP(null);
            const tierS = Math.min(4, tier + (ev.value >= 4 ? 1 : 0));
            const hp = hitPoint(p, 'serve', tierS);
            if (hp) {
              await fly({ p, s: 'serveHit', pt: hp }, { dur: 380, arc: 0, lift: 1.25, easing: 'cubic-bezier(.2,.7,.4,1)' });
              const sk = strike(p, 'serve', tierS);
              hover(sk.prep || 1);
              await sk.hit; SND('serve', { power: Math.min(1, tierS / 4) });
            }
            impact(tier, 'serve'); setOP(ev.value, tier);
            // 서브는 블록할 수 없으므로 상대 리시브 에리어로 바로 날아간다
            await fly({ p: o, s: 'receive' }, { dur: TIER[tier].fly + 360, arc: 90, lift: 1.45, ghosts: TIER[tier].trail, easing: 'cubic-bezier(.3,.1,.5,1)' });
          } else if (ev.kind === 'attack') {
            // 토스로 띄운 공(타점)을 어택 카드가 뛰어올라 내리친다. OP가 클수록 높이·빠르게.
            setVisible(true); setOP(null);
            const hp = hitPoint(p, 'attack', tier);
            if (hp) {
              if (!st.spot || st.spot.s !== 'attackHit') place({ p, s: 'attackHit', pt: hp });
              const sk = strike(p, 'attack', tier);
              fly({ p, s: 'attackHit', pt: hp }, { dur: sk.prep || 1, arc: 4, lift: 1.12, easing: 'ease-out' });
              await sk.hit; SND('spike', { power: Math.min(1, tier / 4) });
            } else place({ p, s: 'attack' });
            impact(tier, 'attack'); setOP(ev.value, tier);
            await fly({ p: o, s: 'net' }, { dur: TIER[tier].fly, arc: 18 - tier * 4, lift: 1.15, ghosts: TIER[tier].trail, easing: tier >= 3 ? 'cubic-bezier(.2,.6,.3,1)' : 'ease-in' });
          } else {                                         // 블록으로 튕겨낸 공도 블록 불가 → 바로 리시브 쪽으로
            setOP(ev.value, 1);
            if (!(st.spot && st.spot.p === o && st.spot.s === 'receive')) await fly({ p: o, s: 'receive' }, { dur: 640, arc: 90, lift: 1.45 });
          }
          await hover(380);                                // 어택은 블록 앞에서, 서브·블록은 리시브 앞에서 잠깐 멈춤
          spin.classList.add('bob');                       // 相手の判断待ちの間はふわふわ浮かせる
          return;
        }
        case 'resume': {                                   // 튜토리얼 등 랠리 도중부터 시작: 공을 받는 쪽 앞에 놓아 둔다
          const off = ev.offense; if (!off) return;
          place({ p: opp(off.owner), s: off.type === 'attack' ? 'net' : 'receive' }); setVisible(true);
          setOP(off.value, tierOf(off.type, off.value)); spin.classList.add('bob');
          return;
        }
        case 'toBlock': {
          spin.classList.remove('bob'); SND('squeak');
          await hover(300);
          spin.classList.add('bob');
          return;
        }
        case 'opChange': {                                 // 스킬로 상대 OP가 바뀜 (원터치 등)
          setOP(ev.value, tierOf('attack', ev.value)); ring(1, '#ffd23f');
          burst(`${ev.label || 'OP'} ${ev.value}`, { cls: 'ok', size: .9 }); SND('onetouch');
          await sleep(ms(450));
          return;
        }
        case 'toReceive': {
          spin.classList.remove('bob'); if (ev.from === 'attack') SND('squeak');
          if (ev.from === 'oneTouch') {                     // 원터치: 블로커 손끝에 맞고 자기 리시브 쪽으로 떨어진다
            const els = opts.cardsIn(ev.p, 'block');
            const lf = lift(els, ev.p, { h: .22, dur: 460, scale: 1.08 });
            await lf.peak;
            burst(ev.label || '원터치!', { cls: 'ok', size: 1 }); SND('onetouch');
            if (ev.value != null) setOP(ev.value, tierOf('attack', ev.value));
            await fly({ p: ev.p, s: 'receive' }, { dur: 520, arc: 60, lift: 1.3, easing: 'ease-out' });
            await lf.done; spin.classList.add('bob');
            return;
          }
          if (ev.from !== 'attack') return;                // 서브·블록 공은 이미 리시브 에리어에 와 있다
          await sleep(ms(120));
          await fly({ p: ev.p, s: 'receive' }, { dur: 380, arc: -10, lift: 1.05, easing: 'ease-in' });
          return;
        }
        case 'judge': {
          spin.classList.remove('bob');
          const p = ev.p, o = opp(p), d = netDir(p);
          if (ev.kind === 'block') {
            // 블로커 전원이 동시에 떠올라 공을 막는다
            const els = opts.cardsIn(p, 'block');
            const lf = lift(els, p, { h: .3, dur: 600, scale: 1.14 });
            await lf.peak;
            if (ev.ok) {
              const tier = ev.doshut ? 3 : 2;
              shake(TIER[tier].shake, 320); ring(TIER[tier].ring, '#7fe0ff'); particles(TIER[tier].parts, '#bdf1ff');
              burst(ev.parts && ev.parts.length > 1 ? `블록! ${ev.parts.join('+')}=${ev.dp}` : '블록!', { cls: 'ok', size: 1.1 }); SND('block');
              setOP(null);
              await fly({ p, s: 'blockBounce', pt: { x: st.x, y: st.y + d * size() * 1.2 } }, { dur: 220, arc: 20, lift: 1.15, easing: 'ease-out' });
              await lf.done;
              if (ev.doshut) {
                // 도샷: 막아낸 뒤 블로커들이 내리꽂아 상대 코트로 공격
                const sl = slam(opts.cardsIn(p, 'block'), p);
                await sl.hit;
                const T = TIER[3];
                shake(T.shake, 400); doFlash(.35, '#cfefff'); ring(T.ring, '#7fe0ff'); particles(T.parts, '#7fe0ff');
                burst('도샷!!', { cls: 't3', size: 1.4 }); SND('doshut');
                await fly({ p: o, s: 'receive' }, { dur: 300, arc: 6, lift: 1.12, ghosts: 2, easing: 'cubic-bezier(.2,.6,.3,1)' });
                await sl.done;
              }
            } else {
              shake(TIER[3].shake, 380); doFlash(.3, '#ff9a8a');
              burst(ev.parts && ev.parts.length > 1 ? `블록 실패 ${ev.parts.join('+')}=${ev.dp}` : '블록 실패', { cls: 'bad', size: 1 }); SND('floor');
              await fly({ p, s: 'floor' }, { dur: 300, arc: -6, lift: 1.0, easing: 'ease-in' });
              particles(10, '#ffffff'); setOP(null);
              await lf.done;
            }
          } else {
            // 리시브 카드가 살짝 떠올라 공을 받아낸다
            const lf = lift(opts.cardsIn(p, 'receive').slice(0, 1), p, { h: .16, dur: 520, scale: 1.1 });
            await lf.peak;
            if (ev.ok) {
              setOP(null);
              burst('리시브!', { cls: 'ok', size: .9 }); SND('receive');
              await hop(54, 460, 1.35);
            } else {
              shake(6, 300);
              burst('리시브 실패', { cls: 'bad', size: 1 }); SND('floor');
              setOP(null);
              await fly({ p, s: 'out' }, { dur: 480, arc: 26, lift: 1.1, easing: 'ease-out' });
            }
            await lf.done;
          }
          return;
        }
        case 'toss': {
          await fly({ p: ev.p, s: 'toss' }, { dur: 560, arc: 80, lift: 1.55 });
          return;
        }
        case 'set': {
          // 세터가 공을 밀어 올리고, 공은 어택 카드 앞 타점에 떠서 기다린다
          const lf = lift(opts.cardsIn(ev.p, 'toss').slice(0, 1), ev.p, { h: .12, dur: 420, scale: 1.08 });
          await lf.peak; SND('toss');
          const hp = hitPoint(ev.p, 'attack', 2);
          await fly(hp ? { p: ev.p, s: 'attackHit', pt: hp } : { p: ev.p, s: 'attack' }, { dur: 620, arc: 110, lift: 1.7, easing: 'ease-in-out' });
          spin.classList.add('bob');
          await lf.done;
          return;
        }
        case 'doshut': {                                   // 턴 종료 시 OP가 바뀌는 순간 (모션은 블록 판정 때 이미 보여 줌)
          setOP(ev.value, 3); ring(1.4, '#7fe0ff');
          burst(`OP ${ev.value}`, { cls: 't3', size: 1 });
          await sleep(ms(500));
          return;
        }
        case 'sidesDrop': {                                // 블록 페이즈가 끝나 사이드 블로커가 드롭 더미로
          const dst = document.querySelector(`.zone[data-zone="drop"][data-p="${ev.p}"] .pile`);
          const els = ev.uids.map(u => document.querySelector(`.mat .card[data-uid="${u}"]`)).filter(Boolean);
          if (!dst || !els.length || ms(1) === 0) return;
          await sleep(ms(260));
          const b = dst.getBoundingClientRect();
          await Promise.all(els.map((el, i) => {
            const a = el.getBoundingClientRect();
            const cl = el.cloneNode(true); cl.style.cssText = `position:fixed;left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;margin:0;z-index:70;pointer-events:none;`;
            document.body.appendChild(cl); el.style.visibility = 'hidden';
            const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2), sc = Math.max(.35, b.width / a.width);
            return cl.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${dx * .5}px, ${dy * .5 - 30}px) rotate(${i ? 8 : -8}deg) scale(${(1 + sc) / 2})`, opacity: 1, offset: .55 }, { transform: `translate(${dx}px, ${dy}px) rotate(${i ? 14 : -14}deg) scale(${sc})`, opacity: .2 }],
              { duration: ms(560), delay: i * ms(90), easing: 'cubic-bezier(.4,.1,.4,1)', fill: 'forwards' }).finished.catch(() => {}).then(() => cl.remove());
          }));
          return;
        }
        case 'skill': {
          await skillCut(g, ev);   // 연출 끄기에서도 기록은 남김 (기다림만 0)
          return;
        }
        case 'coin': {
          setVisible(false); setOP(null);
          await coinToss(g, ev.winner);
          return;
        }
        case 'lost': {
          setOP(null);
          { const v = G.VobacaUI ? G.VobacaUI.ST.viewer : 0; SND('whistle'); setTimeout(() => SND(ev.p === v ? 'aww' : 'cheer'), 380); }
          const w = opp(ev.p);
          await showBanner(`<b>로스트</b><span>${opts.esc(g.pname(w))} 세트 획득 · ${opts.esc(ev.reason)}</span>`, 'lost', 1300);
          setVisible(false);
          return;
        }
        case 'gameover': {
          setVisible(false);
          return;
        }
      }
    }

    return { play, place, relayout, setVisible, setOP, clearFeed, get state() { return st; } };
  }

  G.VobacaFX = { create, tierOf };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  'use strict';
  const { DB, DECKS, AFF_KO, GRADE_KO } = window.VobacaCards;
  const KN = no => DB[no].kr || DB[no].name;   // 표시용 카드 이름 (한국어)
  const { Game, AREA_KO, PARAM_KO, PHASE_KO, TIMING_KO } = window.VobacaEngine;
  const { CPU, findCard } = window.VobacaAI;
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const TEAM_COLOR = { karasuno: 'var(--karasuno)', nekoma: 'var(--nekoma)', seijoh: 'var(--seijoh)', fukuro: 'var(--fukuro)', other: 'var(--other)', alt: 'var(--alt)' };
  const ST = {
    game: null, mode: 'cpu', myDeck: 'karasuno', speed: 'normal',
    viewer: 0, pending: null, sel: [], detail: null, handoff: null, autoPass: true, logOpen: false,
    lostConfirm: false, prevTops: {}, lastOp: null, logLen: 0, seenSides: new Set(), dragJustEnded: false,
    teams: ['karasuno', 'nekoma'], tut: null, tutRestrict: null,
  };
  const isHuman = p => ST.mode === 'pvp' || p === 0;
  try { const pr = JSON.parse(localStorage.getItem('vobaca-prefs') || 'null'); if (pr) { if (pr.speed) ST.speed = pr.speed; if (typeof pr.autoPass === 'boolean') ST.autoPass = pr.autoPass; } } catch {}
  function savePrefs() { try { localStorage.setItem('vobaca-prefs', JSON.stringify({ speed: ST.speed, autoPass: ST.autoPass })); } catch {} }

  // ───────── 카드 이미지 미리 불러오기 ─────────
  // 카드가 처음 나올 때 이미지가 늦게 뜨지 않도록, 두 덱의 모든 이미지를 시작 시 받아서 디코딩해 둔다.
  const SND = (id, x) => { try { window.VobacaAudio && window.VobacaAudio.play(id, x); } catch (e) {} };
  const IMG_CACHE = [];
  const PRELOAD = { done: 0, total: 0, ready: false };
  const preloadPromise = (() => {
    const srcs = [...new Set(Object.values(DECKS).filter(d => !d.sample).flatMap(d => d.list.map(([no, , ver]) => `img/${no}-${ver}.webp`)))];   // 샘플 덱은 대전 시작 때 받음
    PRELOAD.total = srcs.length;
    return Promise.all(srcs.map(src => new Promise(res => {
      const im = new Image(); im.decoding = 'async'; IMG_CACHE.push(im);
      const fin = () => { PRELOAD.done++; updatePreload(); res(); };
      im.onload = () => { (im.decode ? im.decode() : Promise.resolve()).catch(() => {}).then(fin); };
      im.onerror = fin;
      im.src = src;
    }))).then(() => { PRELOAD.ready = true; updatePreload(); });
  })();
  // 대전에 쓰는 덱(부스터 카드 포함)의 이미지는 시작할 때 따로 받아 둔다
  const extraLoaded = new Set();
  function preloadDeck(d) {
    for (const [no, , ver] of d.list || []) { const src = `img/${no}-${ver || DB[no].img || 'D'}.webp`; if (extraLoaded.has(src)) continue; extraLoaded.add(src); const im = new Image(); im.decoding = 'async'; im.src = src; IMG_CACHE.push(im); }
  }
  function updatePreload() {
    const el = document.getElementById('preloadNote'); if (!el) return;
    el.textContent = PRELOAD.ready ? '카드 이미지 준비 완료' : `카드 이미지 불러오는 중… ${PRELOAD.done}/${PRELOAD.total}`;
    el.classList.toggle('ready', PRELOAD.ready);
  }

  // ───────── 演出 (ボール) ─────────
  function matOf(p) { return document.querySelector(`.mat[data-p="${p}"]`); }
  function centerOf(el) { if (!el) return null; const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r }; }
  const FX = window.VobacaFX.create({
    arena: $('#arena'), shakeEl: $('#arena'),
    speed: () => ST.speed, esc,
    coinLabel: p => (p === ST.viewer ? '나' : 'CPU'),
    teamColor: p => TEAM_COLOR[teamOf(p)],
    cardInfo: uid => { const g = ST.game; const c = g && uid != null && findCard(g, uid); return c ? { img: imgOf(c), name: KN(c.no), ko: DB[c.no].ko || '', event: DB[c.no].type === 'E' } : null; },
    isTop: p => p !== ST.viewer,
    cardsIn: (p, area) => [...document.querySelectorAll(`.area[data-area="${area}"][data-p="${p}"] .card`)],
    locate(p, s) {
      const top = p !== ST.viewer;
      if (['serve', 'receive', 'toss', 'attack'].includes(s)) {
        const c = centerOf(document.querySelector(`.area[data-area="${s}"][data-p="${p}"] .slot`));
        return c && { x: c.x, y: c.y - c.r.height * .12 };
      }
      const blk = centerOf(document.querySelector(`.area[data-area="block"][data-p="${p}"]`));
      if (!blk) return null;
      if (s === 'net') return { x: blk.x, y: top ? blk.r.bottom - blk.r.height * .34 : blk.r.top + blk.r.height * .34 };
      if (s === 'block') return { x: blk.x, y: blk.y };
      if (s === 'floor') { const c = centerOf(document.querySelector(`.area[data-area="toss"][data-p="${p}"]`)); return c && { x: c.x + c.r.width * .18, y: c.y }; }
      if (s === 'out') {
        const c = centerOf(document.querySelector(`.area[data-area="receive"][data-p="${p}"]`)); if (!c) return null;
        const a = $('#arena').getBoundingClientRect();
        const x = top ? Math.min(a.right - 14, c.r.right + c.r.width * .5) : Math.max(a.left + 14, c.r.left - c.r.width * .5);   // 리시브 바깥쪽으로 (상대는 오른쪽)
        return { x, y: top ? c.r.top + 6 : c.r.bottom - 6 };
      }
      return null;
    },
  });
  window.addEventListener('resize', () => FX.relayout());
  window.__vobacaFX = FX;   // 디버그용
  window.__vobacaDebug = () => ({ ST, render, showResult });
  async function animator(g, ev) {
    if (g !== ST.game) return;
    if (ST.tut) await ST.tut.onAnim(g, ev, 'before');
    if (g.aborted) return;
    await FX.play(g, ev);
    if (ST.tut && !g.aborted) await ST.tut.onAnim(g, ev, 'after');
  }

  // ───────── エージェント ─────────
  const humanAgent = {
    async decide(g, req) {
      // 플레이할 이벤트가 없는 프리 스텝은 자동으로 넘긴다 (로스트 선언은 상단 메뉴에서)
      if (req.type === 'free' && !req.options.length && (ST.autoPass || ST.tut)) return { action: 'pass' };
      ST.tutRestrict = null;
      if (ST.tut) { await ST.tut.onRequest(g, req); if (g.aborted) return null; }   // 튜토리얼: 설명 표시·선택지 제한
      return new Promise(res => {
        const resolve = v => { const t = ST.tut; ST.tutRestrict = null; res(v); if (t) t.onAnswered(req, v); };
        ST.pending = { req, resolve, game: g };
        ST.sel = []; ST.lostConfirm = false;
        if (ST.mode === 'pvp' && req.player !== ST.viewer) ST.handoff = req.player;
        render();
      });
    },
  };
  const cpuAgent = {
    async decide(g, req) {
      const trivial = req.type === 'free' && !req.options.length;
      if (!trivial) { render(); await sleep(ST.speed === 'normal' ? 420 : ST.speed === 'fast' ? 160 : 60); }
      if (ST.tut && ST.tut.cpuDecide) { const a = ST.tut.cpuDecide(g, req); if (a !== undefined) return a; }
      return CPU.decide(g, req);
    },
  };
  function answer(v) {
    const pd = ST.pending; if (!pd) return;
    ST.pending = null; ST.sel = []; ST.lostConfirm = false; ST.blockConfirm = false;
    pd.resolve(v);
  }

  // ───────── ゲーム開始 ─────────
  // opts: { decks:[d0,d1], names?, speed?, preset?, tutorial? }
  function deckTeam(d) {
    if (d.color && TEAM_COLOR[d.color]) return d.color;
    const tally = { karasuno: 0, nekoma: 0, seijoh: 0, fukuro: 0, other: 0 };
    const key = { '烏野': 'karasuno', '音駒': 'nekoma', '青葉城西': 'seijoh', '梟谷': 'fukuro' };
    for (const [no, cnt] of d.list) { const a = DB[no].aff || []; if (!a.length) continue; let hit = false; for (const x of a) if (key[x]) { tally[key[x]] += cnt; hit = true; } if (!hit) tally.other += cnt; }
    return Object.entries(tally).sort((x, y) => y[1] - x[1])[0][1] ? Object.entries(tally).sort((x, y) => y[1] - x[1])[0][0] : 'karasuno';
  }
  function startGame(opts) {
    if (ST.game) ST.game.aborted = true;
    ST.mode = 'cpu'; if (opts.speed) ST.speed = opts.speed; ST.logOpen = false; savePrefs();
    const [d0, d1] = opts.decks;
    preloadDeck(d0); preloadDeck(d1);
    try { window.VobacaAudio && window.VobacaAudio.bgm('bgm_battle'); } catch (e) {}
    const names = opts.names || [d0.label || d0.name, (d1.label || d1.name) + ' (CPU)'];
    ST.teams = [deckTeam(d0), deckTeam(d1)]; if (ST.teams[0] === ST.teams[1]) ST.teams[1] = 'alt';
    ST.viewer = 0; ST.pending = null; ST.sel = []; ST.detail = null; ST.handoff = null; ST.prevTops = {}; ST.seenSides = new Set(); ST.lastOp = null; ST.logLen = 0;
    ST.tut = opts.tutorial || null; ST.tutRestrict = null; ST.blockConfirm = false; ST.feedTurn = null;
    const g = new Game({ DB, decks: [d0, d1], names, agents: [humanAgent, cpuAgent], onChange: () => scheduleRender(), animator, preset: opts.preset, seed: opts.seed });
    FX.setVisible(false); FX.setOP(null);
    ST.game = g;
    document.documentElement.style.setProperty('--c0', TEAM_COLOR[ST.teams[0]]);
    document.documentElement.style.setProperty('--c1', TEAM_COLOR[ST.teams[1]]);
    document.body.classList.toggle('tutorial', !!ST.tut);
    closeModal();
    g.run().then(() => { if (!g.aborted) { render(); showResult(); } }).catch(e => { console.error(e); g.say('⚠ 오류: ' + e.message); render(); });
    render();
    return g;
  }
  function leaveGame() {
    if (ST.game) ST.game.aborted = true;
    ST.game = null; ST.pending = null; ST.tut = null; ST.tutRestrict = null; ST.detail = null; ST.logOpen = false;
    document.body.classList.remove('tutorial');
    FX.setVisible(false); FX.setOP(null);
    renderDetail(); $('#center').className = 'center'; $('#center').innerHTML = ''; $('#center').dataset.html = '';
    $('#prompt').classList.remove('on'); closeModal();
    document.querySelectorAll('.coinstage, #skillfeed').forEach(x => x.remove());
    ST.blockConfirm = false;
    const c = document.getElementById('coach'); if (c) c.hidden = true;
  }

  let rq = 0;
  function scheduleRender() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }

  // ───────── 描画 ─────────
  function imgOf(card) { return `img/${card.no}-${card.ver}.webp`; }
  function teamOf(p) { return ST.teams[p]; }
  function cardHtml(card, opts = {}) {
    const g = ST.game; const d = DB[card.no];
    const cls = ['card']; if (opts.cls) cls.push(opts.cls); if (opts.cap) cls.push('cap');
    if (opts.enter) cls.push('enter');
    let pv = '';
    if (opts.param) {
      const v = g.param(card, opts.param); const b = g.base(card, opts.param);
      if (v !== null) pv = `<span class="pv ${v > b ? 'up' : v < b ? 'down' : ''}">${v}</span>`;
    }
    const nm = !opts.badge && g && card.nameAs && g.charArea(card) ? g.krName(card.nameAs).split(' ')[0] : '';   // 2인 카드: 고른 이름
    const badge = opts.badge ? `<span class="badge">${esc(opts.badge)}</span>` : nm ? `<span class="badge nm" title="이번 턴 이름: ${esc(g.krName(card.nameAs))}">${esc(nm)}</span>` : '';
    return `<button type="button" class="${cls.join(' ')}" data-uid="${card.uid}" aria-label="${esc(d.kr || d.name)}" title="${esc(d.kr || d.name)}"><img src="${imgOf(card)}" alt="" draggable="false">${pv}${badge}${opts.cap ? `<span class="kn">${esc(d.kr || d.name)}</span>` : ''}</button>`;
  }
  function backHtml(n = '') { return `<div class="card back" aria-hidden="true">${n}</div>`; }

  function render() {
    const g = ST.game; if (!g) return;
    if (ST.feedTurn !== g.turnNo) { if (ST.feedTurn != null) FX.clearFeed(4000); ST.feedTurn = g.turnNo; }   // 다음 턴이 되면 스킬 기록을 치움 (방금 뜬 것은 남김)
    const top = 1 - ST.viewer, bottom = ST.viewer;
    $('#courtTop').innerHTML = courtHtml(top, true);
    $('#courtBottom').innerHTML = courtHtml(bottom, false);
    $('#courtTop').dataset.p = top; $('#courtBottom').dataset.p = bottom;
    $('#courtTop').classList.toggle('active', g.turnPlayer === top);
    $('#courtBottom').classList.toggle('active', g.turnPlayer === bottom);
    $('#courtTop').style.setProperty('--team', TEAM_COLOR[teamOf(top)]);
    $('#courtBottom').style.setProperty('--team', TEAM_COLOR[teamOf(bottom)]);
    $('#net').innerHTML = netHtml();
    document.body.classList.toggle('targeting', !!courtTargets());
    $('#phases').innerHTML = phasesHtml();
    renderScore();
    renderHand();
    trackDraws();
    renderControls();
    renderDetail();
    renderLog();
    renderHandoff();
    $('#btnConcede').disabled = g.winner != null;
    $('#btnConcede').textContent = ST.tut ? '튜토리얼 나가기' : '기권';
    FX.relayout();
    const net = $('#net'); $('#prompt').style.top = (net.offsetTop + net.offsetHeight / 2) + 'px';   // 지시 문구는 네트 가운데
    if (ST.tut) ST.tut.decorate();
  }

  // ── 넘김식 점수판: 큰 숫자 = 따낸 세트, 가운데 작은 숫자 = 남은 세트 카드 ──
  const FLIP_MS = 170;
  function flipHtml(cls) { return `<span class="flip ${cls}" data-v=""><span class="fl-t"><i></i></span><span class="fl-b"><i></i></span></span>`; }
  function setFlip(el, v, animate) {
    v = String(v); const old = el.dataset.v;
    if (old === v) return;
    el.dataset.v = v;
    const t = el.querySelector('.fl-t i'), b = el.querySelector('.fl-b i');
    if (old === '' || !animate || ST.speed === 'instant' || matchMedia('(prefers-reduced-motion: reduce)').matches) { t.textContent = v; b.textContent = v; return; }
    el.querySelectorAll('.fl-flap').forEach(x => x.remove());
    t.textContent = v; b.textContent = old;
    const f1 = document.createElement('span'); f1.className = 'fl-t fl-flap'; f1.innerHTML = `<i>${esc(old)}</i>`;
    const f2 = document.createElement('span'); f2.className = 'fl-b fl-flap'; f2.innerHTML = `<i>${esc(v)}</i>`; f2.style.transform = 'rotateX(90deg)';
    el.append(f1, f2);
    const ms = FLIP_MS * (ST.speed === 'fast' ? .6 : 1);
    f1.animate([{ transform: 'rotateX(0deg)', filter: 'brightness(1)' }, { transform: 'rotateX(-90deg)', filter: 'brightness(.6)' }], { duration: ms, easing: 'ease-in', fill: 'forwards' }).finished
      .then(() => f2.animate([{ transform: 'rotateX(90deg)', filter: 'brightness(.6)' }, { transform: 'rotateX(0deg)', filter: 'brightness(1)' }], { duration: ms, easing: 'cubic-bezier(.3,1.6,.6,1)', fill: 'forwards' }).finished)
      .catch(() => {}).then(() => { if (el.dataset.v === v) { b.textContent = v; } f1.remove(); f2.remove(); });
  }
  function renderScore() {
    const g = ST.game; const box = $('#score');
    if (box.dataset.gid !== String(g.uid || (g.uid = Math.random()))) {
      box.dataset.gid = String(g.uid); delete box.dataset.ready;
      const team = p => `<div class="sb-team sb-t${p}" style="--tc:${TEAM_COLOR[teamOf(p)]}"><i class="sb-dot"></i><span class="sb-name">${esc(g.pname(p))}</span></div>`;
      box.innerHTML = `<div class="sb" role="group" aria-label="점수판">
        ${team(0)}<div class="sb-big" title="따낸 세트">${flipHtml('big w0')}</div>
        <div class="sb-mid"><span class="sb-title">세트 <b class="sb-setno">-</b></span><div class="sb-smalls" title="남은 세트 카드">${flipHtml('small c0')}${flipHtml('small c1')}</div><span class="sb-cap">남은 세트 카드</span></div>
        <div class="sb-big" title="따낸 세트">${flipHtml('big w1')}</div>${team(1)}</div>`;
    }
    const won = p => g.history.filter(h => h.winner === p).length;
    const anim = !!box.dataset.ready; box.dataset.ready = '1';
    for (const p of [0, 1]) {
      setFlip(box.querySelector('.w' + p), won(p), anim);
      setFlip(box.querySelector('.c' + p), g.players[p].setArea.length, anim);
      box.querySelector('.sb-t' + p).classList.toggle('on', g.turnPlayer === p && g.phase !== 'gameover');
    }
    box.querySelector('.sb-setno').textContent = g.setNo || '-';
    box.setAttribute('aria-label', `세트 ${g.setNo || '-'} · ${g.pname(0)} ${won(0)}세트 (세트 카드 ${g.players[0].setArea.length}) · ${g.pname(1)} ${won(1)}세트 (세트 카드 ${g.players[1].setArea.length})`);
  }

  function courtHtml(p, isTop) {
    const g = ST.game; const pl = g.players[p];
    const req = ST.pending && ST.handoff === null ? ST.pending.req : null;   // 사람 플레이어의 입력 대기 중일 때만 강조
    const hotArea = req && req.player === p && req.type === 'deploy' ? req.area : req && req.player === p && req.type === 'blockDeploy' ? 'block' : null;
    // 블록 등장 단계: 고른 카드를 블록 에리어에 미리 올려 보여 준다 (결정 전)
    const staging = req && req.player === p && req.type === 'blockDeploy' && p === ST.viewer ? ST.sel.map(u => findCard(g, u)).filter(Boolean) : null;
    const stagedHtml = (c, isCenter) => `<div class="slot staged">${cardHtml(c, { param: 'block', badge: isCenter ? '센터' : '사이드', cls: 'stg' })}<div class="stg-acts">${isCenter ? '' : `<button class="btn" type="button" data-act="center" data-uid="${c.uid}">센터로</button>`}<button class="btn" type="button" data-act="unstage" data-uid="${c.uid}">빼기</button></div></div>`;
    // 가츠: 맨 위 캐릭터 아래에 깔린 카드가 왼쪽으로 비스듬히 삐져나오게 (가까운 것부터 최대 3장) + 장수
    const gutsLayers = cards => cards.length ? cards.slice(-3).reverse().map((c, k) => `<span class="gl" style="--i:${k + 1}"><img src="${imgOf(c)}" alt="" draggable="false"></span>`).join('') + `<span class="gcount" title="가츠 ${cards.length}장">${cards.length}</span>` : '';
    const TG = courtTargets();
    const tcls = c => (TG && TG.has(c.uid) ? 'targetable' : '');
    const topCard = (a, param) => {
      const stack = pl.areas[a]; const t = stack[stack.length - 1];
      const key = p + a; const enter = t && ST.prevTops[key] !== t.uid; if (t) ST.prevTops[key] = t.uid;
      if (enter && g.phase !== 'setup') SND('card_place');
      return `<div class="slot">${gutsLayers(stack.slice(0, -1))}${t ? cardHtml(t, { param, enter, cls: tcls(t) }) : '<div class="empty"></div>'}</div>`;
    };
    const gutsMeta = a => { const n = Math.max(0, pl.areas[a].length - 1); return `<span class="meta ${n ? '' : 'zero'}">가츠 ${n}</span>`; };
    const area = a => `<div class="area a-${a} ${hotArea === a ? 'hot' : ''}" data-area="${a}" data-p="${p}">
        <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
        ${topCard(a, a)}<span class="lab">${AREA_KO[a]}</span>${gutsMeta(a)}</div>`;
    const sides = pl.sides.map(s => {
      const key = s.uid + ':' + g.turnNo; const enter = !ST.seenSides.has(key); ST.seenSides.add(key);
      if (enter) SND('card_place');
      return `<div class="slot">${cardHtml(s, { param: 'block', enter, badge: 'S', cls: tcls(s) })}</div>`;
    });
    const stSide = staging ? staging.slice(1) : [];
    const sideSlot = i => `<div class="bslot bside"><span class="sl">사이드 블로커</span>${sides[i] || (stSide[i] ? stagedHtml(stSide[i], false) : '<div class="slot"><div class="empty"></div></div>')}</div>`;
    const centerSlot = staging && staging[0] ? `<div class="slot">${gutsLayers(pl.areas.block)}${stagedHtml(staging[0], true).replace('<div class="slot staged">', '<div class="staged">')}</div>` : topCard('block', 'block');
    const blockArea = `<div class="area a-block ${hotArea === 'block' ? 'hot' : ''}" data-area="block" data-p="${p}">
        ${sideSlot(0)}<div class="bslot bcenter"><span class="sl">센터 블로커</span>${centerSlot}</div>${sideSlot(1)}
        <span class="lab">블록</span>${gutsMeta('block')}</div>`;
    const backs = (n, max, cls = '') => Array.from({ length: Math.min(n, max) }, (_, i) => `<i class="cback ${cls}" style="--i:${i}"></i>`).join('');
    const topOf = arr => arr.length ? `<span class="minicard"><img src="${imgOf(arr[arr.length - 1])}" alt=""></span>` : '';
    const zones = `
      <div class="zone z-set" data-zone="set" data-p="${p}" title="세트 카드 ${pl.setArea.length}장"><div class="pile land">${backs(pl.setArea.length, 2, 'land')}</div><span class="zl">세트</span><b>${pl.setArea.length}</b></div>
      <div class="zone z-deck" data-zone="deck" data-p="${p}"><div class="pile">${backs(pl.deck.length ? 1 : 0, 1)}${pl.deck.length > 1 ? '<i class="cback under"></i>' : ''}</div><span class="zl">덱</span><b>${pl.deck.length}</b></div>
      <div class="zone z-drop" data-zone="drop" data-p="${p}"><div class="pile">${topOf(pl.drop)}</div><span class="zl">드롭</span><b>${pl.drop.length}</b></div>
      <div class="zone z-event" data-zone="event" data-p="${p}"><div class="pile">${topOf(pl.event)}</div><span class="zl">이벤트</span><b>${pl.event.length}</b></div>`;
    const name = `<span class="who">${esc(g.pname(p))}<em>패 ${pl.hand.length}</em>${g.turnPlayer === p ? '<em class="turn">턴</em>' : ''}</span>`;
    // 상대 패: 뒷면 부채꼴로 장수가 한눈에 보이게
    const nh = pl.hand.length, shown = Math.min(nh, 10);
    const oppHand = isTop ? `<div class="opphand" aria-label="상대 패 ${nh}장">${Array.from({ length: shown }, (_, i) => `<i class="cback" style="--o:${(i - (shown - 1) / 2).toFixed(2)}"></i>`).join('')}<b>${nh}</b></div>` : '';
    return `${name}${oppHand}${zones}${area('serve')}<div class="court">${blockArea}<div class="mainrow">${area('receive')}${area('toss')}${area('attack')}</div></div>`;
  }

  function netHtml() {
    const g = ST.game;
    const off = g.offense;
    let txt;
    if (off) {
      const kind = off.type === 'serve' ? '서브' : off.type === 'block' ? '블록' : '어택';
      txt = `<span class="opchip" style="--team:${TEAM_COLOR[teamOf(off.owner)]}"><b>OP ${off.value}</b><span class="optx">${esc(g.pname(off.owner))}의 ${kind} → ${esc(g.pname(1 - off.owner))}</span></span>`;
    } else {
      txt = `<span class="opchip none"><b>${g.phase === 'gameover' ? '경기 종료' : '공 없음'}</b>${g.defense != null ? '디펜스 ' + g.defense : ''}</span>`;
    }
    const pd = ST.pending; const TR = ST.tutRestrict || {};
    const mine = pd && ST.handoff === null && pd.req.player === ST.viewer;
    const next = mine && pd.req.type === 'free' && !TR.forcePlay;
    const lost = mine && ['free', 'deploy', 'blockDeploy'].includes(pd.req.type) && (!ST.tut || TR.lostOnly) && !ST.lostConfirm;
    let blk = '';
    if (mine && pd.req.type === 'blockDeploy' && pd.req.options.length && !ST.blockConfirm) {
      const bs = blockState();
      blk = `${pd.req.cancelable && !ST.tut ? '<button class="btn blkcancel" type="button" data-act="blockCancel">취소</button>' : ''}<button class="nextbtn on blkgo" type="button" data-act="blockGo" ${bs.ok ? '' : 'disabled'}>블록 결정 ▶</button>`;
    }
    return `${txt}<div class="netbtns">${lost ? '<button class="lostbtn" type="button" data-act="lostAsk">로스트 선언</button>' : ''}${blk}${next ? '<button class="nextbtn on" type="button" data-act="pass">다음으로 ▶</button>' : ''}</div>`;
  }
  function phasesHtml() {
    const g = ST.game; const tk = g.turnKind;
    const seq = ['serve', 'start', 'block', 'draw', 'receive', 'toss', 'attack', 'end'];
    const skip = ph => (tk === 'serve' && !['serve', 'end'].includes(ph)) || (tk === 'block' && ['serve', 'draw', 'receive', 'toss', 'attack'].includes(ph)) || (tk === 'receive' && ['serve', 'block'].includes(ph)) || (tk === 'normal' && ph === 'serve');
    return seq.map(ph => `<span class="ph ${g.phase === ph ? 'on' : ''} ${skip(ph) ? 'skip' : ''}">${PHASE_KO[ph].replace(' 페이즈', '')}</span>`).join('');
  }

  // 選択可能なカード
  function selectable() {
    const pd = ST.pending; if (!pd) return null;
    const r = pd.req;
    if (['deploy', 'blockDeploy', 'mulligan', 'free'].includes(r.type)) return new Set(r.options);
    if (r.type === 'choose' && !r.textOptions && r.zone !== 'court' && r.zone !== 'look') {
      const h = ST.game.players[r.player].hand.map(c => c.uid);
      if (r.options.every(u => h.includes(u))) return new Set(r.options);
    }
    return null;
  }

  // 카드 아래 능력치 줄 (카드 그림은 가리지 않음). 색은 매트의 에리어 색과 같음
  const STAT_KEYS = [['serve', '서'], ['block', '블'], ['receive', '리'], ['toss', '토'], ['attack', '어']];
  function statRow(no) {
    const d = DB[no];
    if (d.type !== 'C') return `<div class="hc-prm ev"><span>${(d.timing || []).map(t => TIMING_KO[t]).join('·')} 이벤트</span></div>`;
    return `<div class="hc-prm">${STAT_KEYS.map(([k, l]) => { const v = d.params[k]; return `<span class="s-${k}${v == null ? ' na' : ''}" title="${PARAM_KO[k]} ${v == null ? '－' : v}"><i>${l}</i><b>${v == null ? '－' : v}</b></span>`; }).join('')}</div>`;
  }
  // 필드에서 직접 고르는 대상 (리시브 +1 대상 등)
  function courtTargets() {
    const pd = ST.pending; if (!pd || ST.handoff !== null) return null;
    const r = pd.req;
    return r.type === 'choose' && r.zone === 'court' && r.player === ST.viewer ? new Set(r.options) : null;
  }
  // ── 드로우 연출: 덱(또는 세트 에리어)에서 카드가 날아와 패에 들어감 ──
  function trackDraws() {
    const g = ST.game; const me = g.players[ST.viewer], op = g.players[1 - ST.viewer];
    const prev = ST.drawSnap;
    const snap = { g, phase: g.phase, viewer: ST.viewer, hand: new Set(me.hand.map(c => c.uid)), deck: new Set(me.deck.map(c => c.uid)), set: new Set(me.setArea.map(c => c.uid)), oh: op.hand.length, od: op.deck.length, os: op.setArea.length };
    ST.drawSnap = snap;
    if (!prev || prev.g !== g || prev.viewer !== ST.viewer || g.phase === 'setup' || ST.speed === 'instant' || ST.handoff !== null || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (prev.phase === 'setup') {   // 멀리건이 끝나고 경기가 시작될 때: 첫 패를 덱에서 한 장씩 뽑아 오는 연출
      me.hand.forEach((c, i) => flyDraw(c, 'deck', ST.viewer, i));

  function keywordsFor(text) { return text ? KEYWORDS.filter(k => k.re.test(text) && !(k.skip && k.skip.test(text))) : []; }

  function renderDetail() {
    const g = ST.game; const el = $('#cardInfo'); const d = ST.detail;
    if (!d) { el.hidden = true; el.innerHTML = ''; el.dataset.key = ''; return; }
    const key = d.list ? 'L' + d.title : d.static ? 'S' + d.static.no + d.static.ver : d.card.uid + ':' + (d.area || '');
    if (d.list) {

      let stack = '';
      if (d.area && g) {

        const gutsList = st.slice(0, -1).reverse();
        stack = `<div class="stacklist"><span class="kr" style="width:100%;font-size:11.5px;color:var(--muted)">${AREA_KO[d.area]} 에리어 가츠 ${gutsList.length}장 (위에서부터)</span>${gutsList.map(x => cardHtml(x)).join('')}</div>`;
      }
      const kws = keywordsFor(info.ko);
      el.innerHTML = `<div class="ci-main"><div class="big"><img src="${imgOf(c)}" alt="${esc(KN(c.no))}"></div><div>
        <h3>${esc(KN(c.no))}</h3><div class="attrs">${esc(attrs)}</div>${prm}
        ${info.ko ? `<p class="sk ko">${esc(info.ko)}</p>` : '<p class="sk ko none">스킬 없음</p>'}</div>${stack}<div class="hint">${kws.length && !d.hover ? `<button class="kwbtn" type="button" data-kw>${ST.kwOpen ? '키워드 설명 닫기' : `키워드 설명 ${kws.length}개 보기`}</button>` : ''}<span>${d.hover ? `카드를 누르면 고정돼요${kws.length ? ' · 키워드 설명은 고정한 뒤에' : ''}` : '바깥을 누르면 닫혀요'}</span></div></div>
        ${kws.length && ST.kwOpen && !d.hover ? `<div class="ci-kw"><h4>키워드 설명</h4><dl>${kws.map(k => `<div><dt>${esc(k.k)}</dt><dd>${esc(k.d)}</dd></div>`).join('')}</dl></div>` : ''}`;
    }
    el.classList.toggle('hover', !!d.hover);
    if (el.dataset.key !== key) { el.hidden = false; el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }
    el.hidden = false; el.dataset.key = key;
  }

  function renderLog() {
    const g = ST.game; const el = $('#log');
    if (g.log.length === ST.logLen && el.dataset.open === String(ST.logOpen)) return;
    el.dataset.open = String(ST.logOpen); $('#logbox').classList.toggle('open', ST.logOpen);
    const atBottom = !ST.logOpen || el.scrollHeight - el.scrollTop - el.clientHeight < 40 || ST.logLen === 0;
    const items = g.log.slice(ST.logOpen ? -400 : -14).map(l => `<div class="l ${l.player === 0 ? 'p0' : l.player === 1 ? 'p1' : ''} ${l.kind}">${esc(l.text)}</div>`).join('');
    el.innerHTML = items; ST.logLen = g.log.length;
    if (atBottom) el.scrollTop = el.scrollHeight;
  }

  function renderHandoff() {
    const root = $('#modalRoot');
    if (ST.handoff === null) { if (root.dataset.kind === 'handoff') closeModal(); return; }
    if (root.dataset.kind) return;   // 設定・結果シートが開いている間は上書きしない
    const g = ST.game; const p = ST.handoff;
    root.dataset.kind = 'handoff';
    root.innerHTML = `<div class="modal"><div class="sheet" ${teamStyle(p)}><h1 style="color:var(--team)">${esc(g.pname(p))} 차례</h1><div class="sub">상대가 패를 보지 않도록 화면을 넘긴 뒤 확인을 누르세요.</div><div class="acts" style="display:flex;gap:8px"><button class="btn primary" id="handoffOk" type="button">확인</button></div></div></div>`;
    $('#handoffOk').addEventListener('click', () => { ST.viewer = ST.handoff; ST.handoff = null; ST.prevTops = {}; closeModal(); render(); });
    $('#handoffOk').focus();
  }

  // ───────── 入力 ─────────
  document.addEventListener('click', e => {
    if (ST.dragJustEnded) { ST.dragJustEnded = false; return; }
    if (e.target.closest('#screen') || e.target.closest('#coach')) return;   // 로비 화면·튜토리얼 코치는 각자 처리
    const kwb = e.target.closest('#cardInfo [data-kw]');
    if (kwb) { ST.kwOpen = !ST.kwOpen; renderDetail(); return; }
    if (!ST.game) { if (ST.detail) { ST.detail = null; renderDetail(); } return; }
    const sfc = e.target.closest('.sf-card[data-uid]');
    if (sfc) { const c = findCard(ST.game, +sfc.dataset.uid); if (c) { const a = ST.game.charArea(c); ST.detail = { card: c, area: a || undefined }; render(); } return; }
    if (e.target.closest('#modalRoot .modal') && !e.target.closest('[data-act]')) return;   // 설정 시트 등 모달 안
    const inLog = e.target.closest('#logbox');
    if (inLog) { if (e.target.closest('#logClose')) ST.logOpen = false; else if (!ST.logOpen) ST.logOpen = true; else return; ST.detail = null; render(); return; }
    if (ST.logOpen && !e.target.closest('#btnLog')) { ST.logOpen = false; render(); }
    if (e.target.closest('.cbox') && !e.target.closest('[data-act]') && !e.target.closest('.card[data-uid]')) return;
    const actEl = e.target.closest('[data-act]');
    if (actEl) { ST.detail = null; onAct(actEl.dataset.act, actEl); render(); return; }
    const cardEl = e.target.closest('.card[data-uid]');
    if (cardEl) { onCard(+cardEl.dataset.uid, cardEl); return; }
    // 그 밖의 곳을 누르면 정보창을 닫는다. 에리어/드롭/이벤트는 해당 정보를 연다.
    let next = null;
    const areaEl = e.target.closest('.area[data-area]');
    if (areaEl) {
      const p = +areaEl.dataset.p, a = areaEl.dataset.area; const pl = ST.game.players[p];
      const t = pl.areas[a][pl.areas[a].length - 1];
      if (t) next = { card: t, area: a };
      const TG = courtTargets();
      if (TG) { const hit = [t, ...(a === 'block' ? pl.sides : [])].find(x => x && TG.has(x.uid)); if (hit && (a !== 'block' || hit === t)) { ST.detail = null; answer([hit.uid]); render(); return; } }
    }
    const zoneEl = !areaEl && e.target.closest('.zone[data-zone]');
    if (zoneEl) {
      const p = +zoneEl.dataset.p, z = zoneEl.dataset.zone; const pl = ST.game.players[p];
      if (z === 'drop') next = { list: pl.drop.slice().reverse(), title: `${ST.game.pname(p)} · 드롭 에리어 ${pl.drop.length}장` };
      else if (z === 'event') next = { list: pl.event.slice().reverse(), title: `${ST.game.pname(p)} · 이벤트 에리어 ${pl.event.length}장` };
    }
    if (next || ST.detail) { ST.detail = next; render(); }
  });

  // ───────── 드래그로 사용 ─────────
  let drag = null;
  function dragKind(uid) {
    const pd = ST.pending; if (!pd || ST.handoff !== null || pd.req.player !== ST.viewer) return null;
    const r = pd.req;
    if (['deploy', 'blockDeploy', 'free'].includes(r.type) && r.options.includes(uid)) return r.type;
    return null;
  }
  function dropTargets(kind) {
    const r = ST.pending.req, p = ST.viewer;
    if (kind === 'deploy') return [...document.querySelectorAll(`.area[data-area="${r.area}"][data-p="${p}"]`)];
    if (kind === 'blockDeploy') return [...document.querySelectorAll(`.area[data-area="block"][data-p="${p}"]`)];
    return [$('#arena')];
  }
  // ── 터치: 카드를 꾹 누르면 정보창 (누른 뒤의 클릭은 무시해서 카드가 골라지지 않게) ──
  let lp = null, swallowClick = false;
  function pinInfo(t) {
    if (t.dataset.cardno) { showCardInfo(t.dataset.cardno); return; }
    const g = ST.game; if (!g) return; const c = findCard(g, +t.dataset.uid); if (!c) return;
    const a = g.charArea(c); ST.detail = { card: c, area: a || undefined }; renderDetail();
  }
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    const t = hoverTarget(e.target); if (!t) return;
    clearTimeout(lp && lp.timer);
    lp = { x: e.clientX, y: e.clientY, fired: false };
    lp.timer = setTimeout(() => {
      if (!lp || (drag && drag.started)) return;
      lp.fired = true; drag = null;
      try { navigator.vibrate && navigator.vibrate(12); } catch (er) {}
      pinInfo(t);
    }, 430);
  }, true);
  document.addEventListener('pointermove', e => { if (lp && !lp.fired && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) { clearTimeout(lp.timer); lp = null; } }, true);
  const lpEnd = () => { if (!lp) return; clearTimeout(lp.timer); if (lp.fired) { swallowClick = true; setTimeout(() => { swallowClick = false; }, 450); } lp = null; };
  document.addEventListener('pointerup', lpEnd, true);
  document.addEventListener('pointercancel', lpEnd, true);
  document.addEventListener('click', e => { if (swallowClick) { swallowClick = false; e.stopPropagation(); e.preventDefault(); } }, true);
  document.addEventListener('contextmenu', e => { if (hoverTarget(e.target)) e.preventDefault(); });
  // 휴대폰 상단 ⋯ 메뉴 (로그 · 설정 · 기권)
  $('#btnMore').addEventListener('click', e => { e.stopPropagation(); const r = document.querySelector('.tb-right'); const o = r.classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', o); });
  document.addEventListener('click', e => { const r = document.querySelector('.tb-right.open'); if (r && !e.target.closest('#btnMore')) { r.classList.remove('open'); $('#btnMore').setAttribute('aria-expanded', 'false'); } });
  $('#allowLand').addEventListener('click', () => document.body.classList.add('allow-land'));

  // 마우스를 카드 위에 올리면 누르지 않아도 정보창 (누르면 고정). 눌러서 연 정보창이 있으면 그대로 둔다
  let hoverT = 0, hoverKey = null;
  function hoverTarget(t) { return t && t.closest ? t.closest('.card[data-uid], .mcard[data-uid], .sf-card[data-uid], [data-cardno]') : null; }
  function clearHover() { if (ST.detail && ST.detail.hover) { ST.detail = null; renderDetail(); } }
  function showHover(t) {
    if (ST.detail && !ST.detail.hover) return;
    if (!document.body.contains(t)) return;
    if (t.dataset.cardno) { ST.detail = { static: { no: t.dataset.cardno, ver: DB[t.dataset.cardno].img || 'D' }, hover: true }; renderDetail(); return; }
    const g = ST.game; if (!g) return; const c = findCard(g, +t.dataset.uid); if (!c) return;
    const area = g.charArea(c);
    ST.detail = { card: c, area: area || undefined, hover: true }; renderDetail();
  }
  document.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || drag) return;
    const t = hoverTarget(e.target);
    const key = t ? (t.dataset.uid ? 'u' + t.dataset.uid : 'n' + t.dataset.cardno) : null;
    if (key === hoverKey) return;
    hoverKey = key; clearTimeout(hoverT);
    hoverT = key ? setTimeout(() => showHover(t), 160) : setTimeout(clearHover, 120);
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => { hoverKey = null; clearTimeout(hoverT); clearHover(); });
  document.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const cardEl = e.target.closest('#hand .hc .card'); if (!cardEl) return;
    const uid = +cardEl.dataset.uid; const kind = dragKind(uid); if (!kind) return;
    drag = { uid, kind, x0: e.clientX, y0: e.clientY, started: false, hc: cardEl.closest('.hc'), ghost: null, over: null };
  });
  document.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.started) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 10) return;
      drag.started = true;
      const c = findCard(ST.game, drag.uid);
      const gh = document.createElement('div'); gh.className = 'dragghost'; gh.innerHTML = `<img src="${imgOf(c)}" alt="">`;
      gh.style.width = handWidth() + 'px';
      document.body.appendChild(gh); drag.ghost = gh;
      drag.hc.classList.add('dragging'); document.body.classList.add('is-dragging');
      drag.targets = dropTargets(drag.kind); drag.targets.forEach(t => t.classList.add('droptarget'));
      ST.detail = null; renderDetail();
    }
    e.preventDefault();
    const w = drag.ghost.offsetWidth, h = w * 1.4;
    drag.ghost.style.transform = `translate(${e.clientX - w / 2}px, ${e.clientY - h * .55}px) rotate(${Math.max(-12, Math.min(12, (e.clientX - drag.x0) / 30))}deg)`;
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const over = hit && drag.targets.find(t => t.contains(hit)) || null;
    if (over !== drag.over) { if (drag.over) drag.over.classList.remove('over'); if (over) over.classList.add('over'); drag.over = over; }
  }, { passive: false });
  function endDrag(commit) {
    const d = drag; drag = null; if (!d) return;
    if (!d.started) return;
    ST.dragJustEnded = true; setTimeout(() => { ST.dragJustEnded = false; }, 0);
    d.ghost.remove(); d.hc.classList.remove('dragging'); document.body.classList.remove('is-dragging');
    d.targets.forEach(t => t.classList.remove('droptarget', 'over'));
    if (!commit || !d.over || !ST.pending) return;
    const r = ST.pending.req;
    if (d.kind === 'deploy') answer(d.uid);
    else if (d.kind === 'free') answer({ action: 'play', uid: d.uid });
    else if (d.kind === 'blockDeploy') stageBlock(d.uid, r);
    render();
  }
  document.addEventListener('pointerup', () => endDrag(true));
  document.addEventListener('pointercancel', () => endDrag(false));
  window.addEventListener('resize', () => { if (ST.game) render(); });
  // 글자 선택·이미지 끌기 기본 동작 막기 (카드 드래그는 포인터 이벤트로 따로 처리)
  document.addEventListener('selectstart', e => { if (!e.target.closest || !e.target.closest('input, textarea')) e.preventDefault(); });
  document.addEventListener('dragstart', e => e.preventDefault());

  function onCard(uid, el) {
    const g = ST.game; const c = findCard(g, uid); if (!c) return;
    const TG = courtTargets();
    if (TG && TG.has(uid) && el.closest('.mat')) { ST.detail = null; answer([uid]); render(); return; }
    const inHand = el.closest('#hand'); const inTiles = el.closest('.tiles');
    if (ST.detail && !ST.detail.hover && ST.detail.card === c && !inHand && !inTiles) { ST.detail = null; render(); return; }
    // 自分の非公開カードのみ詳細表示 (相手の手札はそもそも描画しない)
    const area = g.charArea(c);
    if (!el.closest('#center')) ST.detail = { card: c, area: area || undefined };
    const pd = ST.pending;
    if (pd && pd.req.player === ST.viewer && ST.handoff === null) {
      const r = pd.req;
      if (inHand) {
        const sel = selectable();
        if (sel && sel.has(uid)) toggleSel(uid, r);
      } else if (inTiles && (r.type === 'choose' || r.type === 'order')) {
        if (r.type === 'order' || r.options.includes(uid)) toggleSel(uid, r);
      }
    }
    render();
  }
  // 블록 캐릭터 올리기: 같은 이름은 교체, 최대 장수까지
  function stageBlock(uid, r) {
    if (ST.sel.includes(uid)) return;
    const g = ST.game; const name = DB[findCard(g, uid).no].name;
    const dupIdx = ST.sel.findIndex(u => DB[findCard(g, u).no].name === name);
    if (dupIdx >= 0) ST.sel.splice(dupIdx, 1, uid);
    else if (ST.sel.length < r.max) ST.sel.push(uid);
    else ST.sel.splice(ST.sel.length - 1, 1, uid);   // 꽉 찼으면 마지막 사이드와 교체
  }
  function blockState() {
    const g = ST.game; const cards = ST.sel.map(u => findCard(g, u)).filter(Boolean);
    const sum = cards.reduce((s2, c) => s2 + (g.base(c, 'block') ?? 0), 0);
    const op = g.offense ? g.offense.value : 0;
    const TR = ST.tutRestrict || {};
    const ok = cards.length > 0 && !(TR.minSum && sum < TR.minSum);
    return { cards, sum, op, ok };
  }
  function toggleSel(uid, r) {
    const i = ST.sel.indexOf(uid);
    if (i >= 0) { ST.sel.splice(i, 1); return; }
    const single = ['deploy', 'free', 'start'].includes(r.type) || (r.type === 'choose' && (r.max ?? 1) === 1);
    if (single) ST.sel = [uid];
    else if (r.type === 'blockDeploy') stageBlock(uid, r);
    else if (r.type === 'choose') { if (ST.sel.length < (r.max ?? 1)) ST.sel.push(uid); }
    else ST.sel.push(uid);
  }

  function onAct(act, el) {
    if (act === 'newgame') { leaveGame(); window.VobacaLobby && window.VobacaLobby.show('ai'); return; }
    const pd = ST.pending; if (!pd) return;
    const r = pd.req;
    switch (act) {
      case 'yes': answer(true); break;
      case 'no': answer(false); break;
      case 'mull': answer(ST.sel.slice()); break;
      case 'block': answer(r.type === 'start' ? 'block' : { uids: ST.sel.slice(), center: ST.sel[0] }); break;
      case 'receive': answer('receive'); break;
      case 'unstage': { const u = +el.dataset.uid; ST.sel = ST.sel.filter(x => x !== u); break; }
      case 'blockGo': if (blockState().ok) { if (ST.tut) answer({ uids: ST.sel.slice(), center: ST.sel[0] }); else ST.blockConfirm = true; } break;
      case 'blockYes': ST.blockConfirm = false; answer({ uids: ST.sel.slice(), center: ST.sel[0] }); break;
      case 'blockNo': ST.blockConfirm = false; break;
      case 'blockCancel': ST.blockConfirm = false; answer({ cancel: true }); break;
      case 'mtoggle': { const u = +el.dataset.uid; const i = ST.sel.indexOf(u); if (i >= 0) ST.sel.splice(i, 1); else ST.sel.push(u); break; }
      case 'center': { const u = +el.dataset.uid; const i = ST.sel.indexOf(u); if (i > 0) { ST.sel.splice(i, 1); ST.sel.unshift(u); } break; }
      case 'deploy': if (ST.sel[0]) answer(ST.sel[0]); break;
      case 'play': if (ST.sel[0]) answer({ action: 'play', uid: ST.sel[0] }); break;
      case 'pass': answer({ action: 'pass' }); break;
      case 'lostAsk': ST.lostConfirm = true; render(); break;
      case 'lostNo': ST.lostConfirm = false; render(); break;
      case 'lostYes': ST.lostConfirm = false; answer(r.type === 'free' ? { action: 'lost' } : null); break;
      case 'opt': answer([el.dataset.id]); break;
      case 'optNone': answer([]); break;
      case 'choose': answer(ST.sel.slice()); break;
      case 'order': answer(ST.sel.slice()); break;
      case 'orderDefault': answer(r.options.slice()); break;
    }
    render();
  }

  // ───────── モーダル ─────────
  function closeModal() { const root = $('#modalRoot'); root.innerHTML = ''; delete root.dataset.kind; }
  function showSetup() {
    const root = $('#modalRoot'); root.dataset.kind = 'setup';
    const saved = (() => { try { return JSON.parse(localStorage.getItem('vobaca-setup') || 'null'); } catch { return null; } })() || {};
    const mode = saved.mode || 'cpu', deck = saved.deck || 'karasuno', speed = ST.speed || saved.speed || 'normal';
    root.innerHTML = `<div class="modal"><form class="sheet" id="setupForm">
      <h1>바보카!! BREAK</h1>
      <div class="sub">스타터 덱 카라스노 고교(HV-D01) vs 네코마 고교(HV-D02) · 종합 룰 ver.1.06 기준</div>
      <div class="fieldlab">대전 방식</div>
      <div class="seg">
        <label><input type="radio" name="mode" id="mode-cpu" value="cpu" ${mode === 'cpu' ? 'checked' : ''}><b>CPU 대전</b><span>상대는 컴퓨터가 조작</span></label>
        <label><input type="radio" name="mode" id="mode-pvp" value="pvp" ${mode === 'pvp' ? 'checked' : ''}><b>2인 대전</b><span>한 화면을 번갈아 사용</span></label>
      </div>
      <div class="fieldlab">내 덱 (P1)</div>
      <div class="seg">
        <label><input type="radio" name="deck" id="deck-k" value="karasuno" ${deck === 'karasuno' ? 'checked' : ''}><b style="color:var(--karasuno)">카라스노 고교</b><span>HV-D01 · 히나타/카게야마 콤비</span></label>
        <label><input type="radio" name="deck" id="deck-n" value="nekoma" ${deck === 'nekoma' ? 'checked' : ''}><b style="color:var(--nekoma)">네코마 고교</b><span>HV-D02 · 수비와 블록</span></label>
      </div>
      <div class="fieldlab">진행 속도 · 연출</div>
      <div class="seg three">
        <label><input type="radio" name="speed" id="speed-n" value="normal" ${speed === 'normal' ? 'checked' : ''}><b>보통</b><span>공 연출을 끝까지</span></label>
        <label><input type="radio" name="speed" id="speed-f" value="fast" ${speed === 'fast' ? 'checked' : ''}><b>빠르게</b><span>연출 2배속</span></label>
        <label><input type="radio" name="speed" id="speed-i" value="instant" ${speed === 'instant' ? 'checked' : ''}><b>연출 끄기</b><span>바로 진행</span></label>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap"><span class="preload" id="preloadNote"></span>${ST.game && ST.game.phase !== 'gameover' ? '<button class="btn" type="button" id="setupCancel">계속하기</button>' : ''}<button class="btn primary" type="submit">경기 시작</button></div>
    </form></div>`;
    updatePreload();
    $('#setupForm').addEventListener('submit', ev => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const o = { mode: f.get('mode'), deck: f.get('deck'), speed: f.get('speed') };
      try { localStorage.setItem('vobaca-setup', JSON.stringify(o)); } catch {}

    const cancel = $('#setupCancel'); if (cancel) cancel.addEventListener('click', () => { closeModal(); render(); });
  }
  // 경기 결과: 승리/패배 연출 + 세트마다 마지막 점수를 낸 카드
  function showResult() {
    const g = ST.game; if (g.winner == null) return;
    const root = $('#modalRoot'); root.dataset.kind = 'result';
    const win = g.winner === ST.viewer;
    SND(win ? 'win' : 'lose');
    const won = p => g.history.filter(h => h.winner === p && !h.concede).length;
    const KIND = { serve: '서브', attack: '어택', block: '블록' };
    const rows = g.history.map((h, i) => {
      const tc = TEAM_COLOR[teamOf(h.winner)];
      if (h.concede) return `<li style="--d:${i};--tc:${tc}"><span class="rs-set">기권</span><span class="rs-win">${esc(g.pname(h.winner))} 승리</span><span class="rs-why">${esc(g.pname(1 - h.winner))} 기권</span></li>`;
      const sc = h.scorer;
      const kind = sc ? (sc.type === 'block' && sc.value > 0 ? '도샷' : KIND[sc.type]) : '';
      const card = sc && sc.lead ? `<button type="button" class="rs-card" data-cardno="${sc.lead.no}" title="${esc(KN(sc.lead.no))}"><img src="${imgOf(sc.lead)}" alt=""></button>` : `<span class="rs-card none">—</span>`;
      const who = sc && sc.lead ? `<b>${esc(KN(sc.lead.no))}</b><span>${kind} · OP ${sc.value}${sc.assist && sc.type === 'attack' ? ` <em>(토스 ${esc(KN(sc.assist.no))})</em>` : ''}</span>` : `<b>${h.reason === '로스트 선언' ? '로스트 선언' : '상대 실수'}</b><span>공을 보내지 않고 얻은 세트</span>`;
      const why = h.reason ? `${esc(g.pname(h.loser ?? (1 - h.winner)))} ${esc(h.reason)}` : '';
      return `<li style="--d:${i};--tc:${tc}"><span class="rs-set">세트 ${h.set}</span>${card}<div class="rs-who">${who}<small>${why}</small></div><span class="rs-win">${esc(g.pname(h.winner))}</span></li>`;
    }).join('');
    // 가장 많이 결정타를 낸 카드 (2세트 이상일 때)
    const cnt = {}; for (const h of g.history) if (h.scorer && h.scorer.lead && h.winner === g.winner) { const k = h.scorer.lead.no; cnt[k] = (cnt[k] || { n: 0, c: h.scorer.lead }); cnt[k].n++; }
    const top = Object.values(cnt).sort((a, b) => b.n - a.n)[0];
    const mvp = top ? `<div class="rs-mvp" style="--d:${g.history.length}"><img src="${imgOf(top.c)}" alt=""><div><span>${win ? '오늘의 해결사' : '상대의 해결사'}</span><b>${esc(KN(top.c.no))}</b><small>결정타 ${top.n}회</small></div></div>` : '';
    root.innerHTML = `<div class="modal resmodal ${win ? 'win' : 'lose'}" ${teamStyle(g.winner)}><div class="res-fx" aria-hidden="true"></div>
      <div class="sheet result2" role="dialog" aria-label="경기 결과">
        <div class="res-title"><span class="res-big">${win ? '승리!' : '패배…'}</span><small>${esc(g.pname(g.winner))}의 승리</small></div>
        <div class="res-score"><span style="color:${TEAM_COLOR[teamOf(0)]}">${esc(g.pname(0))}</span><b>${won(0)}</b><i>:</i><b>${won(1)}</b><span style="color:${TEAM_COLOR[teamOf(1)]}">${esc(g.pname(1))}</span></div>
        <ol class="res-sets">${rows}</ol>${mvp}
        <div class="res-acts"><button class="btn" type="button" id="resClose">보드 보기</button><button class="btn primary" type="button" data-act="newgame">로비로</button></div>
      </div></div>`;
    $('#resClose').addEventListener('click', () => { closeModal(); render(); });
    root.querySelectorAll('.rs-card[data-cardno]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); showCardInfo(b.dataset.cardno); }));
    if (win && !matchMedia('(prefers-reduced-motion: reduce)').matches) confetti(root.querySelector('.res-fx'), [TEAM_COLOR[teamOf(g.winner)], 'var(--ball)', '#ffffff']);
  }
  function confetti(box, colors) {
    const W = innerWidth, H = innerHeight;
    for (let i = 0; i < 70; i++) {
      const d = document.createElement('i'); d.className = 'cf';
      d.style.background = colors[i % colors.length]; d.style.left = (Math.random() * W) + 'px';
      const sz = 6 + Math.random() * 8; d.style.width = sz + 'px'; d.style.height = sz * (0.4 + Math.random() * .6) + 'px';
      box.appendChild(d);
      const x = (Math.random() - .5) * 240, r = (Math.random() - .5) * 1080, dur = 2200 + Math.random() * 2200, delay = Math.random() * 900;
      d.animate([{ transform: `translate(0, -40px) rotate(0deg)`, opacity: 1 }, { transform: `translate(${x}px, ${H + 60}px) rotate(${r}deg)`, opacity: .9 }], { duration: dur, delay, easing: 'cubic-bezier(.25,.6,.4,1)', fill: 'both' })
        .finished.then(() => d.remove()).catch(() => {});
    }
  }

  $('#btnBack').addEventListener('click', () => { ST.detail = null; confirmLeave(); });
  function confirmLeave() {
    const root = $('#modalRoot'); root.dataset.kind = 'leave';
    root.innerHTML = `<div class="modal"><div class="sheet"><h1>로비로 나갈까요?</h1><div class="sub">${ST.tut ? '튜토리얼을 그만두고 로비로 돌아갑니다.' : '진행 중인 경기는 끝나고 로비로 돌아갑니다.'}</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" type="button" id="leaveNo">계속하기</button><button class="btn primary" type="button" id="leaveYes">로비로</button></div></div></div>`;
    $('#leaveNo').addEventListener('click', () => { closeModal(); if (ST.game) render(); });
    $('#leaveYes').addEventListener('click', () => { const tut = !!ST.tut; leaveGame(); window.VobacaLobby && window.VobacaLobby.show(tut ? 'tutorial' : 'battle'); });
  }
  $('#btnLog').addEventListener('click', () => { ST.logOpen = !ST.logOpen; render(); });
  $('#btnSettings').addEventListener('click', showSettings);
  function showSettings() {
    const root = $('#modalRoot'); root.dataset.kind = 'settings';
    root.innerHTML = `<div class="modal"><form class="sheet" id="setForm">
      <h1>설정</h1>
      <div class="fieldlab">진행 속도 · 연출</div>
      <div class="seg three">
        <label><input type="radio" name="speed" value="normal" ${ST.speed === 'normal' ? 'checked' : ''}><b>보통</b><span>공 연출을 끝까지</span></label>
        <label><input type="radio" name="speed" value="fast" ${ST.speed === 'fast' ? 'checked' : ''}><b>빠르게</b><span>연출 2배속</span></label>
        <label><input type="radio" name="speed" value="instant" ${ST.speed === 'instant' ? 'checked' : ''}><b>연출 끄기</b><span>바로 진행</span></label>
      </div>
      <div class="fieldlab">프리 스텝</div>
      <div class="seg">
        <label><input type="radio" name="auto" value="1" ${ST.autoPass ? 'checked' : ''}><b>자동 진행</b><span>낼 이벤트가 없으면 바로 넘김</span></label>
        <label><input type="radio" name="auto" value="0" ${ST.autoPass ? '' : 'checked'}><b>매번 확인</b><span>프리 스텝마다 멈춤</span></label>
      </div>
      <div class="fieldlab">소리</div>
      ${window.VobacaAudio ? window.VobacaAudio.prefsHtml() : ''}
      <div class="sub" style="margin:0">로스트 선언은 네트 오른쪽 「로스트 선언」 버튼으로 할 수 있습니다(프리 스텝·등장 단계).</div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn primary" type="submit">닫기</button></div>
    </form></div>`;
    $('#setForm').addEventListener('change', ev => { if (ev.target.name && ev.target.name.startsWith('snd')) return; const f = new FormData(ev.currentTarget); ST.speed = f.get('speed'); ST.autoPass = f.get('auto') === '1'; savePrefs(); });
    if (window.VobacaAudio) window.VobacaAudio.bindPrefs($('#setForm'));
    $('#setForm').addEventListener('submit', ev => { ev.preventDefault(); closeModal(); render(); });
  }
  $('#btnConcede').addEventListener('click', () => {
    const g = ST.game; if (!g || g.winner != null) return;
    if (ST.tut) { confirmLeave(); return; }
    const p = ST.mode === 'pvp' ? (ST.pending ? ST.pending.req.player : ST.viewer) : 0;
    if (!confirmConcede(p)) return;
  });
  function confirmConcede(p) {
    const g = ST.game; const root = $('#modalRoot'); root.dataset.kind = 'concede';
    root.innerHTML = `<div class="modal"><div class="sheet" ${teamStyle(p)}><h1 style="color:var(--team)">기권할까요?</h1><div class="sub">${esc(g.pname(p))}이(가) 기권하면 즉시 패배합니다. (종합 룰 0-1-3-2)</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" type="button" id="concNo">취소</button><button class="btn danger" type="button" id="concYes">기권</button></div></div></div>`;
    $('#concNo').addEventListener('click', () => { closeModal(); render(); });
    $('#concYes').addEventListener('click', () => { ST.pending = null; ST.handoff = null; g.concede(p); closeModal(); render(); showResult(); });
    return false;
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('#modalRoot').dataset.kind === 'setup' && ST.game) { closeModal(); render(); }
  });

  // 外部 (로비·튜토리얼) から使う API
  function showCardInfo(no, ver) { ST.detail = no ? { static: { no, ver: ver || DB[no].img || 'D' } } : null; renderDetail(); }
  window.VobacaUI = { ST, render, startGame, leaveGame, showCardInfo, renderDetail, imgOf, KN, esc, keywordsFor: t => keywordsFor(t), savePrefs, PRELOAD, updatePreload, deckTeam, TEAM_COLOR };
})();

</script>
<script>
// 체험형 튜토리얼: 챕터마다 판을 미리 깔아 두고(preset), 코치 말풍선이 페이즈별로 할 일을 안내한다.
// 플레이어는 실제 엔진 위에서 직접 카드를 내고, 안내된 선택지만 고를 수 있게 제한한다.
(function (G) {
  'use strict';
  const { DECKS } = G.VobacaCards;
  const K = n => 'HV-D01-' + String(n).padStart(3, '0');   // 카라스노
  const N = n => 'HV-D02-' + String(n).padStart(3, '0');   // 네코마

  // ───── 판 배치 ─────
  function take(g, p, no) {
    const pl = g.players[p];
    let i = pl.deck.findIndex(c => c.no === no && c.ver === 'D');
    if (i < 0) i = pl.deck.findIndex(c => c.no === no);
    if (i < 0) throw new Error('tutorial: card not in deck ' + no);
    return pl.deck.splice(i, 1)[0];
  }
  function arrange(g, spec) {
    for (const p of [0, 1]) {
      const sp = spec['p' + p] || {}; const pl = g.players[p];
      g.shuffle(pl.deck);
      for (const no of sp.hand || []) pl.hand.push(take(g, p, no));
      for (const [a, nos] of Object.entries(sp.areas || {})) for (const no of nos) pl.areas[a].push(take(g, p, no));
      const top = (sp.deckTop || []).map(no => take(g, p, no));
      for (let i = 0; i < (sp.set ?? 2); i++) pl.setArea.push(pl.deck.shift());
      for (const c of top.reverse()) pl.deck.push(c);           // deck.pop() 이 위 → 목록 첫 장이 먼저 뽑힌다
    }
    return { server: spec.server ?? 0, start: spec.start || null };
  }

  // ───── CPU 대본 ─────
  function cpuDecider(script) {
    const used = new Set();
    return (g, req) => {
      for (let i = 0; i < script.length; i++) {
        if (used.has(i)) continue;
        const r = script[i];
        if (r.type !== req.type || (r.area && r.area !== req.area) || (r.phase && r.phase !== req.phase)) continue;
        used.add(i);
        if (req.type === 'deploy') {
          const c = req.options.map(u => g.players[req.player].hand.find(x => x.uid === u)).find(x => x && x.no === r.no);
          return c ? c.uid : undefined;
        }
        if ('answer' in r) return r.answer;
      }
      if (req.type === 'yesno') return false;
      if (req.type === 'free') return { action: 'pass' };
      if (req.type === 'start') return 'receive';
      return undefined;
    };
  }

  // ───── 단계 매칭 ─────
  // step.on: 'req' | 'before' | 'after'  (before/after = 연출 이벤트 전후), step.m: 조건 함수
  function stepMatches(st, kind, x, when) {
    if (st.on === 'req') return kind === 'req' && (!st.m || st.m(x));
    return kind === 'anim' && st.on === when && (!st.m || st.m(x));
  }
  const area = (a, p = 0) => `.area[data-area="${a}"][data-p="${p}"]`;
  const handCard = no => `#hand .hc[data-no="${no}"]`;
  const zone = (z, p = 0) => `.zone[data-zone="${z}"][data-p="${p}"]`;

  // ───── 챕터 ─────
  const CHAPTERS = [
    {
      id: 'goal', title: '경기의 목표 · 서브', short: '세트와 오펜스 포인트, 첫 서브',
      spec: {
        server: 0,
        p0: { hand: [K(4), K(8), K(9), K(10), K(3), K(1)] },
        p1: { hand: [N(5), N(7), N(6), N(8), N(2), N(1)] },
      },

  // ───── 디렉터 (브라우저 전용) ─────
  class Director {
    constructor(chIndex, hooks) {
      this.idx = chIndex; this.ch = CHAPTERS[chIndex]; this.i = 0; this.hooks = hooks;
      this.cpuDecide = cpuDecider(this.ch.cpu || []);
      this.cur = null; this.shown = null; this.finished = false;
    }
    get step() { return this.ch.steps[this.i]; }
    async advance(kind, x, when) {
      while (!this.finished && this.step && stepMatches(this.step, kind, x, when)) {
        const st = this.step;
        if (st.act) return st;
        await this.show(st, true);
        this.i++;
        if (st.end) { this.finish(); return null; }
      }
      return null;
    }
    async onAnim(g, ev, when) { await this.advance('anim', ev, when); }
    async onRequest(g, req) {
      const st = await this.advance('req', req);

      const UI = G.VobacaUI; const R = {};
      if (st.allow) {
        const ok = new Set(st.allow);
        const pl = g.players[req.player];
        if (Array.isArray(req.options) && !req.textOptions) {
          const keep = req.options.filter(u => { const c = pl.hand.find(x => x.uid === u) || G.VobacaAI.findCard(g, u); return c && ok.has(c.no); });
          req.options.splice(0, req.options.length, ...keep);
        }
      }
      if (st.lostOnly) { req.options.splice(0, req.options.length); R.lostOnly = true; }
      if (st.only) R.only = st.only;
      if (st.forcePlay) R.forcePlay = true;
      if (st.minSum) R.minSum = st.minSum;
      UI.ST.tutRestrict = R;
      this.cur = st;
      this.show(st, false);
    }
    onAnswered() {
      if (!this.cur) return;
      this.cur = null; this.i++;
      this.hide();
    }
    finish() {
      if (this.finished) return;
      this.finished = true; this.hide();
      const g = G.VobacaUI.ST.game; if (g) g.aborted = true;
      this.hooks.onFinish(this.idx);

    show(st, waitNext) {
      this.shown = st;
      const el = document.getElementById('coach'); const UI = G.VobacaUI;

      el.hidden = false; el.classList.toggle('acting', !waitNext);
      el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
      this.decorate();
      if (!waitNext) return Promise.resolve();
      return new Promise(res => { el.querySelector('.co-next').addEventListener('click', () => res(), { once: true }); });
    }
    hide() { this.shown = null; const el = document.getElementById('coach'); if (el) el.hidden = true; this.decorate(); }

    { id: 1111, cat: 'card', card: 'HV-D02-002', date: '2025-11-12', q: '【도샷(5)】은 무슨 뜻인가요?', a: '이 턴 종료 시 내 오펜스 포인트가 5가 되는 것을 말합니다. 상대 코트에 오펜스 포인트 5인 공이 넘어가고, 상대는 리시브 포인트가 5 이상이 되도록 리시브해야 합니다.' },

    { id: 1114, cat: 'card', card: 'HV-D02-012', date: '2025-10-09', q: '남은 덱이 3장일 때 이 카드를 플레이하면 어떻게 되나요?', a: '카드 1장을 뽑고 덱 위에서 2장을 본 뒤, 그중 해당 카드가 있으면 1장까지 공개해 패에 넣고, 넣지 않은 카드는 원하는 순서로 덱에 놓습니다.' },
    { id: 1115, cat: 'card', card: 'HV-D02-012', date: '2025-10-09', q: '이 카드로 덱 위 3장을 봤을 때 「하이바 레프」와 「이누오카 소」가 둘 다 있으면 둘 다 패에 넣을 수 있나요?', a: '아니요, 할 수 없습니다. 둘 중 1장만 패에 넣을 수 있습니다.' },
  ];
  G.VobacaQnA = { CAT, Q, source: 'https://www.takaratomy.co.jp/products/haikyuvobacabreak/rules/' };
