</script>
<script>
// 메인 로비 · 게임 로비 · 덱 만들기 · 카드 목록 · 튜토리얼 목록
(function () {
  'use strict';
  const { DB, CARDS, DECKS, AFF_KO, GRADE_KO } = window.VobacaCards;
  const UI = window.VobacaUI;
  const T = window.VobacaTutorial;
  const { CAT: QCAT, Q } = window.VobacaQnA;
  const { esc, KN } = UI;
  const $ = s => document.querySelector(s);
  const root = $('#screen');
  const PARAM = [['serve', '서브'], ['block', '블록'], ['receive', '리시브'], ['toss', '토스'], ['attack', '어택']];
  const TIMING_KO = { serve: '서브', block: '블록', draw: '드로우', receive: '리시브', toss: '토스', attack: '어택' };
  const img = (no, ver) => `img/${no}-${ver || (DB[no] && DB[no].img) || 'D'}.webp`;
  // 학교(소속) 필터·색: 카라스노 / 네코마 / 아오바죠사이 / 후쿠로다니 / 그 밖
  const SCHOOLS = [['karasuno', '카라스노', '烏野'], ['nekoma', '네코마', '音駒'], ['seijoh', '아오바죠사이', '青葉城西'], ['fukuro', '후쿠로다니', '梟谷'], ['other', '그 밖의 학교', null]];
  const teamOf = c => { const a = c.aff || []; for (const [k, , jp] of SCHOOLS) if (jp && a.includes(jp)) return k; return 'other'; };
  const inSchool = (c, k) => { if (k === 'all') return true; const a = c.aff || []; if (k === 'other') return !SCHOOLS.some(([, , jp]) => jp && a.includes(jp)); return a.includes(SCHOOLS.find(x => x[0] === k)[2]); };
  const setOf = c => c.set || (c.no.startsWith('HV-D') ? 'HV-D' : c.no.slice(0, 6));
  const SETS = window.VobacaCards.SETS || [{ id: 'HV-D', label: '스타터 덱' }];

  // ───── 저장소 ─────
  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const customDecks = () => store.get('vobaca-decks', []);
  const saveDecks = list => store.set('vobaca-decks', list);
  const tutDone = () => new Set(store.get('vobaca-tut', []));
  function markTut(id) { const s = tutDone(); s.add(id); store.set('vobaca-tut', [...s]); }

  function starterDecks() {
    return Object.values(DECKS).map(d => ({ id: 'starter-' + d.id, name: d.label, code: d.code, starter: true, sample: !!d.sample, color: d.color, list: d.list.map(x => x.slice()) }));
  }
  function allDecks() { return [...starterDecks(), ...customDecks()]; }
  function deckStats(d) {
    let total = 0, ev = 0;
    for (const [no, n] of d.list) { total += n; if (DB[no].type === 'E') ev += n; }
    const errs = [];
    if (total !== 40) errs.push(`덱은 정확히 40장이어야 해요 (현재 ${total}장)`);
    if (ev > 8) errs.push(`이벤트 카드는 8장까지 (현재 ${ev}장)`);
    return { total, ev, chars: total - ev, valid: !errs.length, errs };
  }
  function deckCover(d) {
    const sorted = d.list.slice().sort((a, b) => b[1] - a[1]);
    const c = sorted.find(x => DB[x[0]].type === 'C') || sorted[0];
    return c ? img(c[0], c[2]) : '';
  }
  // 덱 고르기 화면의 큰 미리보기: 많이 넣은 캐릭터 3장 부채꼴 + 구성
  function deckHero(d) {
    const s = deckStats(d); const team = UI.deckTeam(d);
    const per = new Map(); for (const [no, n] of d.list) per.set(no, (per.get(no) || 0) + n);
    const chars = [...per].filter(([no]) => DB[no].type === 'C').sort((a, b) => b[1] - a[1]).slice(0, 3);
    const imgFor = no => img(no, (d.list.find(x => x[0] === no && x[2] === 'DP') || d.list.find(x => x[0] === no) || [])[2]);
    const mid = (chars.length - 1) / 2;
    return `<div class="hero t-${team}" style="--tc:${UI.TEAM_COLOR[team]}">
      <div class="hero-fan">${chars.map(([no], i) => `<img src="${imgFor(no)}" alt="" style="--i:${i - mid};--z:${10 - Math.abs(i - mid) * 2}">`).join('')}</div>
      <div class="hero-info"><span class="hero-tag">${d.starter ? (d.sample ? '샘플 덱 · 부스터 1탄' : '스타터 덱 · ' + esc(d.code)) : '내 덱'}</span><b class="hero-name">${esc(d.name)}</b>
        <div class="hero-stats"><span><i>캐릭터</i><b>${s.chars}</b></span><span><i>이벤트</i><b>${s.ev}</b></span><span><i>합계</i><b>${s.total}</b></span></div>
        <div class="hero-key">${chars.map(([no, n]) => `<span>${esc(KN(no))} <em>×${n}</em></span>`).join('')}</div></div>
    </div>`;
  }
  function toGameDeck(d) {
    // 같은 카드 번호의 여러 줄(D/DP)을 그대로 유지
    return { id: d.id, label: d.name, color: d.color, list: d.list.map(([no, n, ver]) => [no, n, ver || DB[no].img || 'D']) };
  }

  // ───── 화면 전환 ─────
  let cur = null, headRO = null;
  function show(name, arg) {
    cur = name;
    UI.showCardInfo(null);
    root.hidden = false; document.body.classList.add('in-lobby');
    try { window.VobacaAudio && window.VobacaAudio.bgm('bgm_lobby'); } catch (e) {}
    root.scrollTop = 0;
    const r = SCREENS[name](arg);
    root.innerHTML = r; root.dataset.screen = name;
    // 고정된 머리말 높이 → 편집 화면의 고정 칸 · 탭 위치
    const hd = root.querySelector('.scr-head');
    const setH = () => root.style.setProperty('--headh', (hd ? hd.offsetHeight : 0) + 'px');
    setH(); if (hd && window.ResizeObserver) { if (headRO) headRO.disconnect(); headRO = new ResizeObserver(setH); headRO.observe(hd); }
    if (AFTER[name]) AFTER[name](arg);
  }
  function hide() { root.hidden = true; root.innerHTML = ''; document.body.classList.remove('in-lobby'); UI.showCardInfo(null); }
  const head = (title, back = 'main', extra = '') => `<header class="scr-head"><button class="ibtn" type="button" data-go="${back}" aria-label="뒤로">←</button><h1>${title}</h1>${extra}</header>`;

  const SCREENS = {
    main() {
      const fan = [['HV-D01-001', 'DP'], ['HV-D02-002', 'DP'], ['HV-D01-002', 'DP'], ['HV-D02-001', 'DP'], ['HV-D01-005', 'D']];
      return `<div class="lobby-main">
        <div class="logo"><span class="lg1">바보카!!</span><span class="lg2">BREAK</span><small>하이큐!! 트레이딩 카드 게임 시뮬레이터</small></div>
        <div class="fan" aria-hidden="true">${fan.map(([no, v], i) => `<img src="${img(no, v)}" alt="" style="--i:${i - 2}">`).join('')}</div>
        <button class="startbtn" type="button" data-go="hub">게임 시작</button>
        <p class="foot">스타터 덱 HV-D01 카라스노 · HV-D02 네코마 · 부스터 1탄 「쓰레기장의 결전」 수록 카드 · 종합 룰 ver.1.06 기준 · 비공식 팬 시뮬레이터</p>
      </div>`;
    },
    hub() {
      const nd = customDecks().length, nq = Q.length;
      const tile = (go, cls, icon, title, sub, art) => `<button class="hubtile ${cls}" type="button" data-go="${go}">
        <span class="ht-art" aria-hidden="true">${art}</span><span class="ht-icon" aria-hidden="true">${icon}</span><b>${title}</b><span class="ht-sub">${sub}</span></button>`;
      const arts = (list) => list.map(([no, v], i) => `<img src="${img(no, v)}" alt="" style="--i:${i}">`).join('');
      return `${head('게임 메뉴')}
      <div class="hub">
        ${tile('battle', 'h-battle', 'VS', '배틀', 'AI 대전 · 튜토리얼', arts([['HV-D01-001', 'DP'], ['HV-D02-002', 'DP']]))}
        ${tile('decks', 'h-deck', '40', '덱 메이킹', nd ? `내 덱 ${nd}개 · 기본 덱 ${Object.keys(DECKS).length}종` : '나만의 40장 덱 만들기', arts([['HV-D01-002', 'D'], ['HV-D01-004', 'D'], ['HV-D01-003', 'D']]))}
        ${tile('cards', 'h-cards', '▦', '카드 목록', `수록 카드 ${CARDS.length}종`, arts([['HV-P01-043', 'I'], ['HV-P01-033', 'I'], ['HV-D02-001', 'DP']]))}
        ${tile('qna', 'h-qna', 'Q&amp;A', 'QNA 검색', `공식 Q&amp;A ${nq}건 · 키워드 검색`, '')}
      </div>`;
    },
    battle() {
      const done = tutDone().size;
      const art = (no, v) => `<img class="m-art" src="${img(no, v)}" alt="" aria-hidden="true">`;
      return `${head('배틀', 'hub')}
      <p class="lead">어떤 방식으로 플레이할지 골라 주세요.</p>
      <div class="modes">
        <button class="mode m-ai" type="button" data-go="ai">${art('HV-D02-002', 'DP')}<span class="mi">VS</span><b>AI 대전</b><span>컴퓨터와 1:1로 겨뤄요<br>덱을 골라 바로 시작</span></button>
        <div class="mode m-multi locked" aria-disabled="true"><span class="mi">2P</span><b>멀티 대전</b><span>다른 플레이어와 대전<br>준비 중이에요</span><em class="lock">준비 중</em></div>
        <button class="mode m-tut" type="button" data-go="tutorial">${art('HV-D01-001', 'DP')}<span class="mi">?</span><b>튜토리얼</b><span>${done ? `진행 ${done}/${T.CHAPTERS.length}` : '처음이라면 여기부터!'}<br>직접 해 보며 규칙 익히기</span>${done ? '' : '<em class="rec">추천</em>'}</button>
      </div>`;
    },
    ai() {
      const decks = allDecks().filter(d => deckStats(d).valid);
      const prev = store.get('vobaca-ai', {});
      const my = decks.find(d => d.id === prev.my) ? prev.my : decks[0].id;
      const cpu = decks.find(d => d.id === prev.cpu) ? prev.cpu : (decks[1] || decks[0]).id;
      const opt = (name, sel) => decks.map(d => `<label class="dpick t-${UI.deckTeam(d)}" title="${esc(d.name)}"><input type="radio" name="${name}" value="${esc(d.id)}" ${d.id === sel ? 'checked' : ''}><img src="${deckCover(d)}" alt=""><span>${esc(d.name)}</span></label>`).join('');
      const sp = UI.ST.speed;
      const side = (name, label, sel) => `<section class="dside" data-side="${name}">
          <div class="ds-label">${label}</div>
          <div class="ds-hero" id="hero-${name}">${deckHero(decks.find(d => d.id === sel))}</div>
          <div class="ds-picks" role="radiogroup" aria-label="${label} 고르기">${opt(name, sel)}</div>
        </section>`;
      return `${head('AI 대전', 'battle')}

        <div class="dsel">

          ${side('cpu', 'CPU 덱', cpu)}

            <label><input type="radio" name="speed" value="normal" ${sp === 'normal' ? 'checked' : ''}><b>보통</b><span>공 연출을 끝까지</span></label>
            <label><input type="radio" name="speed" value="fast" ${sp === 'fast' ? 'checked' : ''}><b>빠르게</b><span>연출 2배속</span></label>
            <label><input type="radio" name="speed" value="instant" ${sp === 'instant' ? 'checked' : ''}><b>연출 끄기</b><span>바로 진행</span></label>

    },
    tutorial() {

        <button class="btn ${!done.has(c.id) && [...done].length === i ? 'primary' : ''}" type="button" data-tut="${i}">${done.has(c.id) ? '다시 하기' : '시작'}</button></li>`).join('')}</ol>`;
    },
    cards() {
      return `${head('카드 목록', 'hub')}

        <label class="qsearch csearch"><span aria-hidden="true">⌕</span><input id="cardSearch" type="search" placeholder="카드 이름·효과로 찾기" autocomplete="off" aria-label="카드 검색"></label>
        <div class="chips" data-f="set"><button class="chip on" data-v="all">모든 세트</button>${SETS.map(x => `<button class="chip" data-v="${x.id}">${esc(x.label)}</button>`).join('')}</div>
        <div class="chips" data-f="team"><button class="chip on" data-v="all">모든 학교</button>${SCHOOLS.map(([k, l]) => `<button class="chip" data-v="${k}">${l}</button>`).join('')}</div>
        <div class="chips" data-f="type"><button class="chip on" data-v="all">모든 종류</button><button class="chip" data-v="C">캐릭터</button><button class="chip" data-v="E">이벤트</button></div>
        <div class="chips" data-f="pos"><button class="chip on" data-v="all">포지션</button>${['WS', 'MB', 'S', 'Li'].map(p => `<button class="chip" data-v="${p}">${p}</button>`).join('')}</div>
      </div>

      <div class="cardgrid" id="cardGrid"></div>`;
    },
    decks() {
      const list = allDecks();
      return `${head('덱 메이킹', 'hub')}
      <p class="lead">덱은 <b>정확히 40장</b>, 이벤트 카드는 <b>8장까지</b>. 같은 카드는 몇 장이든 넣을 수 있어요. 스타터 덱·샘플 덱은 복사해서 고칠 수 있습니다.</p>
      <div class="decklist">
        <button class="decktile new" type="button" data-deck-new><span class="plus">+</span><b>새 덱 만들기</b></button>
        ${list.map(d => { const s = deckStats(d); return `<div class="decktile">
          <img src="${deckCover(d)}" alt=""><div class="dt-info"><b>${esc(d.name)}</b><span>${d.starter ? (d.sample ? '샘플 덱 · 부스터 1탄 카드' : '스타터 덱 · ' + esc(d.code)) : `${s.total}/40장 · 이벤트 ${s.ev}`}${s.valid ? '' : ' · <em>미완성</em>'}</span></div>
          <div class="dt-acts">${d.starter ? `<button class="btn" type="button" data-deck-copy="${esc(d.id)}">복사해서 편집</button><button class="btn" type="button" data-deck-view="${esc(d.id)}">보기</button>`
            : `<button class="btn primary" type="button" data-deck-edit="${esc(d.id)}">편집</button><button class="btn" type="button" data-deck-copy="${esc(d.id)}">복사</button><button class="btn danger" type="button" data-deck-del="${esc(d.id)}">삭제</button>`}</div></div>`; }).join('')}
      </div>`;
    },
    editor(d) {
      return `${head(d.readonly ? '덱 보기' : '덱 편집', 'decks', d.readonly ? '' : `<input class="dname" id="deckName" maxlength="24" value="${esc(d.name)}" aria-label="덱 이름">`)}
      <div class="edtabs" role="tablist" aria-label="덱 편집 화면">
        <button type="button" role="tab" data-edtab="search">카드 검색</button>
        <button type="button" role="tab" data-edtab="deck">덱 <span id="edTabCount"></span></button>
        <button type="button" role="tab" data-edtab="info">카드 정보</button>
      </div>
      <div class="editor ${d.readonly ? 'ro' : ''}" id="editor" data-tab="search">
        <section class="edcol ed-infocol" aria-label="카드 정보"><div id="edInfo"></div></section>
        <section class="edcol ed-deckcol" aria-label="덱 정보"><div id="deckPanel"></div></section>
        <section class="edcol pool" aria-label="카드 검색">
          <div class="filters" id="poolFilters">
            <label class="qsearch csearch"><span aria-hidden="true">⌕</span><input id="poolSearch" type="search" placeholder="카드 이름·효과로 찾기" autocomplete="off" aria-label="카드 검색"></label>
            <div class="chips" data-f="set"><button class="chip on" data-v="all">모든 세트</button>${SETS.map(x => `<button class="chip" data-v="${x.id}">${esc(x.label)}</button>`).join('')}</div>
            <div class="chips" data-f="team"><button class="chip on" data-v="all">모든 학교</button>${SCHOOLS.map(([k, l]) => `<button class="chip" data-v="${k}">${l}</button>`).join('')}</div>
            <div class="chips" data-f="type"><button class="chip on" data-v="all">모든 종류</button><button class="chip" data-v="C">캐릭터</button><button class="chip" data-v="E">이벤트</button></div>
          </div>
          <p class="lead small" id="poolCount"></p>
          <div class="cardgrid pool-grid" id="poolGrid"></div>
        </section>
      </div>
      <div class="edtoast" id="edToast" role="status" aria-live="polite"></div>`;
    },
    qna() {
      return `${head('QNA 검색', 'hub')}
      <div class="qna-top">
        <label class="qsearch"><span aria-hidden="true">⌕</span><input id="qnaInput" type="search" placeholder="키워드로 검색 (예: 로스트, 가츠, 사이드 블로커, 도샷)" autocomplete="off" aria-label="Q&amp;A 검색"></label>
        <div class="chips" id="qnaCats"><button class="chip on" data-v="all">전체</button>${Object.entries(QCAT).map(([k, v]) => `<button class="chip" data-v="${k}">${v}</button>`).join('')}</div>
        <div class="qkw" id="qnaKw">${['로스트', '가츠', '블록', '사이드 블로커', '이벤트', '도샷', '덱', '패', '인터벌'].map(w => `<button type="button" data-kw="${w}">#${w}</button>`).join('')}</div>
      </div>
      <p class="lead small" id="qnaCount"></p>
      <div class="qlist" id="qnaList"></div>
      <p class="foot qsrc">공식 Q&amp;A(규칙 전체 + 스타터 덱 HV-D01·HV-D02 카드)를 한국어로 옮긴 비공식 번역입니다. 원문: 타카라토미 공식 사이트 룰 페이지.</p>`;
    },
  };

  // ───── 카드 타일 ─────
  function tileHtml(c, extra = '') {
    const p = c.params ? `<div class="tp">${PARAM.map(([k, l]) => `<span title="${l}"><i>${l[0]}</i>${c.params[k] == null ? '－' : c.params[k]}</span>`).join('')}</div>`
      : `<div class="tp ev">${(c.timing || []).map(t => `<span>${TIMING_KO[t]}</span>`).join('')}</div>`;
    return `<div class="ctile t-${teamOf(c)}" data-cardno="${c.no}"><img src="${img(c.no)}" alt="${esc(KN(c.no))}" draggable="false"><div class="tn"><b>${esc(KN(c.no))}</b><span>${c.type === 'C' ? (c.pos || []).join('/') + ' · ' + (GRADE_KO[c.grade] || '') : '이벤트'}</span></div>${p}${extra}</div>`;
  }
  function filterCards(fs) {
    const q = (fs.q || '').toLowerCase().replace(/\s+/g, '');
    return CARDS.filter(c => inSchool(c, fs.team || 'all') && (!fs.set || fs.set === 'all' || setOf(c) === fs.set) && (fs.type === 'all' || c.type === fs.type) && (!fs.pos || fs.pos === 'all' || (c.pos || []).includes(fs.pos))
      && (!q || ((c.kr || '') + c.name + (c.ko || '') + (c.aff || []).map(a => AFF_KO[a] || a).join('') + c.no).toLowerCase().replace(/\s+/g, '').includes(q)));
  }
  function bindFilters(box, fs, onChange) {
    box.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      const grp = b.parentElement; fs[grp.dataset.f] = b.dataset.v;
      for (const x of grp.children) x.classList.toggle('on', x === b);
      onChange();
    });
  }

  // ───── 덱 편집 상태 ─────
  let ED = null;   // { id, name, counts: Map(no -> n), dp: Map(no -> n) (스타터 키라 수), readonly }
  function edFromDeck(d, readonly) {
    const counts = new Map(); const dp = new Map();
    for (const [no, n, ver] of d.list) { counts.set(no, (counts.get(no) || 0) + n); if (ver === 'DP') dp.set(no, (dp.get(no) || 0) + n); }
    return { id: d.id, name: d.name, counts, dp, readonly };
  }
  function edList() {
    const out = [];
    for (const c of CARDS) { const n = ED.counts.get(c.no) || 0; if (!n) continue; const k = Math.min(ED.dp.get(c.no) || 0, n); if (n - k) out.push([c.no, n - k, c.img || 'D']); if (k) out.push([c.no, k, 'DP']); }
    return out;
  }
  // 덱 규칙: 정확히 40장, 이벤트 카드는 8장까지, 캐릭터는 같은 카드도 제한 없음 (공식 Q&A)
  const DECK_MAX = 40, EVENT_MAX = 8;
  function edTotals() { let total = 0, ev = 0; for (const [no, n] of ED.counts) { total += n; if (DB[no].type === 'E') ev += n; } return { total, ev }; }
  function addBlock(no) {
    const { total, ev } = edTotals();
    if (total >= DECK_MAX) return `덱이 ${DECK_MAX}장으로 꽉 찼어요`;
    if (DB[no].type === 'E' && ev >= EVENT_MAX) return `이벤트 카드는 ${EVENT_MAX}장까지 넣을 수 있어요`;
    return '';
  }
  const pmHtml = (no, n) => { const why = addBlock(no); return `<div class="pm"><button type="button" data-dec="${no}" aria-label="빼기" ${n ? '' : 'disabled'}>−</button><button type="button" data-inc="${no}" aria-label="넣기" ${why ? `aria-disabled="true" class="blocked" title="${esc(why)}"` : ''}>＋</button></div>`; };
  function renderPool() {
    const fs = ED.fs; const list = filterCards(fs);
    $('#poolGrid').innerHTML = list.map(c => { const n = ED.counts.get(c.no) || 0; return tileHtml(c, `<div class="cnt ${n ? 'on' : ''}">${n}</div>${ED.readonly ? '' : pmHtml(c.no, n)}`).replace('class="ctile', `class="ctile${ED.sel === c.no ? ' picked' : ''}`); }).join('') || '<p class="lead">조건에 맞는 카드가 없어요.</p>';
    $('#poolCount').textContent = `${list.length}종 · 카드를 누르면 「카드 정보」에 자세히 보여요${ED.readonly ? '' : ' · ＋/− 로 넣고 빼기'}`;
  }
  function renderDeckPanel() {
    const d = { list: edList() }; const s = deckStats(d);
    const row = c => `<li class="dcard t-${teamOf(c)} ${ED.sel === c.no ? 'picked' : ''}"><button type="button" class="dc-img" data-pick="${c.no}" aria-label="${esc(KN(c.no))} 정보"><img src="${img(c.no)}" alt=""><b class="dc-n">${ED.counts.get(c.no)}</b></button><span class="dc-name" data-pick="${c.no}">${esc(KN(c.no))}</span>${ED.readonly ? '' : `<div class="pm"><button type="button" data-dec="${c.no}" aria-label="빼기">−</button><button type="button" data-inc="${c.no}" aria-label="넣기" ${addBlock(c.no) ? 'aria-disabled="true" class="blocked"' : ''}>＋</button></div>`}</li>`;
    const chars = CARDS.filter(c => ED.counts.get(c.no) && c.type === 'C'), evs = CARDS.filter(c => ED.counts.get(c.no) && c.type === 'E');
    const left = DECK_MAX - s.total, evLeft = EVENT_MAX - s.ev;
    $('#deckPanel').innerHTML = `
      <div class="dstats"><div class="${s.total === DECK_MAX ? 'ok' : s.total > DECK_MAX ? 'bad' : ''}"><b>${s.total}</b><span>/ ${DECK_MAX}장</span></div><div class="${s.ev > EVENT_MAX ? 'bad' : s.ev === EVENT_MAX ? 'full' : ''}"><b>${s.ev}</b><span>이벤트 / ${EVENT_MAX}</span></div><div><b>${s.chars}</b><span>캐릭터</span></div></div>
      <div class="meter"><i style="width:${Math.min(100, s.total / DECK_MAX * 100)}%" class="${s.total > DECK_MAX ? 'over' : s.total === DECK_MAX ? 'full' : ''}"></i></div>
      ${s.errs.length ? `<ul class="derrs">${s.errs.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : '<p class="dok">대전에 쓸 수 있는 덱이에요.</p>'}
      ${ED.readonly ? '' : `<p class="dleft">${left > 0 ? `${left}장 더 넣을 수 있어요 · 이벤트는 ${Math.max(0, Math.min(evLeft, left))}장 더` : left === 0 ? '40장을 다 채웠어요 — 다른 카드를 넣으려면 먼저 빼 주세요' : `${-left}장을 빼야 해요`}</p>`}
      <div class="drows-wrap">
        ${chars.length ? `<h4 class="dgrp">캐릭터 <em>${s.chars}</em></h4><ul class="dgrid">${chars.map(row).join('')}</ul>` : ''}
        ${evs.length ? `<h4 class="dgrp">이벤트 <em>${s.ev} / ${EVENT_MAX}</em></h4><ul class="dgrid">${evs.map(row).join('')}</ul>` : ''}
        ${!chars.length && !evs.length ? `<p class="dempty">${ED.readonly ? '빈 덱이에요.' : '카드 검색에서 ＋를 눌러 덱에 넣으세요.'}</p>` : ''}
      </div>
      ${ED.readonly ? `<div class="dacts"><button class="btn primary" type="button" data-deck-copy="${esc(ED.id)}">복사해서 편집</button></div>`
        : `<div class="dacts"><button class="btn" type="button" data-ed-clear>비우기</button><button class="btn" type="button" data-go="decks">취소</button><button class="btn primary" type="button" data-ed-save>저장</button></div>`}`;
    const tc = $('#edTabCount'); if (tc) tc.textContent = `${s.total}/${DECK_MAX}`;
  }
  function renderInfo() {
    const box = $('#edInfo'); if (!box) return;
    const no = ED.sel; const c = no && DB[no];
    if (!c) { box.innerHTML = `<div class="ei-empty"><b>카드 정보</b><p>카드 검색이나 덱 목록에서 카드를 누르면 여기에 그림 · 능력치 · 효과와 키워드 설명이 보여요.</p></div>`; return; }
    const n = ED.counts.get(no) || 0; const why = ED.readonly ? '' : addBlock(no);
    const set = (SETS.find(x => x.id === setOf(c)) || {}).label || '';
    const attrs = [c.type === 'C' ? '캐릭터' : '이벤트', (c.aff || []).map(a => AFF_KO[a] || a).join('/'), c.grade ? GRADE_KO[c.grade] || c.grade : '', (c.pos || []).join('/'), set, c.no].filter(Boolean).join(' · ');
    const prm = c.type === 'C' ? `<div class="ei-prm">${PARAM.map(([k, l]) => `<span class="s-${k}"><i>${l}</i><b>${c.params[k] == null ? '－' : c.params[k]}</b></span>`).join('')}</div>`
      : `<div class="ei-prm ev">${(c.timing || []).map(t => `<span><b>${TIMING_KO[t]}</b><i>페이즈에 플레이</i></span>`).join('')}</div>`;
    const kws = UI.keywordsFor(c.ko || '');
    box.innerHTML = `<div class="ei">
      <div class="ei-top"><img class="ei-img" src="${img(no)}" alt="${esc(KN(no))}"><div class="ei-head"><h3>${esc(KN(no))}</h3><div class="ei-attrs">${esc(attrs)}</div>${prm}</div></div>
      <p class="ei-sk ${c.ko ? '' : 'none'}">${esc(c.ko || '스킬 없음')}</p>
      ${ED.readonly ? `<div class="ei-cnt">덱에 <b>${n}</b>장</div>` : `<div class="ei-ctl"><button class="btn" type="button" data-dec="${no}" ${n ? '' : 'disabled'}>− 빼기</button><b>${n}<small>장</small></b><button class="btn primary ${why ? 'blocked' : ''}" type="button" data-inc="${no}" ${why ? 'aria-disabled="true"' : ''}>＋ 넣기</button></div>${why ? `<p class="ei-why">${esc(why)}</p>` : ''}`}
      ${kws.length ? `<div class="ei-kw"><h4>키워드 설명</h4><dl>${kws.map(k => `<div><dt>${esc(k.k)}</dt><dd>${esc(k.d)}</dd></div>`).join('')}</dl></div>` : ''}
    </div>`;
  }
  let toastT = 0;
  function toast(text) { const t = $('#edToast'); if (!t) return; t.textContent = text; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
  function edChange(no, delta) {
    if (ED.readonly) return;
    if (delta > 0) { const why = addBlock(no); if (why) { toast(why); return; } }
    const n = Math.max(0, (ED.counts.get(no) || 0) + delta);
    if (n) ED.counts.set(no, n); else ED.counts.delete(no);
    if ((ED.dp.get(no) || 0) > n) ED.dp.set(no, n);
    renderEditor();
  }
  function renderEditor() { renderPool(); renderDeckPanel(); renderInfo(); }
  function edPick(no) {
    ED.sel = no; renderEditor();
    if (matchMedia('(max-width: 860px)').matches) setTab('info');
  }
  function setTab(t) {
    const e = $('#editor'); if (!e) return; e.dataset.tab = t;
    document.querySelectorAll('[data-edtab]').forEach(b => { b.classList.toggle('on', b.dataset.edtab === t); b.setAttribute('aria-selected', String(b.dataset.edtab === t)); });
    root.scrollTop = 0;
  }

  const AFTER = {
    ai() {
      UI.updatePreload();
      $('#aiForm').addEventListener('change', ev => {
        const t = ev.target; if (t.name !== 'my' && t.name !== 'cpu') return;
        const d = allDecks().find(x => x.id === t.value); const h = $('#hero-' + t.name);
        if (d && h) { h.innerHTML = deckHero(d); h.firstElementChild.classList.add('swap'); }
      });
      $('#aiForm').addEventListener('submit', ev => {
        ev.preventDefault();
        const f = new FormData(ev.currentTarget);
        const decks = allDecks();
        const my = decks.find(d => d.id === f.get('my')), cpu = decks.find(d => d.id === f.get('cpu'));
        store.set('vobaca-ai', { my: my.id, cpu: cpu.id });
        hide();
        UI.startGame({ decks: [toGameDeck(my), toGameDeck(cpu)], names: [my.name, cpu.name + ' (CPU)'], speed: f.get('speed') });
      });
    },
    cards() {
      const fs = { team: 'all', type: 'all', pos: 'all', set: 'all', q: '' };
      const draw = () => { const list = filterCards(fs); $('#cardGrid').innerHTML = list.map(c => tileHtml(c)).join('') || '<p class="lead">조건에 맞는 카드가 없어요.</p>'; $('#cardCount').textContent = `${list.length}종`; };
      bindFilters($('#cardFilters'), fs, draw); draw();
      $('#cardSearch').addEventListener('input', e => { fs.q = e.target.value; draw(); });
    },
    qna() {
      const inp = $('#qnaInput'); let cat = 'all';
      const norm = x => x.toLowerCase().replace(/\s+/g, '');
      const hl = (text, terms) => {
        let h = esc(text);
        for (const t of terms) { if (!t) continue; const re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); h = h.replace(re, m => `<mark>${m}</mark>`); }
        return h;
      };
      const draw = () => {
        const raw = inp.value.trim(); const terms = raw.split(/\s+/).filter(Boolean);
        const list = Q.filter(x => (cat === 'all' || x.cat === cat) && terms.every(t => norm(x.q + x.a + (x.card ? KN(x.card) + x.card : '') + QCAT[x.cat]).includes(norm(t))));
        $('#qnaCount').textContent = raw || cat !== 'all' ? `${list.length}건 찾았어요` : `전체 ${Q.length}건`;
        $('#qnaList').innerHTML = list.map(x => `<article class="qitem">
          <div class="qmeta"><span class="qcat c-${x.cat}">${QCAT[x.cat]}</span>${x.card ? `<button type="button" class="qcard" data-cardno="${x.card}"><img src="${img(x.card)}" alt="">${esc(KN(x.card))}</button>` : ''}<span class="qid">No.${x.id} · ${x.date}</span></div>
          <p class="qq"><b>Q</b><span>${hl(x.q, terms)}</span></p>
          <p class="qa"><b>A</b><span>${hl(x.a, terms)}</span></p></article>`).join('') || '<p class="qempty">검색 결과가 없어요. 다른 낱말로 찾아보세요.</p>';
      };
      inp.addEventListener('input', draw);
      $('#qnaCats').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; cat = b.dataset.v; for (const x of b.parentElement.children) x.classList.toggle('on', x === b); draw(); });
      $('#qnaKw').addEventListener('click', e => { const b = e.target.closest('[data-kw]'); if (!b) return; inp.value = b.dataset.kw; draw(); inp.focus(); });
      draw();
    },
    editor() {
      ED.fs = { team: 'all', type: 'all', set: 'all', q: '' };
      bindFilters($('#poolFilters'), ED.fs, renderPool);
      $('#poolSearch').addEventListener('input', e => { ED.fs.q = e.target.value; renderPool(); });
      renderEditor(); setTab('search');
      const nm = $('#deckName'); if (nm) nm.addEventListener('input', () => { ED.name = nm.value; });
    },
  };

  // ───── 튜토리얼 ─────
  function startTutorial(i) {
    hide();
    const ch = T.CHAPTERS[i];
    const dir = new T.Director(i, { onFinish: idx => tutorialFinished(idx) });
    UI.startGame({ decks: T.decksFor(), names: ['나 (카라스노)', '상대 (네코마)'], preset: g => T.arrange(g, ch.spec), tutorial: dir, seed: 7 });
  }
  function tutorialFinished(idx) {
    const ch = T.CHAPTERS[idx]; markTut(ch.id);
    const last = idx === T.CHAPTERS.length - 1;
    const m = $('#modalRoot'); m.dataset.kind = 'tutdone';
    m.innerHTML = `<div class="modal"><div class="sheet tutdone"><div class="td-badge">✓</div><h1>${last ? '튜토리얼 완료!' : '챕터 완료!'}</h1>
      <div class="sub">${idx + 1}. ${esc(ch.title)}${last ? ' — 이제 기본 규칙을 모두 익혔어요.' : ''}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
        <button class="btn" type="button" id="tdList">튜토리얼 목록</button>
        ${last ? '<button class="btn primary" type="button" id="tdAi">AI 대전 하러 가기</button>' : `<button class="btn primary" type="button" id="tdNext">다음: ${esc(T.CHAPTERS[idx + 1].title)}</button>`}
      </div></div></div>`;
    $('#tdList').addEventListener('click', () => { UI.leaveGame(); show('tutorial'); });
    if (last) $('#tdAi').addEventListener('click', () => { UI.leaveGame(); show('ai'); });
    else $('#tdNext').addEventListener('click', () => { UI.leaveGame(); startTutorial(idx + 1); });
  }

  // 확인 창 (브라우저 confirm 대신 — 임베드 환경에서도 동작)
  function ask(text, ok = '확인', danger = false) {
    return new Promise(res => {
      const m = $('#modalRoot'); m.dataset.kind = 'ask';
      m.innerHTML = `<div class="modal"><div class="sheet"><h1 style="font-size:20px">${esc(text)}</h1><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" type="button" id="askNo">취소</button><button class="btn ${danger ? 'danger' : 'primary'}" type="button" id="askYes">${esc(ok)}</button></div></div></div>`;
      const done = v => { m.innerHTML = ''; delete m.dataset.kind; res(v); };
      $('#askNo').addEventListener('click', () => done(false)); $('#askYes').addEventListener('click', () => done(true));
    });
  }

  // ───── 클릭 처리 ─────
  root.addEventListener('click', async e => {
    const t = e.target;
    const go = t.closest('[data-go]');
    if (go) {
      if (go.dataset.go === 'decks' && cur === 'editor' && !ED.readonly && !(await ask('저장하지 않은 변경 사항은 사라집니다. 나갈까요?', '나가기'))) return;
      show(go.dataset.go); return;
    }
    const tut = t.closest('[data-tut]'); if (tut) { startTutorial(+tut.dataset.tut); return; }
    const tab = t.closest('[data-edtab]'); if (tab) { setTab(tab.dataset.edtab); return; }
    const inc = t.closest('[data-inc]'); if (inc) { edChange(inc.dataset.inc, +1); return; }
    const pk = t.closest('[data-pick]'); if (pk && cur === 'editor') { edPick(pk.dataset.pick); return; }
    const dec = t.closest('[data-dec]'); if (dec) { edChange(dec.dataset.dec, -1); return; }
    if (t.closest('[data-deck-new]')) { ED = edFromDeck({ id: 'deck-' + Date.now(), name: '새 덱', list: [] }, false); show('editor', ED); return; }
    const cp = t.closest('[data-deck-copy]');
    if (cp) { const d = allDecks().find(x => x.id === cp.dataset.deckCopy); ED = edFromDeck({ ...d, id: 'deck-' + Date.now(), name: d.name + ' (복사)' }, false); show('editor', ED); return; }
    const vw = t.closest('[data-deck-view]'); if (vw) { ED = edFromDeck(allDecks().find(x => x.id === vw.dataset.deckView), true); show('editor', ED); return; }
    const ed = t.closest('[data-deck-edit]'); if (ed) { ED = edFromDeck(customDecks().find(x => x.id === ed.dataset.deckEdit), false); show('editor', ED); return; }
    const del = t.closest('[data-deck-del]');
    if (del) { const d = customDecks().find(x => x.id === del.dataset.deckDel); if (d && await ask(`「${d.name}」 덱을 삭제할까요?`, '삭제', true)) { saveDecks(customDecks().filter(x => x.id !== d.id)); show('decks'); } return; }
    if (t.closest('[data-ed-clear]')) { ED.counts.clear(); ED.dp.clear(); renderEditor(); return; }
    if (t.closest('[data-ed-save]')) {
      const list = edList(); const name = (ED.name || '').trim() || '이름 없는 덱';
      const deck = { id: ED.id, name, list, updated: Date.now() };
      const all = customDecks(); const i = all.findIndex(x => x.id === ED.id);
      if (i >= 0) all[i] = deck; else all.push(deck);
      saveDecks(all); show('decks'); return;
    }
    const cardEl = t.closest('[data-cardno]');
    if (cardEl && cur === 'editor') { edPick(cardEl.dataset.cardno); return; }   // 덱 편집: 왼쪽 「카드 정보」에 표시
    if (cardEl) { UI.showCardInfo(cardEl.dataset.cardno); return; }
    UI.showCardInfo(null);
  });

  window.VobacaLobby = { show, hide, startTutorial };
  show('main');
})();

<script>
// 독립 사이트 전용: 로그인(Google · 이메일 회원가입 · 게스트) + 덱/진행 기록 클라우드 저장 (Firebase Auth + Firestore)
// claude.ai 아티팩트 빌드에는 들어가지 않는다.
(function () {
  'use strict';
  // 다른 사이트가 이 페이지를 iframe으로 띄워 클릭을 유도하는 것(클릭재킹) 차단
  if (window.top !== window.self) { try { window.top.location.replace(location.href); } catch (e) {} document.documentElement.style.display = 'none'; return; }

  const C = window.VOBACA_CONFIG || {};
  const CONFIGURED = !!(C.firebase && C.firebase.apiKey);
  const V = '10.12.2';
  const SDK = n => `https://www.gstatic.com/firebasejs/${V}/firebase-${n}.js`;
  const SYNC_KEYS = ['vobaca-decks', 'vobaca-tut', 'vobaca-ai', 'vobaca-prefs', 'vobaca-sound'];
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ───── Firebase 불러오기 ─────
  let FB = null, fbLoading = null;
  function loadFB() {
    if (!CONFIGURED) return Promise.reject(new Error('not-configured'));
    if (fbLoading) return fbLoading;
    fbLoading = (async () => {
      const [app, auth, fs] = await Promise.all([import(SDK('app')), import(SDK('auth')), import(SDK('firestore'))]);
      const A = app.initializeApp(C.firebase);
      const au = auth.getAuth(A); try { au.languageCode = 'ko'; } catch (e) {}
      const db = fs.getFirestore(A);
      FB = { auth, au, fs, db };
      return FB;
    })();
    return fbLoading;
  }

  // ───── 로컬 저장 ↔ 클라우드 ─────
  const rawGet = Storage.prototype.getItem, rawSet = Storage.prototype.setItem, rawRemove = Storage.prototype.removeItem;
  let syncUid = null, syncTimer = 0, applying = false;
  Storage.prototype.setItem = function (k, v) {
    rawSet.call(this, k, v);
    if (this === window.localStorage && !applying && syncUid && SYNC_KEYS.includes(k)) scheduleSave();
  };
  Storage.prototype.removeItem = function (k) {
    rawRemove.call(this, k);
    if (this === window.localStorage && !applying && syncUid && SYNC_KEYS.includes(k)) scheduleSave();
  };
  function localBundle() {
    const o = {};
    for (const k of SYNC_KEYS) { try { const v = rawGet.call(localStorage, k); if (v != null) o[k] = v; } catch (e) {} }
    return o;
  }
  function applyBundle(o) {
    applying = true;
    try { for (const k of SYNC_KEYS) { if (o && typeof o[k] === 'string') rawSet.call(localStorage, k, o[k]); else if (k !== 'vobaca-prefs') rawRemove.call(localStorage, k); } } catch (e) {}
    applying = false;
  }
  function clearLocal() { applying = true; try { for (const k of SYNC_KEYS) if (k !== 'vobaca-prefs') rawRemove.call(localStorage, k); } catch (e) {} applying = false; }
  function scheduleSave() { clearTimeout(syncTimer); setStatus('저장 중…'); syncTimer = setTimeout(saveNow, 900); }
  async function saveNow() {
    if (!syncUid || !FB) return;
    const uid = syncUid;
    const d = JSON.stringify(localBundle());
    if (d.length > 250000) { setStatus('저장 용량 초과 — 덱 수를 줄여 주세요', true); return; }
    try {
      await FB.fs.setDoc(FB.fs.doc(FB.db, 'users', uid), { d, name: ME.name.slice(0, 20), at: Date.now() }, { merge: true });
      if (uid === syncUid) setStatus('클라우드에 저장됨');
    } catch (e) { console.warn(e); setStatus('저장 실패 — 인터넷 연결을 확인해 주세요', true); }
  }
  async function pullOrPush(user) {
    const ref = FB.fs.doc(FB.db, 'users', user.uid);
    let snap = null;
    try { snap = await FB.fs.getDoc(ref); } catch (e) { console.warn(e); setStatus('클라우드에서 불러오지 못했어요', true); return; }
    const data = snap.exists() ? snap.data() : null;
    if (data && typeof data.d === 'string') {
      try { applyBundle(JSON.parse(data.d)); } catch (e) {}
      if (data.name && !user.isAnonymous) ME.name = data.name;
    } else {
      // 처음 로그인한 계정: 지금 이 기기에 있는 기록(게스트 때 만든 덱 등)을 그대로 올린다
      syncUid = user.uid; await saveNow();
    }
  }

  const ME = { uid: null, name: '', guest: false, provider: '', email: '', offline: false, photo: '' };

  const errMsg = e => ERR[e && e.code] || ('문제가 생겼어요: ' + (e && (e.code || e.message) || e));

  let view = 'home', tab = 'login', msg = null;

      gate.innerHTML = `<div class="ag-card">${logo}<h2>로그인하고 덱과 진행 기록을 어디서나 이어서</h2>${m}
        <div class="ag-btns">
          ${off ? '' : `<button class="ag-btn ag-google" type="button" data-a="google">${GOOGLE_SVG}Google로 계속하기</button>

    } else if (view === 'email') {

      gate.innerHTML = `<div class="ag-card">${logo}
        <div class="ag-tabs" role="tablist"><button type="button" role="tab" class="${su ? '' : 'on'}" aria-selected="${!su}" data-tab="login">로그인</button><button type="button" role="tab" class="${su ? 'on' : ''}" aria-selected="${su}" data-tab="signup">회원가입</button></div>${m}

      const f = gate.querySelector('input'); if (f) setTimeout(() => f.focus(), 30);
    } else if (view === 'loading') {
      gate.innerHTML = `<div class="ag-card">${logo}<h2>${esc(msg && msg.text || '불러오는 중…')}</h2></div>`;
    }
  }
  function busy(on) { gate.querySelectorAll('button, input').forEach(b => { b.disabled = on; }); }

  gate.addEventListener('click', async e => {
    const t = e.target.closest('[data-a], [data-tab]'); if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; msg = null; renderGate(); return; }
    const a = t.dataset.a;
    if (a === 'email') { view = 'email'; msg = null; renderGate(); return; }
    if (a === 'back') { view = 'home'; msg = null; renderGate(); return; }
    if (a === 'guest') { await signInGuest(); return; }
    if (a === 'google') { await signInGoogle(); return; }
    if (a === 'reset') {
      const email = (gate.querySelector('input[name=email]') || {}).value || '';
      if (!email) { msg = { text: '이메일 칸에 가입한 이메일을 입력한 뒤 다시 눌러 주세요.' }; renderGate(); return; }
      busy(true);
      try { await FB.auth.sendPasswordResetEmail(FB.au, email.trim()); msg = { ok: true, text: '비밀번호 재설정 메일을 보냈어요. 메일함(스팸함 포함)을 확인해 주세요.' }; }
      catch (er) { msg = { text: errMsg(er) }; }
      renderGate(); const i = gate.querySelector('input[name=email]'); if (i) i.value = email;
    }
  });
  gate.addEventListener('submit', async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const email = String(f.get('email') || '').trim(), pw = String(f.get('pw') || '');
    const keep = () => { const i = gate.querySelector('input[name=email]'); if (i) i.value = email; const n = gate.querySelector('input[name=nick]'); if (n) n.value = String(f.get('nick') || ''); };
    if (tab === 'signup') {
      const nick = String(f.get('nick') || '').trim();
      if (nick.length < 2) { msg = { text: '닉네임은 2자 이상으로 정해 주세요.' }; renderGate(); keep(); return; }
      if (pw !== f.get('pw2')) { msg = { text: '비밀번호 확인이 일치하지 않아요.' }; renderGate(); keep(); return; }
      busy(true);
      try {
        await loadFB();
        const cr = await FB.auth.createUserWithEmailAndPassword(FB.au, email, pw);
        try { await FB.auth.updateProfile(cr.user, { displayName: nick }); } catch (er) {}
        try { await FB.auth.sendEmailVerification(cr.user); } catch (er) {}
        await onSignedIn(cr.user, { nick });
      } catch (er) { msg = { text: errMsg(er) }; renderGate(); keep(); }
    } else {
      busy(true);
      try { await loadFB(); const cr = await FB.auth.signInWithEmailAndPassword(FB.au, email, pw); await onSignedIn(cr.user); }
      catch (er) { msg = { text: errMsg(er) }; renderGate(); keep(); }
    }
  });

  async function signInGoogle() {
    busy(true);
    try {
      await loadFB();
      const prov = new FB.auth.GoogleAuthProvider(); prov.setCustomParameters({ prompt: 'select_account' });
      try { const cr = await FB.auth.signInWithPopup(FB.au, prov); await onSignedIn(cr.user); }
      catch (er) {
        if (er && (er.code === 'auth/popup-blocked' || er.code === 'auth/operation-not-supported-in-this-environment')) { await FB.auth.signInWithRedirect(FB.au, prov); return; }
        throw er;
      }
    } catch (er) { msg = { text: errMsg(er) }; view = 'home'; renderGate(); }
  }
  async function signInGuest() {
    if (!CONFIGURED) { ME.uid = null; ME.name = '게스트'; ME.guest = true; ME.offline = true; ME.provider = 'local'; enter(); return; }
    busy(true);
    try { await loadFB(); const cr = await FB.auth.signInAnonymously(FB.au); await onSignedIn(cr.user); }
    catch (er) { msg = { text: errMsg(er) }; view = 'home'; renderGate(); }
  }

  async function onSignedIn(user, extra = {}) {
    fromUser(user);
    if (extra.nick) ME.name = extra.nick;
    view = 'loading'; msg = { text: '기록 불러오는 중…' }; renderGate();
    syncUid = null;
    await pullOrPush(user);
    syncUid = user.uid;
    if (extra.nick) saveNow();
    enter();
  }
  const announce = () => { try { window.dispatchEvent(new CustomEvent('vobaca-auth', { detail: { ...ME } })); } catch (e) {} };
  function enter() {
    gate.hidden = true; msg = null; view = 'home';
    renderChip(); announce();
    try { const sp = JSON.parse(rawGet.call(localStorage, 'vobaca-sound') || 'null'); if (sp && window.VobacaAudio) window.VobacaAudio.setPrefs(sp); } catch (e) {}
    try { window.VobacaUI && window.VobacaUI.leaveGame(); } catch (e) {}
    try { const p = JSON.parse(rawGet.call(localStorage, 'vobaca-prefs') || 'null'); if (p && window.VobacaUI) { if (p.speed) window.VobacaUI.ST.speed = p.speed; if (p.autoPass != null) window.VobacaUI.ST.autoPass = p.autoPass; } } catch (e) {}
    window.VobacaLobby && window.VobacaLobby.show('main');
  }

  // ───── 계정 표시 · 메뉴 ─────
  let status = { text: '', bad: false };
  function setStatus(text, bad) { status = { text, bad: !!bad }; renderChip(); }
  function avatar() { return ME.photo ? `<img src="${esc(ME.photo)}" alt="" referrerpolicy="no-referrer">` : esc((ME.name || '?').slice(0, 1)); }
  function renderChip() {
    chip.classList.toggle('uc-guest', ME.guest);
    chip.innerHTML = `<span class="uc-av">${avatar()}</span><span><span class="uc-name">${esc(ME.name)}</span>${status.text && !ME.offline ? `<br><span class="uc-st ${status.bad ? 'bad' : ''}">${esc(status.text)}</span>` : ''}</span>`;
    chip.setAttribute('aria-label', `계정: ${ME.name}`);
  }
  const PROV_KO = { 'google.com': 'Google 계정', password: '이메일 계정', guest: '게스트 (이 브라우저에만 저장)', local: '게스트 · 오프라인 (이 브라우저에만 저장)' };
  let sheetMsg = null;
  function renderSheet() {
    const m = sheetMsg ? `<p class="${sheetMsg.ok ? 'ag-ok' : 'ag-err'}" role="alert">${esc(sheetMsg.text)}</p>` : '';
    const u = FB && FB.au.currentUser;
    const unverified = u && !u.isAnonymous && ME.provider === 'password' && !u.emailVerified;
    sheet.innerHTML = `<div class="ag-card" role="dialog" aria-label="계정">
      <div class="acct-head ${ME.guest ? 'uc-guest' : ''}"><span class="uc-av">${avatar()}</span><div><b>${esc(ME.name)}</b><span>${esc(PROV_KO[ME.provider] || ME.provider)}${ME.email ? ' · ' + esc(ME.email) : ''}</span></div></div>
      ${m}
      ${ME.guest && !ME.offline ? `<div class="acct-sec"><h3>계정 연결 — 지금 기록을 그대로 옮겨요</h3>
        <button class="ag-btn ag-google" type="button" data-s="linkGoogle">${GOOGLE_SVG}Google 계정 연결</button>
        <form class="ag-form" id="linkForm"><label>닉네임<input name="nick" maxlength="12" required></label><label>이메일<input name="email" type="email" autocomplete="email" required></label><label>비밀번호 (6자 이상)<input name="pw" type="password" autocomplete="new-password" minlength="6" required></label><button class="ag-btn ag-email" type="submit">이메일 계정 만들기</button></form></div>` : ''}
      ${!ME.guest ? `<div class="acct-sec"><h3>닉네임</h3><form class="ag-form" id="nickForm" style="grid-template-columns:1fr auto;align-items:end"><input name="nick" maxlength="12" value="${esc(ME.name)}" aria-label="닉네임"><button class="btn primary" type="submit">변경</button></form></div>` : ''}
      ${window.VobacaSoundAdmin && window.VobacaSoundAdmin.isAdmin() ? `<div class="acct-sec"><h3>관리자</h3><button class="btn primary" type="button" data-s="soundAdmin">사운드 관리 (효과음 · 배경음 교체)</button></div>` : ''}
      ${unverified ? `<div class="acct-sec"><h3>이메일 인증</h3><button class="btn" type="button" data-s="verify">인증 메일 다시 보내기</button></div>` : ''}
      <div class="acct-sec"><h3>${ME.offline ? '' : status.text ? esc(status.text) : ''}</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between">
          <button class="btn danger" type="button" data-s="logout">${ME.guest ? '게스트 종료 (로그인 화면으로)' : '로그아웃'}</button>
          <button class="btn acct-close" type="button" data-s="close">닫기</button></div>
        ${ME.uid && !ME.offline ? `<div class="acct-uid">내 UID <code>${esc(ME.uid)}</code> <button type="button" class="ag-link" data-s="copyUid">복사</button></div>` : ''}</div>
    </div>`;
  }
  chip.addEventListener('click', () => { sheetMsg = null; renderSheet(); sheet.hidden = false; });
  sheet.addEventListener('click', async e => {
    if (e.target === sheet) { sheet.hidden = true; return; }
    const b = e.target.closest('[data-s]'); if (!b) return;
    const s = b.dataset.s;
    if (s === 'close') { sheet.hidden = true; return; }
    if (s === 'soundAdmin') { sheet.hidden = true; window.VobacaSoundAdmin && window.VobacaSoundAdmin.open(); return; }
    if (s === 'copyUid') { try { await navigator.clipboard.writeText(ME.uid); b.textContent = '복사됨'; } catch (er) { b.textContent = '복사 실패 — 직접 선택해 복사'; } return; }
    if (s === 'logout') {
      if (ME.guest && !ME.offline && !confirmGuestLeave()) return;
      await saveNow().catch(() => {});
      syncUid = null; if (!ME.offline) clearLocal();   // 오프라인 게스트는 이 브라우저 기록을 그대로 둔다
      try { if (FB) await FB.auth.signOut(FB.au); } catch (er) {}
      Object.assign(ME, { uid: null, name: '', guest: false, provider: '', email: '', offline: false, photo: '' }); announce();
      sheet.hidden = true; try { window.VobacaUI && window.VobacaUI.leaveGame(); } catch (er) {}
      view = 'home'; msg = null; renderGate(); gate.hidden = false; return;
    }
    if (s === 'verify') { try { await FB.auth.sendEmailVerification(FB.au.currentUser); sheetMsg = { ok: true, text: '인증 메일을 보냈어요.' }; } catch (er) { sheetMsg = { text: errMsg(er) }; } renderSheet(); return; }
    if (s === 'linkGoogle') {
      try {
        const prov = new FB.auth.GoogleAuthProvider(); prov.setCustomParameters({ prompt: 'select_account' });
        const cr = await FB.auth.linkWithPopup(FB.au.currentUser, prov);
        fromUser(cr.user); await saveNow(); renderChip(); sheetMsg = { ok: true, text: 'Google 계정을 연결했어요. 이제 다른 기기에서도 이 계정으로 이어서 할 수 있어요.' };
      } catch (er) {
        if (er && er.code === 'auth/credential-already-in-use') {
          sheetMsg = { text: '이 Google 계정은 이미 가입되어 있어요. 게스트를 종료하고 그 계정으로 로그인하면 그 계정의 기록이 열려요 (지금 게스트 기록은 옮겨지지 않아요).' };
        } else sheetMsg = { text: errMsg(er) };
      }
      renderSheet(); return;
    }
  });
  sheet.addEventListener('submit', async e => {
    e.preventDefault(); const f = new FormData(e.target);
    if (e.target.id === 'nickForm') {
      const nick = String(f.get('nick') || '').trim(); if (nick.length < 2) { sheetMsg = { text: '닉네임은 2자 이상' }; renderSheet(); return; }
      try { await FB.auth.updateProfile(FB.au.currentUser, { displayName: nick }); } catch (er) {}
      ME.name = nick; await saveNow(); renderChip(); sheetMsg = { ok: true, text: '닉네임을 바꿨어요.' }; renderSheet(); return;
    }
    if (e.target.id === 'linkForm') {
      const nick = String(f.get('nick') || '').trim(), email = String(f.get('email') || '').trim(), pw = String(f.get('pw') || '');
      if (nick.length < 2) { sheetMsg = { text: '닉네임은 2자 이상으로 정해 주세요.' }; renderSheet(); return; }
      try {
        const cred = FB.auth.EmailAuthProvider.credential(email, pw);
        const cr = await FB.auth.linkWithCredential(FB.au.currentUser, cred);
        try { await FB.auth.updateProfile(cr.user, { displayName: nick }); } catch (er) {}
        try { await FB.auth.sendEmailVerification(cr.user); } catch (er) {}
        fromUser(cr.user); ME.name = nick; await saveNow(); renderChip();
        sheetMsg = { ok: true, text: '이메일 계정을 만들었어요. 인증 메일도 보냈어요.' };
      } catch (er) { sheetMsg = { text: errMsg(er) }; }
      renderSheet();
    }
  });
  function confirmGuestLeave() { return window.confirm('게스트를 종료하면 지금 게스트 기록(덱 · 튜토리얼 진행)은 다시 열 수 없어요. 계정을 연결하면 보존됩니다. 종료할까요?'); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) sheet.hidden = true; });

  // ───── 시작: 이전 로그인 상태 복원 ─────
  async function boot() {
    renderGate(); gate.hidden = false;
    if (!CONFIGURED) return;
    view = 'loading'; msg = { text: '로그인 확인 중…' }; renderGate();
    try {
      await loadFB();
      try { await FB.auth.getRedirectResult(FB.au); } catch (er) { msg = { text: errMsg(er) }; }
      const u = await new Promise(res => { const un = FB.auth.onAuthStateChanged(FB.au, x => { un(); res(x); }); });
      if (u) { await onSignedIn(u); return; }
      view = 'home'; if (msg && msg.text === '로그인 확인 중…') msg = null; renderGate();
    } catch (er) {
      console.error(er);
      view = 'home'; msg = { text: '로그인 서버에 연결하지 못했어요. 게스트로 이용하거나 새로고침해 주세요.' }; renderGate();
    }
  }
  window.VobacaAuth = { me: () => ({ ...ME }), configured: CONFIGURED, fb: () => loadFB(), flush: () => (syncUid ? saveNow() : Promise.resolve()) };
  boot();
})();

</script>
<script>
// 독립 사이트 전용: 관리자가 효과음 · 배경음을 항목별로 교체 (Firestore에 저장, 모든 방문자에게 적용)
//  sound/{항목 id}            { name, mime, size, chunks, ver, vol, at, by }   — 항목 정보 (누구나 읽기, 관리자만 쓰기)
//  soundChunks/{id}~{ver}~{i} { b: Bytes }                                   — 파일 조각 (900KB씩)
//  admins/{UID}                                                              — 관리자 목록 (Firebase 콘솔에서 직접 추가)
(function () {
  'use strict';
  const A = window.VobacaAudio, AU = window.VobacaAuth;
  if (!A || !AU || !AU.configured) return;
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MAX_BYTES = 8 * 1024 * 1024, CHUNK = 900 * 1024;
  const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
  let FB = null, meta = {}, admin = false, adminUid = null;
  const fb = async () => (FB = FB || await AU.fb());

  // ───── 브라우저 캐시 (같은 파일을 매번 다시 받지 않게) ─────
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open('vobaca-sound', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  async function cacheGet(key) { try { const db = await idb(); return await new Promise(res => { const q = db.transaction('files').objectStore('files').get(key); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } }
  async function cachePut(key, buf, id) {
    try {
      const db = await idb(); const tx = db.transaction('files', 'readwrite'); const st = tx.objectStore('files');
      const all = st.getAllKeys(); all.onsuccess = () => { for (const k of all.result) if (String(k).startsWith(id + '~') && k !== key) st.delete(k); st.put(buf, key); };
    } catch (e) {}
  }

  // ───── 불러오기: 교체된 소리를 모두 적용 ─────
  async function fetchBytes(id, m) {
    const key = `${id}~${m.ver}`;
    const hit = await cacheGet(key); if (hit) return hit;
    const F = await fb(); const parts = [];
    for (let i = 0; i < m.chunks; i++) {
      const snap = await F.fs.getDoc(F.fs.doc(F.db, 'soundChunks', `${id}~${m.ver}~${i}`));
      if (!snap.exists()) throw new Error('missing chunk ' + i);
      parts.push(snap.data().b.toUint8Array());
    }
    const all = new Uint8Array(parts.reduce((s, p) => s + p.length, 0)); let o = 0; for (const p of parts) { all.set(p, o); o += p.length; }
    cachePut(key, all.buffer, id);
    return all.buffer;
  }
  async function apply(id, m) {
    A.setItemVol(id, m && m.vol != null ? m.vol : 1);
    if (!m || !m.chunks) { A.setOverride(id, null); return; }
    const buf = await fetchBytes(id, m);
    const buffer = await A.decode(buf);
    A.setOverride(id, { buffer, name: m.name });
  }
  async function loadAll() {
    try {
      const F = await fb();
      const snap = await F.fs.getDocs(F.fs.collection(F.db, 'sound'));
      meta = {}; snap.forEach(d => { if (A.BY[d.id]) meta[d.id] = d.data(); });
      // 배경음은 크니 효과음 먼저
      const ids = Object.keys(meta).sort((a, b) => (A.BY[a].bgm ? 1 : 0) - (A.BY[b].bgm ? 1 : 0));
      for (const id of ids) { try { await apply(id, meta[id]); } catch (e) { console.warn('sound', id, e); } }
      if (!$('#sndAdmin')?.hidden) render();
    } catch (e) { console.warn('sound load', e); }
  }

  // ───── 관리자 확인 ─────
  async function checkAdmin(uid) {
    admin = false; adminUid = uid || null;
    if (!uid) return;
    try { const F = await fb(); const s = await F.fs.getDoc(F.fs.doc(F.db, 'admins', uid)); admin = s.exists() && adminUid === uid; } catch (e) { admin = false; }
  }
  window.addEventListener('vobaca-auth', e => { const u = e.detail || {}; checkAdmin(u.guest ? null : u.uid); });

  // ───── 업로드 · 되돌리기 · 음량 ─────
  async function upload(id, file, onStep) {
    if (!admin) throw new Error('관리자만 바꿀 수 있어요.');
    if (!/^audio\//.test(file.type) && !/\.(mp3|ogg|oga|wav|m4a|aac|webm|flac)$/i.test(file.name)) throw new Error('오디오 파일(mp3 · ogg · wav · m4a 등)만 올릴 수 있어요.');
    if (file.size > MAX_BYTES) throw new Error(`파일이 너무 커요 (${kb(file.size)}). ${kb(MAX_BYTES)} 이하로 줄여 주세요. 배경음은 128kbps mp3 · ogg로 저장하면 3~4분도 들어가요.`);
    onStep('파일 확인 중…');
    const buf = await file.arrayBuffer();
    let decoded; try { decoded = await A.decode(buf); } catch (e) { throw new Error('이 브라우저에서 재생할 수 없는 파일이에요. mp3나 ogg로 바꿔 올려 주세요.'); }
    const F = await fb(); const u8 = new Uint8Array(buf); const ver = Date.now(); const n = Math.ceil(u8.length / CHUNK);
    for (let i = 0; i < n; i++) {
      onStep(`올리는 중… ${i + 1}/${n}`);
      await F.fs.setDoc(F.fs.doc(F.db, 'soundChunks', `${id}~${ver}~${i}`), { b: F.fs.Bytes.fromUint8Array(u8.subarray(i * CHUNK, (i + 1) * CHUNK)) });
    }
    const old = meta[id];
    const m = { name: file.name.slice(0, 80), mime: file.type || '', size: u8.length, chunks: n, ver, vol: old && old.vol != null ? old.vol : 1, at: Date.now(), by: adminUid };
    await F.fs.setDoc(F.fs.doc(F.db, 'sound', id), m);
    meta[id] = m;
    if (old && old.chunks) for (let i = 0; i < old.chunks; i++) F.fs.deleteDoc(F.fs.doc(F.db, 'soundChunks', `${id}~${old.ver}~${i}`)).catch(() => {});
    cachePut(`${id}~${ver}`, buf, id);
    A.setOverride(id, { buffer: decoded, name: m.name });
    return decoded.duration;
  }
  async function resetItem(id) {
    const F = await fb(); const old = meta[id];
    await F.fs.deleteDoc(F.fs.doc(F.db, 'sound', id));
    if (old && old.chunks) for (let i = 0; i < old.chunks; i++) F.fs.deleteDoc(F.fs.doc(F.db, 'soundChunks', `${id}~${old.ver}~${i}`)).catch(() => {});
    delete meta[id]; A.setOverride(id, null); A.setItemVol(id, 1);
  }
  const volTimers = {};
  function saveVol(id, v) {
    A.setItemVol(id, v);
    clearTimeout(volTimers[id]);
    volTimers[id] = setTimeout(async () => {
      try {
        const F = await fb(); const m = meta[id] || { chunks: 0 };
        m.vol = v; m.at = Date.now(); m.by = adminUid; meta[id] = m;
        if (!m.chunks && Math.abs(v - 1) < 0.001) { await F.fs.deleteDoc(F.fs.doc(F.db, 'sound', id)); delete meta[id]; }
        else await F.fs.setDoc(F.fs.doc(F.db, 'sound', id), { vol: v, at: m.at, by: adminUid, chunks: m.chunks || 0 }, { merge: true });
        flash(id, '음량 저장됨');
      } catch (e) { flash(id, '저장 실패: ' + errText(e), true); }
    }, 600);
  }
  const errText = e => (e && e.code === 'permission-denied') ? '권한이 없어요 (관리자 등록 · 보안 규칙을 확인해 주세요)' : (e && e.message) || String(e);

  // ───── 관리자 화면 ─────
  const css = document.createElement('style');
  css.textContent = `
  .sndadm { position: fixed; inset: 0; z-index: 90; display: grid; place-items: start center; padding: 20px 14px; overflow-y: auto; background: rgba(5,7,12,.82); }
  .sndadm[hidden] { display: none; }
  .sa-card { width: min(860px, 100%); display: grid; gap: 14px; padding: 20px 20px 24px; border-radius: 20px; background: rgba(18,10,4,.98); border: 1.5px solid rgba(255,220,170,.28); box-shadow: 0 24px 60px rgba(0,0,0,.6); color: #f3e5d2; }
  .sa-head { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
  .sa-head h2 { margin: 0; font-size: 22px; } .sa-head p { margin: 2px 0 0; font-size: 12.5px; color: #cdbba5; }
  .sa-cat { display: grid; gap: 8px; } .sa-cat h3 { margin: 6px 0 0; font-size: 13px; letter-spacing: .06em; color: #f3c46b; }
  .sa-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,220,170,.12); }
  .sa-item.on { border-color: rgba(63,209,143,.5); background: rgba(63,209,143,.07); }
  .sa-name b { font-size: 14.5px; } .sa-name small { display: block; font-size: 11.5px; color: #a8957e; margin-top: 1px; }
  .sa-st { font-size: 12px; color: #cdbba5; margin-top: 3px; } .sa-st.on { color: #8fe8b9; } .sa-st.bad { color: #ffb3ad; } .sa-st.ok { color: #f3c46b; }
  .sa-acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
  .sa-acts .btn { padding: 6px 10px; font-size: 12.5px; }
  .sa-vol { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr 44px; gap: 10px; align-items: center; font-size: 12px; color: #cdbba5; }
  .sa-vol input { width: 100%; accent-color: var(--ball); }
  .sa-note { margin: 0; font-size: 12px; color: #a8957e; line-height: 1.6; }
  @media (max-width: 640px) { .sa-item { grid-template-columns: 1fr; } .sa-acts { justify-content: flex-start; } }
  `;
  document.head.appendChild(css);
  const box = document.createElement('div'); box.className = 'sndadm'; box.id = 'sndAdmin'; box.hidden = true; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', '사운드 관리');
  document.body.appendChild(box);
  const msgs = {};
  function flash(id, text, bad) { msgs[id] = { text, bad }; const el = box.querySelector(`[data-st="${id}"]`); if (el) { el.textContent = text; el.className = 'sa-st ' + (bad ? 'bad' : 'ok'); } }
  function statusOf(id) {
    if (msgs[id]) return msgs[id];
    const m = meta[id];
    if (m && m.chunks) return { text: `교체됨 — ${m.name} (${kb(m.size)}${m.at ? ' · ' + new Date(m.at).toLocaleDateString('ko-KR') : ''})`, on: true };
    return { text: '기본음 (코드로 만든 소리)' };
  }
  function render() {
    const pv = A.previewing();
    box.innerHTML = `<div class="sa-card">
      <div class="sa-head"><div><h2>사운드 관리</h2><p>관리자 전용 · 여기서 바꾼 소리는 사이트에 들어오는 모든 사람에게 적용돼요.</p></div>
        <button class="btn" type="button" data-sa="close">닫기</button></div>
      ${A.CATS.map(([cat, label]) => `<section class="sa-cat"><h3>${esc(label)}</h3>
        ${A.ITEMS.filter(x => x.cat === cat).map(x => { const s = statusOf(x.id); const v = Math.round(A.itemVol(x.id) * 100); const on = !!(meta[x.id] && meta[x.id].chunks);
          return `<div class="sa-item ${on ? 'on' : ''}" data-id="${x.id}">
            <div class="sa-name"><b>${esc(x.label)}</b><small>${esc(x.desc)} · <code>${x.id}</code></small><div class="sa-st ${s.on ? 'on' : s.bad ? 'bad' : ''}" data-st="${x.id}">${esc(s.text)}</div></div>
            <div class="sa-acts">
              ${x.bgm ? (pv === x.id ? `<button class="btn primary" type="button" data-sa="stop">■ 정지</button>` : `<button class="btn" type="button" data-sa="play">▶ 지금 소리</button>${on ? '<button class="btn" type="button" data-sa="playDef">▶ 기본음</button>' : ''}`)
                : `<button class="btn" type="button" data-sa="play">▶ 지금 소리</button>${on ? '<button class="btn" type="button" data-sa="playDef">▶ 기본음</button>' : ''}`}
              <label class="btn primary" style="cursor:pointer">파일로 교체<input type="file" accept="audio/*,.mp3,.ogg,.wav,.m4a" data-sa="file" hidden></label>
              ${on || (meta[x.id] && meta[x.id].vol != null && meta[x.id].vol !== 1) ? '<button class="btn danger" type="button" data-sa="reset">기본으로</button>' : ''}
            </div>
            <label class="sa-vol">음량<input type="range" min="0" max="200" step="5" value="${v}" data-sa="vol"><b>${v}%</b></label>
          </div>`; }).join('')}
      </section>`).join('')}
      <p class="sa-note">· 파일은 mp3 · ogg · wav · m4a, 한 항목에 ${kb(MAX_BYTES)}까지. 효과음은 1~2초 안쪽의 짧은 소리가, 배경음은 처음과 끝이 자연스럽게 이어지는 반복용 곡이 좋아요.<br>
      · 음량 100% = 원래 크기. 플레이어는 각자 로비 왼쪽 아래 소리 버튼 · 경기 설정에서 배경음/효과음 크기를 따로 조절해요.<br>
      · 「기본으로」를 누르면 올린 파일을 지우고 코드로 만든 기본음으로 돌아가요.</p>
    </div>`;
  }
  box.addEventListener('click', async e => {
    if (e.target === box) { close(); return; }
    const b = e.target.closest('[data-sa]'); if (!b) return;
    const act = b.dataset.sa; const id = b.closest('[data-id]') && b.closest('[data-id]').dataset.id;
    if (act === 'close') { close(); return; }
    if (act === 'play') { A.previewItem(id, 'current'); if (A.BY[id].bgm) render(); return; }
    if (act === 'playDef') { A.previewItem(id, 'default'); if (A.BY[id].bgm) render(); return; }
    if (act === 'stop') { A.stopPreview(); render(); return; }
    if (act === 'reset') {
      if (!window.confirm(`「${A.BY[id].label}」을(를) 기본음으로 되돌릴까요? 올린 파일은 지워져요.`)) return;
      try { await resetItem(id); delete msgs[id]; render(); flash(id, '기본음으로 되돌렸어요'); } catch (er) { flash(id, '실패: ' + errText(er), true); }
    }
  });
  box.addEventListener('input', e => { const t = e.target; if (t.dataset.sa !== 'vol') return; const id = t.closest('[data-id]').dataset.id; t.nextElementSibling.textContent = t.value + '%'; saveVol(id, t.value / 100); });
  box.addEventListener('change', async e => {
    const t = e.target; if (t.dataset.sa === 'vol') { const id = t.closest('[data-id]').dataset.id; if (!A.BY[id].bgm) A.previewItem(id, 'current'); return; }
    if (t.dataset.sa !== 'file' || !t.files || !t.files[0]) return;
    const id = t.closest('[data-id]').dataset.id; const f = t.files[0];
    box.querySelectorAll('input[type=file]').forEach(x => { x.disabled = true; });
    try {
      const dur = await upload(id, f, text => flash(id, text));
      delete msgs[id]; render(); flash(id, `교체 완료 — ${f.name} (${dur.toFixed(1)}초)`);
      if (!A.BY[id].bgm) A.previewItem(id, 'current');
    } catch (er) { flash(id, errText(er), true); box.querySelectorAll('input[type=file]').forEach(x => { x.disabled = false; }); }
  });
  function open() { if (!admin) return; msgs && Object.keys(msgs).forEach(k => delete msgs[k]); render(); box.hidden = false; }
  function close() { A.stopPreview(); box.hidden = true; }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !box.hidden) close(); });

  window.VobacaSoundAdmin = { open, isAdmin: () => admin, reload: loadAll };
  setTimeout(loadAll, 300);
})();

</script>
<script>
// 독립 사이트 전용: 새 버전 알림(새로고침 안내) + 업데이트 후 바뀐 점 보여 주기
(function () {
  'use strict';
  const CUR = window.VOBACA_VERSION || '';
  const LOG = Array.isArray(window.VOBACA_CHANGELOG) ? window.VOBACA_CHANGELOG : [];
  const SEEN_KEY = 'vobaca-seen-update', SNOOZE_MS = 10 * 60 * 1000, CHECK_MS = 3 * 60 * 1000;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  const st = document.createElement('style');
  st.textContent = `
  .updbar { position: fixed; left: 50%; top: 66px; z-index: 95; transform: translateX(-50%); width: min(460px, calc(100vw - 24px)); display: grid; gap: 8px; padding: 12px 14px; border-radius: 16px;
    background: rgba(14,16,24,.97); border: 2px solid var(--ball); box-shadow: 0 16px 40px rgba(0,0,0,.6), 0 0 24px rgba(255,210,63,.35); animation: upd-in .3s cubic-bezier(.2,.9,.3,1); color: #fff; }
  .updbar[hidden], .whatsnew[hidden] { display: none; }
  @keyframes upd-in { from { opacity: 0; transform: translate(-50%, -14px); } }
  .updbar .u-top { display: flex; align-items: center; gap: 10px; }
  .updbar .u-ic { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: var(--ball); color: #1b1600; font-weight: 900; }
  .updbar b { font-size: 15px; } .updbar .u-sub { font-size: 12px; color: #c7cede; }
  .updbar ul { margin: 0; padding-left: 20px; font-size: 12.5px; color: #e4e8f2; display: grid; gap: 2px; }
  .updbar .u-acts { display: flex; gap: 8px; justify-content: flex-end; }
  .whatsnew { position: fixed; inset: 0; z-index: 94; display: grid; place-items: center; padding: 16px; background: rgba(5,7,12,.7); animation: cs-in .2s ease-out; }
  .wn-card { width: min(480px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; display: grid; gap: 12px; padding: 20px 22px; border-radius: 20px;
    background: linear-gradient(180deg, rgba(30,18,8,.98), rgba(18,10,4,.98)); border: 2px solid rgba(255,210,63,.6); box-shadow: 0 24px 60px rgba(0,0,0,.6); color: #fff; }
  .wn-card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; color: var(--ball); }
  .wn-ent { display: grid; gap: 4px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.05); }
  .wn-ent .wn-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .wn-ent b { font-size: 15px; } .wn-ent small { font-size: 11px; color: #a8957e; white-space: nowrap; }
  .wn-ent ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.55; color: #e9dccb; }
  .wn-bar { height: 4px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
  .wn-bar i { display: block; height: 100%; width: 100%; background: var(--ball); transform-origin: left; animation: wn-t 9s linear forwards; }
  .whatsnew:hover .wn-bar i, .whatsnew:focus-within .wn-bar i { animation-play-state: paused; }
  @keyframes wn-t { to { transform: scaleX(0); } }
  .wn-acts { display: flex; justify-content: flex-end; }
  `;
  document.head.appendChild(st);

  // ───── 업데이트 후 처음 열었을 때: 바뀐 점 ─────
  // ?v= 로 새로고침해 들어왔으면 주소창을 깔끔하게
  try { const u = new URL(location.href); if (u.searchParams.has('v')) { u.searchParams.delete('v'); history.replaceState(null, '', u.pathname + u.search + u.hash); } } catch (e) {}
  function showWhatsNew() {
    if (!LOG.length) return;
    const latest = LOG[0].id;
    const seen = +get(SEEN_KEY) || 0;
    set(SEEN_KEY, String(latest));
    if (seen >= latest) return;
    const list = seen ? LOG.filter(e => e.id > seen).slice(0, 4) : LOG.slice(0, 1);   // 처음 온 사람에게는 최신 것만
    const el = document.createElement('div'); el.className = 'whatsnew'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', '업데이트 소식');
    el.innerHTML = `<div class="wn-card"><h2>업데이트 소식</h2>
      ${list.map(e => `<div class="wn-ent"><div class="wn-h"><b>${esc(e.title)}</b><small>${esc(e.date || '')}</small></div><ul>${(e.notes || []).map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>`).join('')}
      <div class="wn-bar" aria-hidden="true"><i></i></div>
      <div class="wn-acts"><button class="btn primary" type="button">확인</button></div></div>`;
    document.body.appendChild(el);
    const close = () => { if (el.isConnected) { el.style.animation = 'cs-out .2s ease-in forwards'; setTimeout(() => el.remove(), 200); } };
    el.querySelector('button').addEventListener('click', close);
    el.addEventListener('click', e => { if (e.target === el) close(); });
    el.querySelector('.wn-bar i').addEventListener('animationend', close);   // 잠깐 보여 주고 자동으로 닫힘 (마우스를 올리면 멈춤)
  }

  // ───── 새 버전 확인 ─────
  const bar = document.createElement('div'); bar.className = 'updbar'; bar.hidden = true; bar.setAttribute('role', 'alert');
  document.body.appendChild(bar);
  let snoozeUntil = 0, latestSeen = null;
  async function check() {
    if (!CUR || document.hidden || Date.now() < snoozeUntil) return;
    let r;
    try { r = await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json(); } catch (e) { return; }
    if (!r || !r.v || r.v === CUR) return;
    latestSeen = r;
    const inGame = !!(window.VobacaUI && window.VobacaUI.ST.game && !document.body.classList.contains('in-lobby'));
    const notes = (r.notes || []).slice(0, 3);
    bar.innerHTML = `<div class="u-top"><span class="u-ic">↻</span><div><b>새 버전이 나왔어요${r.title ? ` — ${esc(r.title)}` : ''}</b><div class="u-sub">새로고침하면 최신 버전으로 바뀌어요.${inGame ? ' 지금 경기는 끝난 뒤에 눌러도 돼요.' : ''}</div></div></div>
      ${notes.length ? `<ul>${notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
      <div class="u-acts"><button class="btn" type="button" data-u="later">나중에</button><button class="btn primary" type="button" data-u="reload">지금 새로고침</button></div>`;
    bar.hidden = false;
  }
  bar.addEventListener('click', async e => {
    const b = e.target.closest('[data-u]'); if (!b) return;
    if (b.dataset.u === 'later') { bar.hidden = true; snoozeUntil = Date.now() + SNOOZE_MS; return; }
    b.disabled = true; b.textContent = '저장하고 새로고침…';
    try { if (window.VobacaAuth && window.VobacaAuth.flush) await window.VobacaAuth.flush(); } catch (er) {}
    // 주소를 바꿔 새로 받아 오게 (GitHub Pages 캐시 우회)
    location.replace(location.pathname + '?v=' + encodeURIComponent(latestSeen ? latestSeen.v : Date.now()));
  });
  setInterval(check, CHECK_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  setTimeout(check, 4000);
  setTimeout(showWhatsNew, 600);
  window.VobacaUpdate = { check, showWhatsNew, version: CUR };
})();

</script>

</body>
