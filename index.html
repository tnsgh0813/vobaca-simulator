    }
    c(card) { return this.DB[card.no]; }
    // ルール判定用カード名 (日本語原文)。2人カード(日向・孤爪 等)はコートにいる間だけ登場時に選んだ名前
    cname(card) { return card.nameAs && this.charArea(card) ? card.nameAs : this.c(card).name; }
    nameChoices(card) { return this.c(card).dual || [this.c(card).name]; }
    affs(card) { return this.c(card).aff || []; }
    hasAff(card, a) { return this.affs(card).includes(a); }
    hasPos(card, pos) { return (this.c(card).pos || []).includes(pos); }
    // 「自分のキャラすべてが○○」: コートのキャラが1人以上いて全員がその所属を持つ (Q&A)
    allAff(p, a) { const cs = this.chars(p).map(x => x.card); return cs.length > 0 && cs.every(c => this.hasAff(c, a)); }
    // 「自分の別々の所属のキャラが N 人以上」: キャラごとに所属1つを選び重複しない最大人数 (二部マッチング)
    distinctAffChars(p) {
      const cs = this.chars(p).map(x => x.card); const owner = new Map();
      const tryAssign = (i, seen) => { for (const a of this.affs(cs[i])) { if (seen.has(a)) continue; seen.add(a); if (!owner.has(a) || tryAssign(owner.get(a), seen)) { owner.set(a, i); return true; } } return false; };
      let n = 0; for (let i = 0; i < cs.length; i++) if (tryAssign(i, new Set())) n++;
      return n;
    }
    gutsTotal(p) { return AREAS.reduce((s, a) => s + this.guts(p, a).length, 0); }
    eventsWithTiming(p, timings) { return this.players[p].event.filter(c => (this.c(c).timing || []).some(t => timings.includes(t))).length; }
    dname(card) { return this.c(card).kr || this.c(card).name; } // 表示用 (韓国語)
    nowName(card) { return card.nameAs && this.charArea(card) ? this.krName(card.nameAs) : this.dname(card); }   // 지금 쓰는 이름 (2인 카드는 고른 이름)
    isChar(card) { return this.c(card).type === 'C'; }
    shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(this.rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    say(text, player = null, kind = '') { this.log.push({ text, player, kind, turn: this.turnNo, set: this.setNo }); if (kind === 'skill' && this._skillCtx) this.fxNote(text.replace(/^[^:]*:\s*/, '')); this.emit(); }
    emit() { if (!this.aborted) this.onChange(this); }
    pname(p) { return this.names[p]; }
    other(p) { return 1 - p; }

    base(card, p) { const v = this.c(card).params?.[p]; return v === undefined ? null : v; }
    param(card, p) {
      const b = this.base(card, p);
      if (b === null) return null;                          // 「－」は修正を受けない (1-3-2-1-2)
      return b + card.mods.filter(m => m.param === p).reduce((s, m) => s + m.delta, 0);
    }
    setParam(card, p, value, src) { const cur = this.param(card, p); if (cur === null) return; this.addMod(card, p, value - cur, src); }
    addMod(card, p, delta, src) {
      if (this.base(card, p) === null) { this.say(`${this.dname(card)}은(는) ${PARAM_KO[p]} 포인트가 「－」라 수정되지 않습니다.`); return; }
      card.mods.push({ param: p, delta, src });
      this.say(`${this.dname(card)}의 ${PARAM_KO[p]} 포인트 ${delta > 0 ? '+' : ''}${delta} → ${this.param(card, p)}`, card.owner, 'mod');
      this.fxNote(`${this.dname(card)} ${PARAM_KO[p]} ${delta > 0 ? '+' : ''}${delta} → ${this.param(card, p)}`, card.uid);
    }

    top(p, area) { const a = this.players[p].areas[area]; return a.length ? a[a.length - 1] : null; }
    guts(p, area) { const a = this.players[p].areas[area]; return a.slice(0, Math.max(0, a.length - 1)); }
    // コート上のキャラ一覧 [{card, area}]
    chars(p) {
      const out = [];
      for (const a of AREAS) { const t = this.top(p, a); if (t) out.push({ card: t, area: a }); }
      for (const s of this.players[p].sides) out.push({ card: s, area: 'side' });
      return out;
    }
    blockChars(p) { const out = []; const t = this.top(p, 'block'); if (t) out.push(t); return out.concat(this.players[p].sides); }
    charArea(card) {
      const pl = this.players[card.owner];
      for (const a of AREAS) if (this.top(card.owner, a) === card) return a;
      if (pl.sides.includes(card)) return 'side';
      return null;
    }
    // カードの所在
    where(card) {
      const pl = this.players[card.owner];
      for (const k of ['hand', 'deck', 'drop', 'setArea', 'event']) if (pl[k].includes(card)) return k;
      if (pl.sides.includes(card)) return 'side';
      for (const a of AREAS) if (pl.areas[a].includes(card)) return a;
      return null;
    }
    removeFromAnywhere(card) {
      const pl = this.players[card.owner];
      for (const k of ['hand', 'deck', 'drop', 'setArea', 'event', 'sides']) { const i = pl[k].indexOf(card); if (i >= 0) { pl[k].splice(i, 1); return; } }
      for (const a of AREAS) { const i = pl.areas[a].indexOf(card); if (i >= 0) { pl.areas[a].splice(i, 1); return; } }
    }
    toDrop(card) { this.removeFromAnywhere(card); card.mods = []; this.players[card.owner].drop.push(card); }

    // 스킬로 카드를 패에 넣을 수 없는 상태 (이와이즈미: 「相手はスキルでカードを手札に加えられない」)
    handBlocked(p) { return !!this._skillCtx && this.activeEffects('noAddHand', p).length > 0; }
    draw(p, n = 1, why = '', force = false) {
      const pl = this.players[p]; let got = 0;
      if (n > 0 && !force && this.handBlocked(p)) { this.say(`${this.pname(p)}: 이번 턴에는 스킬로 카드를 패에 넣을 수 없어 뽑지 못합니다.`, p); return 0; }
      for (let i = 0; i < n; i++) {
        if (!pl.deck.length) { this.say(`${this.pname(p)}: 덱이 0장이라 카드를 뽑지 못하고 계속 진행합니다.`, p); break; }
        pl.hand.push(pl.deck.pop()); got++;
      }
      if (got) { this.say(`${this.pname(p)}: 카드 ${got}장을 뽑았습니다${why ? ' (' + why + ')' : ''}. 패 ${pl.hand.length}장`, p, 'draw'); this.fxNote(`카드 ${got}장 뽑기`); }
      return got;
    }

    // 카드를 뽑는 것 이외의 방법으로 패에 넣기 (텐도 · 「나도 그렇게 생각했어☆」 유발)
    async addToHand(p, cards, why = '') {
      cards = cards.filter(Boolean);
      if (!cards.length) return [];
      if (this.handBlocked(p)) { this.say(`${this.pname(p)}: 이번 턴에는 스킬로 카드를 패에 넣을 수 없습니다.`, p); return []; }
      const pl = this.players[p];
      for (const c of cards) { this.removeFromAnywhere(c); c.mods = []; c.nameAs = null; pl.hand.push(c); }
      this.say(`${this.pname(p)}: ${cards.map(c => '「' + this.dname(c) + '」').join(', ')}을(를) 패에 넣었습니다${why ? ' (' + why + ')' : ''}. 패 ${pl.hand.length}장`, p, 'draw');
      this.fxNote(`${cards.map(c => '「' + this.dname(c) + '」').join(', ')} → 패에`);
      if (this.turnPlayer != null && this.phase !== 'interval') {
        for (const e of this.activeEffects('tendo', p)) { const prev = this._skillCtx; this._skillCtx = { p: e.owner, uid: e.src, emitted: false, label: '텐도 사토리의 효과' }; this.draw(e.owner, cards.length, '텐도 사토리의 효과'); this._skillCtx = prev; }
        for (const e of this.activeEffects('oikawaDrop', p)) { for (let i = 0; i < cards.length && pl.hand.length; i++) await this.discardFromHand(p, 'oikawaDrop', '「나도 그렇게 생각했어☆」의 효과로 패에서 드롭할 카드를 고르세요.'); }
      }
      return cards;
    }
    revealTop(p) {
      const c = this.players[p].deck[this.players[p].deck.length - 1] || null;
      if (c) { this.say(`${this.pname(p)}: 덱 위 카드 공개 → 「${this.dname(c)}」`, p); this.fxNote(`덱 위 공개: 「${this.dname(c)}」`); }
      return c;
    }
    toDeckBottom(card) { this.removeFromAnywhere(card); card.mods = []; this.players[card.owner].deck.unshift(card); }

    // ───────── 継続効果 ─────────
    addEffect(e) { this.effects.push({ ...e, setNo: this.setNo }); this.emit(); }
    activeEffects(kind, target) { return this.effects.filter(e => e.kind === kind && e.setNo === this.setNo && e.turnNo === this.turnNo && (target === undefined || e.target === target)); }
    blockMax(p) { let m = 3; for (const e of this.activeEffects('blockMax', p)) m = Math.min(m, e.max); return m; }

    // ───────── 演出 ─────────
    // ── 스킬 효과 연출: 효과가 실제로 적용되는 순간(포인트 증감 · 드로우 등)을 모아 두었다가 다음 대기 지점에서 보여 준다 ──
    fxNote(text, target) {
      const ctx = this._skillCtx; if (!ctx) return;
      this._fxq.push({ p: ctx.p, uid: ctx.uid, event: ctx.event, label: ctx.label, text, target }); ctx.emitted = true;
    }
    async flushFx() {
      while (this._fxq && this._fxq.length) { const it = this._fxq.shift(); await this.anim({ type: 'skill', ...it }); }
    }
    async withSkill(p, card, fn, opt = {}) {
      const prev = this._skillCtx;
      const ctx = { p, uid: card ? card.uid : null, event: !!opt.event, label: opt.label || null, emitted: false };
      this._skillCtx = ctx;
      try { await fn(); } finally { this._skillCtx = prev; }
      await this.flushFx();
      if (!ctx.emitted && opt.fallback) await this.anim({ type: 'skill', p, uid: ctx.uid, event: ctx.event, label: ctx.label, text: opt.fallback });
    }
    async anim(ev) {
      if (ev.type !== 'skill' && this._fxq && this._fxq.length) await this.flushFx();
      if (!this.animator || this.aborted) return;
      try { await this.animator(this, ev); } catch (e) { if (!this.aborted) console.error(e); }
      if (this.aborted) throw new AbortSignal();
    }

    // ───────── 判断要求 ─────────
    async ask(player, req) {
      if (this._fxq && this._fxq.length) await this.flushFx();
      if (this.aborted) throw new AbortSignal();
      if (++this.decisions > this.maxDecisions) throw new Error('decision limit exceeded');
      this.request = { ...req, player };
      this.emit();
      const ans = await this.agents[player].decide(this, this.request);
      if (this.aborted) throw new AbortSignal();
      this.request = null;
      return ans;
    }

    // ───────── ゲーム全体 ─────────
    async run() {
      try {
        await this.setup();
        let server = this.firstServer;
        let start = this.presetStart;
        for (;;) {
          this.setNo++;
          this.say(`━━ 세트 ${this.setNo} 시작 · 서브권: ${this.pname(server)} ━━`, null, 'set');
          await this.anim({ type: 'setStart', server, setNo: this.setNo });
          const loser = await this.playSet(server, start); start = null;
          const winner = this.other(loser);
          // 敗北条件: セットカード0枚の状態でロストを宣言する (0-1-3-1-1)
          if (this.players[loser].setArea.length === 0) {
            this.winner = winner;
            this.history.push({ set: this.setNo, winner, ...(this.lastScore || {}) });
            this.phase = 'gameover';
            this.say(`${this.pname(loser)}의 세트 카드가 0장인 상태에서 로스트 → ${this.pname(winner)} 승리!`, winner, 'win');
            await this.anim({ type: 'gameover', winner });
            break;
          }
          this.history.push({ set: this.setNo, winner, ...(this.lastScore || {}) });
          await this.interval(loser);
          server = winner;
        }
      } catch (e) {
        if (e instanceof AbortSignal) return;
        throw e;
      }
      this.request = null; this.emit();
    }

    async setup() {
      this.phase = 'setup';
      if (this.preset) {                           // 튜토리얼 등: 패·덱·코트를 직접 배치
        const st = this.preset(this) || {};
        this.firstServer = st.server ?? 0;
        if (st.start) this.presetStart = st.start;  // { p, offense }
        this.emit(); return;
      }
      // サーブ権の決定 (4-2-1-2 の無作為な決定を、コイントスの結果がそのままサーブ権になる形で行う)
      this.firstServer = this.rng() < 0.5 ? 0 : 1;
      await this.anim({ type: 'coin', winner: this.firstServer });
      this.say(`코인 토스 → ${this.pname(this.firstServer)}이(가) 첫 서브권을 가집니다.`);
      for (const pl of this.players) { this.shuffle(pl.deck); }
      for (const p of [0, 1]) this.draw(p, 6, '첫 패');
      // 引き直し (サーブ権を持つプレイヤーから順に一度だけ)
      for (const p of [this.firstServer, this.other(this.firstServer)]) {
        const pl = this.players[p];
        const ret = await this.ask(p, { type: 'mulligan', title: '패 다시 뽑기', text: '덱으로 되돌릴 카드를 고르세요. (0장이면 그대로 진행)', options: pl.hand.map(c => c.uid), min: 0, max: pl.hand.length });
        const uids = Array.isArray(ret) ? ret : [];
        if (uids.length) {
          for (const u of uids) { const c = pl.hand.find(x => x.uid === u); if (c) { pl.hand.splice(pl.hand.indexOf(c), 1); pl.deck.push(c); } }
          this.shuffle(pl.deck);
          this.say(`${this.pname(p)}: ${uids.length}장을 덱으로 되돌리고 셔플했습니다.`, p);
          this.draw(p, 6 - pl.hand.length, '다시 뽑기');
        } else this.say(`${this.pname(p)}: 다시 뽑지 않습니다.`, p);
      }
      // セットカード
      for (const pl of this.players) for (let i = 0; i < 2 && pl.deck.length; i++) pl.setArea.push(pl.deck.pop());
      this.say('양쪽 모두 덱 위 2장을 세트 에리어에 뒷면으로 놓았습니다.');
    }

    async playSet(server, start = null) {
      this.offense = null; this.defense = null; this.pending = [];
      let p = server; let first = true;
      if (start) { p = start.p; first = false; this.offense = start.offense ? { ...start.offense } : null; await this.anim({ type: 'resume', offense: this.offense }); }
      for (;;) {
        try {
          if (first) await this.serveTurn(p); else await this.normalTurn(p);
        } catch (e) {
          if (e instanceof LostSignal) { await this.lostSetStep(e.player, e.reason); return e.player; }
          throw e;
        }
        first = false; p = this.other(p);
      }
    }

    beginTurn(p, kind) {
      this.turnNo++; this.turnPlayer = p; this.turnKind = kind; this.turnFlags = { blockAppear: 0 };
      this.effects = this.effects.filter(e => e.setNo === this.setNo && e.turnNo >= this.turnNo);
      this.say(`▶ ${this.pname(p)}의 턴`, p, 'turn');
    }
    setPhase(ph) { this.phase = ph; this.say(`[${PHASE_KO[ph]}]`, this.turnPlayer, 'phase'); }

    lost(p, reason) { throw new LostSignal(p, reason); }

    // 0-1-3-2: 投了はいつでも宣言でき、ただちに敗北する
    concede(p) {
      if (this.winner != null) return;
      this.winner = this.other(p); this.phase = 'gameover'; this.request = null;
      this.history.push({ set: this.setNo, winner: this.winner, concede: true });
      this.say(`${this.pname(p)} 기권 → ${this.pname(this.winner)} 승리!`, this.winner, 'win');
      this.aborted = true;
    }

    async lostSetStep(p, reason) {
      this.say(`${this.pname(p)} 로스트 — ${reason}`, p, 'lost');
      // 「次の相手のターン中、相手がロストした時、自分は手札が7枚になるようにカードを引く」(HV-P01-090)
      for (const e of this.activeEffects('drawTo7', p)) {
        const q = e.owner, need = 7 - this.players[q].hand.length;
        if (need > 0) { this._skillCtx = null; this.draw(q, need, '「그 순간」이 있느냐 없느냐다', true); }
      }
      this.jumpTo = null;
      // 세트 결과에 남길 「마지막 점수를 낸 카드」: 이긴 쪽이 보낸 마지막 공
      const off = this.offense || this.scoreOffense, w = this.other(p); this.scoreOffense = null;
      this.lastScore = { reason, loser: p, scorer: off && off.owner === w && off.lead ? { type: off.type, value: off.value, lead: off.lead, assist: off.assist } : null };
      await this.anim({ type: 'lost', p, reason });
      this.offense = null; this.defense = null; this.pending = [];
      for (const s of [...this.players[p].sides]) this.toDrop(s);   // サイドブロッカーはドロップ
      for (const q of [0, 1]) for (const { card } of this.chars(q)) card.nameAs = null;   // 턴이 끝났으므로 2인 카드 이름도 원래대로
      this.request = null;
    }

    async interval(loser) {
      this.phase = 'interval';
      this.say('[인터벌]', null, 'phase');
      for (const p of [0, 1]) { const need = 6 - this.players[p].hand.length; if (need > 0) this.draw(p, need, '인터벌'); }
      const pl = this.players[loser];
      if (pl.setArea.length) { pl.hand.push(pl.setArea.pop()); this.say(`${this.pname(loser)}: 세트 카드 1장을 패에 넣었습니다. (남은 세트 카드 ${pl.setArea.length}장)`, loser); }
      // 継続効果・修正の終了
      this.effects = [];
      for (const p of [0, 1]) for (const { card } of this.chars(p)) card.mods = [];
      this.emit();
      await this.anim({ type: 'interval', loser });
    }

    // ───────── ターン ─────────
    async serveTurn(p) {
      this.beginTurn(p, 'serve');
      this.setPhase('serve');
      await this.checkProcess();
      await this.deployStep(p, 'serve');
      await this.freeStep(p, 'serve');
      const sc = this.top(p, 'serve');
      await this.setOffense(p, this.param(sc, 'serve'), 'serve', '', sc);
      await this.endPhase(p);
    }

    async normalTurn(p) {
      this.beginTurn(p, 'normal');
      this.setPhase('start');
      await this.checkProcess();
      const opp = this.other(p);
      const feinted = this.activeEffects('noBlock', p).length > 0;
      const canBlock = !!(this.offense && this.offense.owner === opp && this.offense.type === 'attack') && !feinted;
      if (feinted) this.say('상대의 【페인트】 효과로 이번 턴에는 블록 캐릭터를 등장시킬 수 없어 리시브합니다.', p);
      else if (!canBlock) this.say(`직전 상대가 어택하지 않았으므로(${this.offense ? (this.offense.type === 'serve' ? '서브' : '블록') : '-'}) 리시브만 선택할 수 있습니다.`, p);
      for (;;) {
        let choice = 'receive';
        if (canBlock) {
          choice = await this.ask(p, { type: 'start', title: '블록 / 리시브 선택', text: `상대 어택의 오펜스 포인트 ${this.offense.value}. 블록할지 리시브할지 고르세요.`, canBlock });
          if (choice !== 'block') choice = 'receive';
        }
        this.say(`${this.pname(p)}: ${choice === 'block' ? '블록' : '리시브'} 선택`, p);
        this.turnKind = choice;
        await this.anim({ type: choice === 'block' ? 'toBlock' : 'toReceive', p, from: this.offense ? this.offense.type : null });
        if (choice === 'block') {
          // 블록 캐릭터를 내기 전에는 취소하고 블록/리시브 선택으로 돌아갈 수 있다 (아직 아무 카드도 움직이지 않았으므로)
          const r = await this.blockPhase(p);
          if (r === 'cancel') { this.say(`${this.pname(p)}: 블록 취소 — 다시 고릅니다`, p); this.turnKind = 'normal'; this.setPhase('start'); continue; }
          if (r === 'jump') {
            const lbl = this.jumpLabel || '원터치!'; this.jumpTo = null; this.jumpLabel = null; this.turnKind = 'receive';
            await this.anim({ type: 'toReceive', p, from: 'oneTouch', value: this.offense ? this.offense.value : null, label: lbl });
            await this.drawPhase(p); await this.receivePhase(p); await this.tossPhase(p); await this.attackPhase(p);
          }
        } else { await this.drawPhase(p); await this.receivePhase(p); await this.tossPhase(p); await this.attackPhase(p); }
        break;
      }
      await this.endPhase(p);
    }

    async drawPhase(p) {
      this.setPhase('draw');
      await this.checkProcess();
      this.draw(p, 1, '리시브 드로우');
      await this.checkProcess();
      await this.freeStep(p, 'draw');
    }

    async receivePhase(p) {
      this.setPhase('receive');
      await this.checkProcess();
      await this.deployStep(p, 'receive');
      await this.freeStep(p, 'receive');
      const rc = this.top(p, 'receive');
      this.defense = this.param(rc, 'receive');
      this.say(`디펜스 포인트 산출: ${this.defense} (리시브)`, p, 'calc');
      await this.judge(p, 'receive');
    }

    async tossPhase(p) {
      this.setPhase('toss');
      await this.checkProcess();
      const rc = this.top(p, 'receive'); const rname = rc ? this.cname(rc) : null;
      await this.deployStep(p, 'toss', c => this.allowedNames(c, rname).length > 0, rc ? `리시브 캐릭터와 같은 이름(${this.nowName(rc)})은 불가` : '');
      await this.anim({ type: 'toss', p });
      await this.freeStep(p, 'toss');
    }

    async attackPhase(p) {
      this.setPhase('attack');
      await this.checkProcess();
      const tc = this.top(p, 'toss'); const tname = tc ? this.cname(tc) : null;
      await this.deployStep(p, 'attack', c => this.allowedNames(c, tname).length > 0, tc ? `토스 캐릭터와 같은 이름(${this.nowName(tc)})은 불가` : '');
      await this.anim({ type: 'set', p });
      await this.freeStep(p, 'attack');
      const t = this.param(this.top(p, 'toss'), 'toss'), a = this.param(this.top(p, 'attack'), 'attack');
      await this.setOffense(p, t + a, 'attack', `토스 ${t} + 어택 ${a}`, this.top(p, 'attack'), this.top(p, 'toss'));
    }

    async blockPhase(p) {
      this.setPhase('block');
      await this.checkProcess();
      // 登場ステップ
      const pl = this.players[p];
      const max = this.blockMax(p);
      const candidates = pl.hand.filter(c => this.isChar(c) && this.base(c, 'block') !== null);
      const ans = await this.ask(p, { type: 'blockDeploy', title: '블록 캐릭터 등장', text: `블록 캐릭터를 1~${max}장 고르세요 (같은 이름 불가). 첫 번째로 고른 카드가 센터 블로커가 됩니다. 상대 OP ${this.offense.value}`,
        options: candidates.map(c => c.uid), max, cancelable: true });
      if (ans && ans.cancel) return 'cancel';
      const picked = (ans && ans.uids ? ans.uids : []).map(u => pl.hand.find(c => c.uid === u)).filter(Boolean);
      const fixed = picked.filter(c => !this.c(c).dual).map(c => this.cname(c));
      const names = new Set(fixed);
      if (!picked.length || picked.length > max || names.size !== fixed.length) this.lost(p, '블록 캐릭터를 등장시키지 않음');
      // 2인 카드: 다른 블록 캐릭터와 겹치지 않는 이름을 고른다
      for (const c of picked.filter(x => this.c(x).dual)) {
        const nm = await this.pickName(p, c, null, [...names]);
        if (!nm || names.has(nm)) { picked.splice(picked.indexOf(c), 1); this.say(`${this.dname(c)}: 다른 블록 캐릭터와 이름이 겹쳐 등장할 수 없습니다.`, p); continue; }
        c._nm = nm; names.add(nm);
      }
      if (!picked.length) this.lost(p, '블록 캐릭터를 등장시키지 않음');
      const centerUid = ans.center && picked.some(c => c.uid === ans.center) ? ans.center : picked[0].uid;
      const appeared = [];
      for (const c of picked) {
        pl.hand.splice(pl.hand.indexOf(c), 1);
        if (c.uid === centerUid || !picked.some(x => x.uid === centerUid) && c === picked[0]) this.placeOnTop(p, 'block', c); else pl.sides.push(c);
        c.nameAs = c._nm || null; delete c._nm; c.fromHand = true; c.via = null;
        appeared.push(c);
      }
      this.turnFlags.blockAppear += appeared.length;
      this.say(`${this.pname(p)}: 블록 등장 — 센터 ${this.dname(appeared.find(c => c.uid === centerUid))}${appeared.length > 1 ? ' / 사이드 ' + appeared.filter(c => c.uid !== centerUid).map(c => this.dname(c)).join(', ') : ''}`, p, 'deploy');
      for (const c of appeared) this.onAppear(p, c, 'block', { side: pl.sides.includes(c) });
      await this.checkProcess();
      if (this.jumpTo) {               // ワンタッチ 등: 블록 페이즈를 건너뛰고 드로우 페이즈로 (8-6)
        for (const s of [...pl.sides]) { this.toDrop(s); this.say(`사이드 블로커 ${this.dname(s)} → 드롭`, p); }
        this.turnFlags.doshutArmed = 0;
        return 'jump';
      }
      await this.freeStep(p, 'block');
      // ディフェンスポイント算出
      const bc = this.blockChars(p);
      this.defense = bc.reduce((s, c) => s + (this.param(c, 'block') ?? 0), 0);
      this.say(`디펜스 포인트 산출: ${this.defense} (블록 ${bc.map(c => this.dname(c) + ' ' + this.param(c, 'block')).join(' + ')})`, p, 'calc');
      const ok = await this.judge(p, 'block');
      // ドシャット (ブロック成功時)
      if (ok && this.turnFlags.doshutArmed) {
        const vals = [...new Set(this.turnFlags.doshutList || [this.turnFlags.doshutArmed])];
        let v = this.turnFlags.doshutArmed;
        if (vals.length > 1) {   // Q&A 008: 같은 턴 도샷이 여럿이면 원하는 순서로 해결 → 마지막 것이 적용
          const [id] = await this.chooseCards(p, { title: '도샷 해결 순서', text: '도샷이 여러 개입니다. 마지막에 해결해 적용할 도샷을 고르세요.', options: vals.map(x => ({ id: String(x), label: `도샷(${x}) — 턴 종료 시 오펜스 포인트 ${x}` })), min: 1, max: 1, purpose: 'doshutPick', textOptions: true });
          if (vals.includes(+id)) v = +id;
        }
        this.turnFlags.doshut = v;
        this.say(`블록 성공! 【도샷(${this.turnFlags.doshut})】 — 이 턴 종료 시 오펜스 포인트가 ${this.turnFlags.doshut}가 됩니다.`, p, 'skill');
      }
      // オフェンスポイント算出 (ブロックは 0 基準)
      await this.setOffense(p, 0, 'block', '', this.top(p, 'block'));
      // フェイズ終了: サイドブロッカーはドロップ (드롭 더미로 날아가는 연출 뒤에)
      if (pl.sides.length) await this.anim({ type: 'sidesDrop', p, uids: pl.sides.map(c => c.uid) });
      for (const s of [...pl.sides]) { this.toDrop(s); this.say(`사이드 블로커 ${this.dname(s)} → 드롭`, p); }
      await this.checkProcess();
    }

    async judge(p, kind) {
      const op = this.offense ? this.offense.value : 0;
      const ok = this.defense >= op;
      this.say(`저지: 디펜스 ${this.defense} vs 오펜스 ${op} → ${kind === 'block' ? '블록' : '리시브'} ${ok ? '성공' : '실패'}`, p, ok ? 'ok' : 'fail');
      const parts = kind === 'block' ? this.blockChars(p).map(c => this.param(c, 'block') ?? 0) : null;
      await this.anim({ type: 'judge', p, kind, ok, dp: this.defense, op, parts, doshut: ok && kind === 'block' ? (this.turnFlags.doshutArmed || 0) : 0 });
      await this.checkProcess();
      this.scoreOffense = ok ? null : this.offense;   // 받아내지 못한 공 = 상대의 득점
      this.offense = null; this.defense = null; this.emit();
      if (!ok) this.lost(p, `${kind === 'block' ? '블록' : '리시브'} 실패`);
      return ok;
    }

    async setOffense(p, v, type, detail = '', lead = null, assist = null) {
      const snap = c => (c ? { uid: c.uid, no: c.no, ver: c.ver } : null);
      this.offense = { owner: p, value: v, type, lead: snap(lead), assist: snap(assist) };   // 점수를 낸 카드 기록용
      this.say(`오펜스 포인트 산출: ${v} (${type === 'serve' ? '서브' : type === 'block' ? '블록' : '어택'}${detail ? ' · ' + detail : ''})`, p, 'calc');
      await this.anim({ type: 'offense', p, kind: type, value: v });
    }

    async endPhase(p) {
      this.setPhase('end');
      if (this.turnFlags.doshut != null && this.offense && this.offense.owner === p) {
        this.offense.value = this.turnFlags.doshut;
        this.say(`【도샷】 해결: ${this.pname(p)}의 블록 오펜스 포인트가 ${this.turnFlags.doshut}가 되었습니다.`, p, 'skill');
        await this.anim({ type: 'doshut', p, value: this.turnFlags.doshut });
      }
      if (this.turnFlags.feint != null && this.offense && this.offense.owner === p && this.offense.type === 'attack') {
        const n = this.turnFlags.feint;
        this.offense.value = n;
        this.addEffect({ kind: 'noBlock', owner: p, target: this.other(p), turnNo: this.turnNo + 1 });
        this.say(`【페인트(${n})】 해결: 오펜스 포인트가 ${n}가 되고, 다음 상대 턴 동안 상대는 블록 캐릭터를 등장시킬 수 없습니다.`, p, 'skill');
        await this.anim({ type: 'doshut', p, value: n, label: '페인트' });
      }
      await this.checkProcess();
      // クリンナップ: 数値修正の終了
      for (const q of [0, 1]) for (const { card } of this.chars(q)) { card.mods = []; card.nameAs = null; }   // 2인 카드의 선택한 이름도 턴 종료 시까지
      this.effects = this.effects.filter(e => !(e.setNo === this.setNo && e.turnNo === this.turnNo));
      this.emit();
    }

    // ───────── 登場 ─────────
    placeOnTop(p, area, card) {
      const stack = this.players[p].areas[area];
      const prev = stack[stack.length - 1];
      if (prev) { prev.mods = []; prev.nameAs = null; }   // キャラ→ガッツ: 継続効果・選んだ名前は引き継がれない
      stack.push(card);
      // 「このキャラの上に～が登場した時」 (ガッツになったカードのスキル。手白の無効化は受けない — Q&A)
      if (prev) { const t = this.c(prev).trigger; if (t && t.kind === 'under' && t.area === area) this.pending.push({ master: p, kind: 'under', card: prev, newCard: card, area }); }
    }
    // 등장 제한 (다음 상대 턴 효과 등)
    canAppear(p, card, area, opt = {}) {
      if (area === 'receive' && this.activeEffects('noRecv6', p).length && (this.base(card, 'receive') ?? 0) >= 6) return false;
      if (area === 'attack' && opt.fromHand && this.activeEffects('noMBAtkHand', p).length && this.hasPos(card, 'MB')) return false;
      return true;
    }
    // 같은 이름 금지(리시브↔토스, 토스↔어택)를 피할 수 있는 이름 목록
    allowedNames(card, forbidden) { return this.nameChoices(card).filter(n => n !== forbidden); }
    async pickName(p, card, forbidden = null, taken = []) {
      const names = this.allowedNames(card, forbidden).filter(n => !taken.includes(n));
      if (!this.c(card).dual) return null;
      if (names.length <= 1) return names[0] || this.nameChoices(card)[0];
      const [id] = await this.chooseCards(p, { title: '카드 이름 선택', text: `「${this.dname(card)}」을(를) 어떤 이름으로 등장시킬까요? (이 턴이 끝날 때까지 유효)`, options: names.map(n => ({ id: n, label: this.krName(n) })), min: 1, max: 1, purpose: 'dualName', textOptions: true });
      return names.includes(id) ? id : names[0];
    }
    krName(jpName) { const c = this.DB && Object.values(this.DB).find(x => x.name === jpName && x.kr); return c ? c.kr : jpName; }
    // スキルなどで登場させる (手札以外からも)
    async appearBySkill(p, card, area, via) {
      const forb = area === 'attack' ? (this.top(p, 'toss') && this.cname(this.top(p, 'toss'))) : area === 'toss' ? (this.top(p, 'receive') && this.cname(this.top(p, 'receive'))) : null;
      if (!this.allowedNames(card, forb).length || !this.canAppear(p, card, area, {})) { this.say(`${this.dname(card)}은(는) ${AREA_KO[area]} 에리어에 등장할 수 없습니다.`, p); return false; }
      const nm = await this.pickName(p, card, forb);
      this.removeFromAnywhere(card); card.mods = [];
      this.placeOnTop(p, area, card);
      card.nameAs = nm; card.fromHand = false; card.via = via || null;
      this.say(`${this.pname(p)}: ${AREA_KO[area]} 에리어에 ${this.dname(card)} 등장 (스킬)`, p, 'deploy');
      this.fxNote(`${this.dname(card)} → ${AREA_KO[area]} 에리어에 등장`, card.uid);
      this.onAppear(p, card, area);
      return true;
    }

    async deployStep(p, area, filter = () => true, note = '') {
      const pl = this.players[p];
      const candidates = pl.hand.filter(c => this.isChar(c) && this.base(c, area) !== null && filter(c) && this.canAppear(p, c, area, { fromHand: true }));
      const opTxt = this.offense && this.offense.owner !== p ? ` · 상대 OP ${this.offense.value}` : '';
      const uid = await this.ask(p, { type: 'deploy', area, title: `${AREA_KO[area]} 캐릭터 등장`, text: `${AREA_KO[area]} 에리어에 등장시킬 캐릭터를 고르세요${opTxt}${note ? ' (' + note + ')' : ''}. 등장시키지 않으면 로스트합니다.`,
        options: candidates.map(c => c.uid) });
      const card = candidates.find(c => c.uid === uid);
      if (!card) this.lost(p, `${AREA_KO[area]} 캐릭터를 등장시키지 않음`);
      const forb = area === 'attack' ? (this.top(p, 'toss') && this.cname(this.top(p, 'toss'))) : area === 'toss' ? (this.top(p, 'receive') && this.cname(this.top(p, 'receive'))) : null;
      const nm = await this.pickName(p, card, forb);
      pl.hand.splice(pl.hand.indexOf(card), 1);
      this.placeOnTop(p, area, card);
      card.nameAs = nm; card.fromHand = true; card.via = null;
      this.say(`${this.pname(p)}: ${AREA_KO[area]} 에리어에 ${this.dname(card)}${nm ? '(「' + this.krName(nm) + '」)' : ''} 등장 (${PARAM_KO[area]} ${this.param(card, area)})`, p, 'deploy');
      this.onAppear(p, card, area);
      await this.checkProcess();
    }

    onAppear(p, card, area, info = {}) {
      const d = this.c(card);
      const opp = this.other(p);
      // 自身の [登場][エリア] スキル
      const tr = d.trigger;
      if (tr && tr.kind === 'appear' && (tr.areas || [tr.area]).includes(area)) this.pending.push({ master: p, kind: 'appear', card, area });
      // 「自分のブロックキャラが登場した時」(灰羽 リエーフ D02)
      if (area === 'block') {
        const at = this.top(p, 'attack');
        if (at && this.c(at).trigger?.kind === 'ownBlockAppear') this.pending.push({ master: p, kind: 'lev', card: at });
      }
      // 「元々のアタックポイントが3の自分のアタックキャラが登場した時、このキャラがトスキャラの場合」(孤爪 研磨 P01-019)
      if (area === 'attack' && this.base(card, 'attack') === 3) {
        const t = this.top(p, 'toss');
        if (t && this.c(t).trigger?.kind === 'ownAttackAppear') this.pending.push({ master: p, kind: 'watch', card: t, target: card });
      }
      // 相手がかけた「次の相手のターン中、～が登場するたび」
      const eff = (kind, cond, extra = {}) => { for (const e of this.activeEffects(kind, p)) if (cond(e)) this.pending.push({ master: e.owner, kind: 'eff', eff: e, card, ...extra }); };
      if (area === 'attack') for (const e of this.activeEffects('kenmaDebuff', p)) this.pending.push({ master: e.owner, kind: 'kenma', card, from: e.src });
      if (area === 'toss') eff('tossDebuff', () => true);
      if (area === 'receive') eff('recvDebuff', () => true);
      if (area === 'block' && !info.side) eff('centerDebuff', () => true);
      if (area === 'block') for (const e of this.activeEffects('blockOut', p)) if ((this.base(card, 'block') ?? 99) <= e.n) this.pending.push({ master: e.owner, kind: 'blockout', eff: e, card });
      // 自分のスキルの「このターン中、～が登場するたび」
      if (area === 'attack') eff('hinataBoost', () => this.cname(card) === '日向 翔陽');
      if (area === 'receive') eff('seijohRecv', () => this.hasAff(card, '青葉城西'));
      eff('irihata', () => this.hasAff(card, '青葉城西'));
    }
    // 手白 球彦: 次の相手のターン中、相手のレシーブキャラとトスキャラのスキルを無効にする
    isNegated(card) {
      const p = card.owner; const a = this.charArea(card);
      return (a === 'receive' || a === 'toss') && this.activeEffects('negateRT', p).length > 0;
    }

    // ───────── チェックプロセス ─────────
    // 5-4: ターンプレイヤー → 非ターンプレイヤーの順。同じプレイヤーの待機状態が複数ある場合、解決する 1 つはそのプレイヤーが任意に選ぶ (Q&A 1439)
    async checkProcess() {
      for (;;) {
        if (this.jumpTo) { this.pending = []; return; }   // ワンタッチ等でフェイズが移行した: 待機中のスキルは消える (Q&A)
        const tp = this.turnPlayer;
        const who = this.pending.some(x => x.master === tp) ? tp : this.pending.length ? this.other(tp) : null;
        if (who === null) return;
        const mine = this.pending.filter(x => x.master === who);
        let item = mine[0];
        const kinds = new Set(mine.map(x => x.kind + ':' + x.card.uid));
        if (kinds.size > 1) {
          const seen = new Set(); const opts = [];
          mine.forEach((x, i) => { const k = x.kind + ':' + x.card.uid; if (!seen.has(k)) { seen.add(k); opts.push({ id: String(i), label: this.pendingLabel(x) }); } });
          const [id] = await this.chooseCards(who, { title: '스킬 해결 순서', text: '대기 중인 스킬이 여러 개입니다. 먼저 해결할 스킬을 고르세요.', options: opts, min: 1, max: 1, purpose: 'pendingOrder', textOptions: true });
          item = mine[+id] || mine[0];
        }
        this.pending.splice(this.pending.indexOf(item), 1);
        await this.resolvePending(item);
      }
    }
    pendingLabel(x) {
      if (x.kind === 'appear') return `${this.dname(x.card)} — 【등장】 스킬`;
      if (x.kind === 'under') return `${this.dname(x.card)} — 위에 캐릭터가 등장했을 때 스킬`;
      if (x.kind === 'watch') return `${this.dname(x.card)} — 어택 캐릭터 등장 시 스킬`;
      if (x.kind === 'eff') return `${EFF_LABEL[x.eff.kind] || '효과'} — ${this.dname(x.card)}`;
      if (x.kind === 'blockout') return `블록아웃 — ${this.dname(x.card)}`;
      if (x.kind === 'lev') return `${this.dname(x.card)} — 블록 캐릭터 등장 시 스킬`;
      if (x.kind === 'kenma') return `코즈메 켄마의 효과 — ${this.dname(x.card)} 어택 포인트 −2`;
      return this.dname(x.card);
    }

    async resolvePending(item) {
      const { master: p, card } = item;
      if (item.kind === 'appear') {
        const loc = this.charArea(card);
        const okLoc = item.area === 'block' ? (loc === 'block' || loc === 'side') : loc === item.area;
        if (!okLoc) { this.say(`${this.dname(card)}의 스킬: 이미 해당 에리어의 캐릭터가 아니므로 해결되지 않습니다.`, p); return; }
        if (this.isNegated(card)) { this.say(`${this.dname(card)}의 스킬은 무효입니다 (테시로 타마히코의 효과).`, p); return; }
        await SKILLS[this.c(card).skill](this, p, card, item);
      } else if (item.kind === 'under') {
        await SKILLS[this.c(card).skill](this, p, card, item);
      } else if (item.kind === 'watch') {
        if (this.charArea(card) !== 'toss') return;
        if (this.isNegated(card)) { this.say(`${this.dname(card)}의 스킬은 무효입니다 (테시로 타마히코의 효과).`, p); return; }
        await SKILLS[this.c(card).skill](this, p, card, item);
      } else if (item.kind === 'eff') {
        await resolveEffect(this, item);
      } else if (item.kind === 'blockout') {
        this.say(`【블록아웃(${item.eff.n})】: 원래 블록 포인트 ${this.base(card, 'block')}인 블록 캐릭터 ${this.dname(card)} 등장 → ${this.pname(card.owner)} 로스트`, p, 'skill');
        await this.withSkill(p, item.eff.src != null ? { uid: item.eff.src } : null, async () => { this.fxNote(`블록아웃 → ${this.pname(card.owner)} 로스트`); }, { label: '블록아웃' });
        this.lost(card.owner, `블록아웃(${item.eff.n})`);
      } else if (item.kind === 'lev') {
        await SKILLS.lev(this, p, card, item);
      } else if (item.kind === 'kenma') {
        if (this.charArea(card) !== 'attack') return;
        this.say(`코즈메 켄마의 효과 (${this.pname(p)}): 상대 어택 캐릭터의 어택 포인트 −2`, p);
        await this.withSkill(p, item.from != null ? { uid: item.from } : null, async () => { this.addMod(card, 'attack', -2, 'kenma'); }, { label: '코즈메 켄마의 효과' });
      }
    }

    // ───────── フリーステップ ─────────
    playableEvents(p, phase) {
      const noTA = this.activeEffects('noTAEvents', p).length > 0;
      return this.players[p].hand.filter(c => {
        const d = this.c(c);
        if (d.type === 'E') return (d.timing || []).includes(phase) && !(noTA && d.timing.some(t => t === 'toss' || t === 'attack'));
        if (d.trigger?.kind !== 'hand' || d.trigger.phase !== phase) return false;   // 縁下 力 等: [レシーブフェイズ][手札]
        const aff = d.handAff; return !aff || this.chars(p).some(x => this.hasAff(x.card, aff) && this.base(x.card, 'receive') !== null);   // 대상이 있을 때만
      });
    }

    async freeStep(p, phase) {
      for (;;) {
        await this.checkProcess();
        const playable = this.playableEvents(p, phase);
        const ans = await this.ask(p, { type: 'free', phase, title: `${PHASE_KO[phase]} · 프리 스텝`, text: playable.length ? '이벤트 카드를 플레이하거나 다음으로 진행하세요.' : '다음으로 진행하거나 로스트를 선언할 수 있습니다.', options: playable.map(c => c.uid) });
        if (ans && ans.action === 'play') {
          const card = playable.find(c => c.uid === ans.uid);
          if (!card) continue;
          await this.playEvent(p, card);
          continue;
        }
        if (ans && ans.action === 'lost') this.lost(p, '로스트 선언');
        return;
      }
    }

    async playEvent(p, card) {
      const pl = this.players[p];
      if (this.c(card).type === 'C') {          // 手札のキャラのスキル: 〔手札からこのカードをドロップする〕
        this.toDrop(card);
        this.say(`${this.pname(p)}: 「${this.dname(card)}」을(를) 패에서 드롭하고 스킬 사용`, p, 'event');
        await this.withSkill(p, card, () => SKILLS[this.c(card).skill](this, p, card, {}), { fallback: '효과 없음' });
        return;
      }
      pl.hand.splice(pl.hand.indexOf(card), 1);
      pl.event.push(card);
      this.say(`${this.pname(p)}: 이벤트 「${this.dname(card)}」 플레이`, p, 'event');
      if (this.activeEffects('turn1', p).some(e => e.name === this.cname(card))) {
        this.say(`「${this.dname(card)}」: 이번 턴에 이미 사용한 【턴1】 카드라 스킬이 무효입니다.`, p);
        await this.withSkill(p, card, async () => {}, { event: true, fallback: '【턴1】 — 스킬 무효' });
        return;
      }
      let res;
      await this.withSkill(p, card, async () => { res = await SKILLS[this.c(card).skill](this, p, card, {}); }, { event: true, fallback: '효과 없음' });
      if (this.c(card).turn1 && res !== false) this.addEffect({ kind: 'turn1', owner: p, target: p, turnNo: this.turnNo, name: this.cname(card) });
    }

    // ───────── スキル補助 ─────────
    // ガッツ払いの対象エリア: サイドブロッカーはブロックエリア(センター下)のガッツを払う (よくある質問 Q11)
    gutsArea(card) { const a = this.charArea(card); return a === 'side' ? 'block' : a; }
    gutsCount(card) { const a = this.gutsArea(card); return a ? this.guts(card.owner, a).length : 0; }
    payGuts(card, n) {
      const p = card.owner, a = this.gutsArea(card), stack = this.players[p].areas[a];
      const paid = [];
      for (let i = 0; i < n; i++) {
        const idx = stack.length - 2; if (idx < 0) break;
        const g = stack.splice(idx, 1)[0]; g.mods = []; this.players[p].drop.push(g); paid.push(g);
      }
      this.say(`${this.pname(p)}: ${AREA_KO[a]} 에리어에서 ${paid.length}가츠 지불 (${paid.map(x => this.dname(x)).join(', ')})`, p, 'cost');
      return paid;
    }
    async chooseCards(p, req) { const r = await this.ask(p, { type: 'choose', ...req }); return Array.isArray(r) ? r : (r == null ? [] : [r]); }
    async discardFromHand(p, purpose, text, filter = () => true) {
      const pl = this.players[p];
      const cands = pl.hand.filter(filter); if (!cands.length) return null;
      const [u] = await this.chooseCards(p, { title: '드롭할 카드 선택', text: text || '패에서 드롭할 카드 1장을 고르세요.', options: cands.map(c => c.uid), min: 1, max: 1, purpose });
      const card = cands.find(c => c.uid === u) || cands[0];
      this.toDrop(card);
      this.say(`${this.pname(p)}: 패에서 ${this.dname(card)}을(를) 드롭`, p, 'cost');
      return card;
    }
    // ── 부스터 1탄용 보조 ──
    paramChoices(card) { return PARAMS.filter(k => this.base(card, k) !== null); }
    async chooseParam(p, card, delta, title) {
      const ks = this.paramChoices(card); if (!ks.length) return null;
      if (ks.length === 1) return ks[0];
      const [id] = await this.chooseCards(p, { title: title || '파라미터 선택', text: `「${this.dname(card)}」의 어느 파라미터에 ${delta > 0 ? '+' : ''}${delta} 할까요?`, options: ks.map(k => ({ id: k, label: `${PARAM_KO[k]} ${this.param(card, k)} → ${this.param(card, k) + delta}` })), min: 1, max: 1, purpose: 'param', card: card.uid, delta, textOptions: true });
      return ks.includes(id) ? id : ks[0];
    }
    async buffParam(p, card, delta, src) { const k = await this.chooseParam(p, card, delta); if (k) this.addMod(card, k, delta, src); return k; }
    gutsIn(p, areas) { return areas.flatMap(a => this.guts(p, a)); }
    // 여러 에리어에서 합계 N 가츠 지불 (지불할 카드는 플레이어가 고름)
    async payGutsMulti(p, areas, n, why) {
      const pool = this.gutsIn(p, areas); if (pool.length < n) return null;
      let pick = pool;
      if (pool.length > n) {
        const u = await this.chooseCards(p, { title: `${n}가츠 지불`, text: `${why ? why + ' — ' : ''}지불할 가츠 ${n}장을 고르세요 (${areas.map(a => AREA_KO[a]).join('·')} 에리어).`, options: pool.map(c => c.uid), min: n, max: n, purpose: 'payGuts' });
        pick = pool.filter(c => u.includes(c.uid));
        if (pick.length !== n) pick = pool.slice(0, n);
      }
      for (const g of pick) { this.removeFromAnywhere(g); g.mods = []; this.players[p].drop.push(g); }
      this.say(`${this.pname(p)}: ${n}가츠 지불 (${pick.map(x => this.dname(x)).join(', ')})`, p, 'cost');
      return pick;
    }
    async yesno(p, card, text, extra = {}) {
      return !!(await this.ask(p, { type: 'yesno', title: `${this.dname(card)}의 스킬`, text, card: card.uid, skill: this.c(card).skill, ...extra }));
    }
    oppOffense(p) { return this.offense && this.offense.owner !== p ? this.offense.value : null; }
    // 【원터치(N)】: 상대 어택의 오펜스 포인트 −N, 블록 페이즈를 바로 끝내고 자신의 드로우 페이즈로
    oneTouch(p, n) {
      if (n && this.offense && this.offense.owner !== p) { this.offense.value -= n; this.say(`【원터치(${n})】 상대 어택의 오펜스 포인트 −${n} → ${this.offense.value}`, p, 'skill'); this.fxNote(`원터치(${n}) — 상대 OP −${n} → ${this.offense.value}`); }
      this.jumpTo = 'draw'; this.jumpLabel = n ? `원터치(${n})!` : '블록 페이즈 종료';
      this.say('블록 페이즈를 바로 끝내고 드로우 페이즈로 넘어갑니다.', p, 'skill');
      this.fxNote('블록 페이즈 종료 → 드로우 페이즈로');
    }
    async chooseChar(p, filter, title, purpose) {
      const cands = this.chars(p).map(x => x.card).filter(filter);
      if (!cands.length) { this.say(`대상이 될 캐릭터가 없습니다.`, p); return null; }
      const [u] = await this.chooseCards(p, { title, text: '대상 캐릭터를 고르세요.', options: cands.map(c => c.uid), min: 1, max: 1, purpose, zone: 'court' });
      return cands.find(c => c.uid === u) || cands[0];
    }
    // 「Nガッツ払えば使える」型の任意スキル
    async optionalGuts(p, card, n, label, effect) {
      const have = this.gutsCount(card);
      if (have < n) { this.say(`${this.dname(card)}의 스킬: 가츠 ${have}/${n} — 지불할 수 없어 사용하지 않습니다.`, p); return false; }
      const yes = await this.ask(p, { type: 'yesno', title: `${this.dname(card)}의 스킬`, text: `${n}가츠를 지불하고 「${label}」을(를) 사용할까요? (가츠 ${have}장)`, card: card.uid, skill: this.c(card).skill });
      if (!yes) { this.say(`${this.dname(card)}의 스킬을 사용하지 않았습니다.`, p); return false; }
      this.payGuts(card, n);
      await this.withSkill(p, card, effect, { fallback: label });
      return true;
    }
  }

  // ───────── カード別スキル ─────────
  const SKILLS = {
    async hinataD01(g, p, card) {
      await g.optionalGuts(p, card, 2, '어택 포인트 +2', async () => g.addMod(card, 'attack', 2, card.uid));
    },
    async kageyamaD01(g, p, card) {
      await g.optionalGuts(p, card, 2, '토스 포인트 +2', async () => g.addMod(card, 'toss', 2, card.uid));
    },
    async tsukishimaD01(g, p, card) {
      const op = g.offense && g.offense.owner !== p ? g.offense.value : null;
      if (op === null || op > 4) { g.say(`츠키시마 케이의 스킬: 상대 오펜스 포인트가 4 이하가 아니라(${op ?? '-'}) 사용할 수 없습니다.`, p); return; }
      await g.optionalGuts(p, card, 1, '카드 1장 뽑기', async () => g.draw(p, 1, '츠키시마 케이'));
    },
    async nishinoyaD01(g, p, card) {
      await g.optionalGuts(p, card, 3, '카드 1장 뽑기 + 리시브 포인트 +2', async () => { g.draw(p, 1, '니시노야 유'); g.addMod(card, 'receive', 2, card.uid); });
    },
    async ennoshitaD01(g, p, card) { await discardSkill(g, p, card, 3); },
    async yakuD02(g, p, card) { await discardSkill(g, p, card, 2); },
    async kenmaD02(g, p, card) {
      await g.optionalGuts(p, card, 2, '토스 포인트 +1, 다음 상대 턴 상대 어택 캐릭터 −2', async () => {
        g.addMod(card, 'toss', 1, card.uid);
        g.addEffect({ kind: 'kenmaDebuff', owner: p, target: g.other(p), turnNo: g.turnNo + 1, src: card.uid });
        g.say('다음 상대 턴 동안 상대의 어택 캐릭터가 등장할 때마다 어택 포인트 −2.', p, 'skill');
      });
    },
    async kurooD02(g, p, card) {
      await g.optionalGuts(p, card, 1, '블록 성공 시 도샷(5)', async () => {
        (g.turnFlags.doshutList = g.turnFlags.doshutList || []).push(5); g.turnFlags.doshutArmed = 5;
        g.say('이번 턴 블록에 성공하면 【도샷(5)】합니다.', p, 'skill');
      });
    },
    async shibayamaD02(g, p, card) {
      await g.optionalGuts(p, card, 2, '카드 1장 뽑기', async () => g.draw(p, 1, '시바야마 유키'));
    },
    async lev(g, p, card) {
      if (g.charArea(card) !== 'attack') { g.say('하이바 레프의 스킬: 이미 어택 캐릭터가 아니므로 해결되지 않습니다.', p); return; }
      const bc = g.blockChars(p);
      const blocked = bc.some(c => g.cname(c) === '灰羽 リエーフ') ? '이미 블록 캐릭터 「하이바 레프」가 있음'
        : bc.length >= 3 ? '블록 캐릭터가 이미 3명' : g.turnFlags.blockAppear >= g.blockMax(p) ? `이번 턴 블록 캐릭터는 ${g.blockMax(p)}명까지만 등장 가능` : '';
      const have = g.gutsCount(card);
      if (have < 2) {
        if (!g.turnFlags.levNotice) g.say(`하이바 레프의 스킬: 어택 에리어 가츠 ${have}/2 — 사용할 수 없습니다.`, p);
        g.turnFlags.levNotice = true; return;
      }
      const yes = await g.ask(p, { type: 'yesno', title: '하이바 레프의 스킬', text: `어택 에리어에서 2가츠를 지불하고 이 캐릭터를 사이드 블로커로 등장시킬까요?${blocked ? ` ⚠ ${blocked} → 가츠만 지불되고 이동하지 않습니다.` : ''}`, card: card.uid, skill: 'lev', allowed: !blocked });
      if (!yes) { g.say('하이바 레프의 스킬을 사용하지 않았습니다.', p); return; }
      g.payGuts(card, 2);
      if (blocked) { g.say(`하이바 레프는 블록 에리어에 등장할 수 없습니다 (${blocked}).`, p); await g.withSkill(p, card, async () => {}, { fallback: '등장할 수 없어 가츠만 지불' }); return; }
      const stack = g.players[p].areas.attack; stack.splice(stack.indexOf(card), 1);
      g.players[p].sides.push(card);
      g.turnFlags.blockAppear++;
      g.say(`하이바 레프가 사이드 블로커로 등장 (블록 ${g.param(card, 'block')})`, p, 'deploy');
      await g.withSkill(p, card, async () => { g.fxNote(`사이드 블로커로 등장 (블록 ${g.param(card, 'block')})`); });
      g.onAppear(p, card, 'block', { side: true });
    },
    // イベント
    async evtUeWoMuku(g, p) {
      g.draw(p, 1, '이벤트');
      const t = await g.chooseChar(p, c => g.base(c, 'receive') !== null, '리시브 포인트 +1 대상', 'receiveBuff');
      if (!t) return;
      g.addMod(t, 'receive', 1, 'evt');
      if (g.param(t, 'receive') <= 4) { g.say('리시브 포인트가 4 이하이므로 추가로 +1', p); g.addMod(t, 'receive', 1, 'evt'); }
    },
    async evtBroad(g, p) {
      g.draw(p, 1, '이벤트');
      const t = await g.chooseChar(p, c => g.hasAff(c, '烏野') && g.base(c, 'attack') !== null, '어택 포인트 +1 대상 (카라스노)', 'attackBuff');
      if (t) g.addMod(t, 'attack', 1, 'evt');
      const tc = g.top(p, 'toss'), ac = g.top(p, 'attack');
      if (tc && ac && g.cname(tc) === '影山 飛雄' && g.cname(ac) === '日向 翔陽') {
        g.addEffect({ kind: 'blockMax', owner: p, target: g.other(p), max: 1, turnNo: g.turnNo + 1 });
        g.say('카게야마→히나타 브로드 공격! 다음 상대 턴 동안 상대는 블록 캐릭터를 1명까지만 등장시킬 수 있습니다.', p, 'skill');
      }
    },
    async evtNobukatsu(g, p) {
      g.draw(p, 1, '이벤트');
      const kuroo = g.blockChars(p).filter(c => g.cname(c) === '黒尾 鉄朗');
      const opts = [];
      if (kuroo.length) opts.push({ id: 'kuroo', label: '블록 캐릭터 「쿠로오 테츠로」 블록 포인트 +1' });
      if (g.chars(p).some(x => g.base(x.card, 'receive') !== null)) opts.push({ id: 'recv', label: '자신의 캐릭터 1명 리시브 포인트 +1' });
      if (!opts.length) return;
      const [pick] = await g.chooseCards(p, { title: '효과 선택', text: '다음 중 하나를 골라 사용할 수 있습니다.', options: opts, min: 1, max: 1, purpose: 'nobukatsu', textOptions: true });   // 「以下から1つを選んで使える」: 쓸 수 있으면 반드시 하나 (082와 같은 해석)
      if (pick === 'kuroo') {
        let t = kuroo[0];
        if (kuroo.length > 1) t = await g.chooseChar(p, c => kuroo.includes(c), '블록 포인트 +1 대상', 'blockBuff');
        g.addMod(t, 'block', 1, 'evt');
      } else if (pick === 'recv') {
        const t = await g.chooseChar(p, c => g.base(c, 'receive') !== null, '리시브 포인트 +1 대상', 'receiveBuff');
        if (t) g.addMod(t, 'receive', 1, 'evt');
      }
    },
    async evtButsuri(g, p) {
      g.draw(p, 1, '이벤트');
      const pl = g.players[p];
      const look = pl.deck.slice(-3).reverse();          // 上から順
      if (!look.length) return;
      const targets = look.filter(c => ['灰羽 リエーフ', '犬岡 走'].includes(g.cname(c)));
      g.say(`${g.pname(p)}: 덱 위 ${look.length}장을 확인합니다.`, p);
      const [u] = await g.chooseCards(p, { title: '덱 위 카드 확인', text: `덱 위 ${look.length}장입니다. 「하이바 레프」 또는 「이누오카 소」 1장까지 공개해 패에 넣을 수 있습니다.`, options: targets.map(c => c.uid), reveal: look.map(c => c.uid), min: 0, max: 1, purpose: 'butsuri', zone: 'look' });
      const picked = targets.find(c => c.uid === u);
      if (picked) await g.addToHand(p, [picked], '공개');   // 이와이즈미 · 텐도 · 「나도 그렇게 생각했어☆」 판정을 거침
      const rest = look.filter(c => g.where(c) === 'deck');
      let order = rest;
      if (rest.length > 1) {
        const r = await g.ask(p, { type: 'order', title: '덱 아래로 보낼 순서', text: '덱 아래에 둘 순서대로 카드를 누르세요. 먼저 고른 카드부터 덱 아래에 놓입니다(나중에 놓은 카드가 가장 아래).', options: rest.map(c => c.uid), zone: 'look' });
        if (Array.isArray(r) && r.length === rest.length) order = r.map(x => rest.find(c => c.uid === x)).filter(Boolean);
      }
      for (const c of order) pl.deck.splice(pl.deck.indexOf(c), 1);
      for (const c of order) pl.deck.unshift(c);   // 1枚ずつデッキの下へ: 先に置いたカードほど上側 (deck[0] が一番下)
      g.say(`${g.pname(p)}: 나머지 ${rest.length}장을 덱 아래에 놓았습니다.`, p);
    },
  };

  async function resolveEffect(g, item) {

  async function discardCost(g, p, card, filter, what, label, fn) {

  // 덱 위 1장 공개 → (조건) → 덱 아래
  async function revealThen(g, p, fn) {

    const picked = targets.find(c => c.uid === u);
