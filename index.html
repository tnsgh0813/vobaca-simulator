/* Layout: 体育館のコート — 上が相手コート、中央がネットとボール(OP)、下が自分コート。右パネルに指示とログ。 */

.stage { --hw: clamp(58px, min(7vw, 9dvh), 96px); --handh: calc(var(--hw) * 1.397 + 70px);
  position: relative; display: flex; flex-direction: column; align-items: center; min-height: 0; container-type: size; padding: 50px max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); overflow: hidden; }
/* ── 플레이 매트 (공식 매트 배치: 왼쪽 세트·서브 / 가운데 코트 = 블록 줄 + 리시브·토스·어택 / 오른쪽 덱·드롭·이벤트) ── */
.arena { position: relative; container-type: size; flex: 0 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
  height: calc(100cqh - var(--handh) - 16px); width: min(100%, calc((100cqh - var(--handh) - 16px) * 1.8)); margin-inline: auto; padding: 10px; border-radius: 14px;
  background: repeating-linear-gradient(90deg, rgba(90,52,20,.10) 0 2px, transparent 2px 96px),
    repeating-linear-gradient(90deg, transparent 0 47px, rgba(255,240,215,.08) 47px 49px, transparent 49px 96px),
    linear-gradient(180deg, var(--wood-a), var(--wood-b));
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), 0 10px 40px rgba(20,8,2,.55);
  outline: 3px solid rgba(255,255,255,.78); outline-offset: 7px;   /* 코트 라인 */ }
.mat { --slot: max(30px, min(calc((100cqh - 200px) / 5.6), 15cqi, 124px)); --col: max(72px, calc(var(--slot) * 1.12 + 12px));
  position: relative; display: grid; gap: 6px; padding: 12px 8px 8px; min-height: 0; border-radius: 10px; color: var(--mat-ink);
  background: linear-gradient(180deg, var(--mat-a), var(--mat-b)); box-shadow: 0 6px 16px rgba(40,20,0,.35), inset 0 0 0 1px rgba(0,0,0,.08);
  grid-template-columns: var(--col) minmax(0, 1fr) var(--col);
  grid-template-areas: "set court deck" "serve court drop" "serve court event"; grid-template-rows: auto 1fr auto; }
/* 상대 매트: 위아래 뒤집고, 메인 줄은 어택 · 토스 · 리시브 순서 (상대 어택이 내 리시브 바로 위) */
.mat.opp { grid-template-areas: "serve court event" "serve court drop" "set court deck"; grid-template-rows: auto 1fr auto; }
.mat.active { box-shadow: 0 6px 16px rgba(40,20,0,.35), 0 0 0 3px var(--team); }
.mat .who { position: absolute; left: 18px; top: 0; transform: translate(0, -45%); z-index: 3; display: flex; align-items: center; gap: 6px; white-space: nowrap;
  font-family: var(--f-display); font-size: 13px; padding: 2px 12px; border-radius: 999px; background: #1a1a1a; color: var(--team); border: 2px solid var(--team); }

.mat .who em { font-style: normal; font-family: var(--f-ui); font-size: 11px; font-weight: 700; color: #ddd; }
.mat .who em.turn { background: var(--team); color: #160c00; border-radius: 999px; padding: 0 7px; }
.court { grid-area: court; display: flex; flex-direction: column; gap: 0; padding: 5px; border-radius: 4px; min-width: 0;
  background: var(--court); box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 5px rgba(0,0,0,.08); }
.mat.opp .court { flex-direction: column-reverse; }
.court > .a-block, .mainrow { flex: 1 1 auto; }
.mainrow { display: flex; gap: 6px; padding-top: 5px; }
.mat.opp .mainrow { padding-top: 0; padding-bottom: 5px; flex-direction: row-reverse; }   /* 상대: 어택 · 토스 · 리시브 → 상대 어택이 내 리시브 위 */
.area { position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; border-radius: 4px; cursor: pointer; min-width: 0; }
.area .slot { position: relative; width: var(--slot); aspect-ratio: 744 / 1039; }
.area .slot > .card, .area .slot > .empty { position: relative; z-index: 1; width: 100%; }
.area .gl { position: absolute; inset: 0; border-radius: 4px; background: #f3efe6; border: 1px solid rgba(0,0,0,.35);
  transform: translate(calc(var(--i) * 3px), calc(var(--i) * -3px)); z-index: 0; }
.empty { width: var(--slot); aspect-ratio: 744 / 1039; border-radius: 4px; border: 1.5px dashed rgba(255,255,255,.55); }
.area .lab { font-family: var(--f-display); font-style: italic; font-size: clamp(11px, 2.1cqi, 19px); line-height: 1.05; letter-spacing: .02em; color: #fff;
  transform: skewX(-8deg); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.area .meta { position: absolute; right: 4px; top: 4px; z-index: 2; font-size: 10px; font-weight: 700; line-height: 15px; padding: 0 5px; border-radius: 999px;
  color: #fff; background: rgba(0,0,0,.45); font-variant-numeric: tabular-nums; }
.area .meta.zero { display: none; }
.mainrow .area { flex: 1 1 0; padding: 11px 6px; }
/* 에리어 이름은 카드 왼쪽에 크게 (세로 공간 절약) */
.mainrow .area .lab, .a-serve .lab { position: absolute; left: 14px; top: 50%; transform: translateY(-50%) skewX(-8deg); font-size: clamp(14px, 2.2cqi, 30px); opacity: .95; pointer-events: none; }
.a-serve .lab { left: 50%; top: auto; bottom: 6px; transform: translateX(-50%) skewX(-8deg); font-size: clamp(12px, 1.5cqi, 20px); white-space: nowrap; }
.a-serve { padding-bottom: 28px !important; }
.a-receive { background: var(--c-receive); } .a-toss { background: var(--c-toss); } .a-attack { background: var(--c-attack); }
.area .corner { position: absolute; width: 12px; height: 12px; border: 2.5px solid rgba(255,255,255,.9); }
.area .c1 { left: 5px; top: 5px; border-right: 0; border-bottom: 0; } .area .c2 { right: 5px; top: 5px; border-left: 0; border-bottom: 0; }
.area .c3 { left: 5px; bottom: 5px; border-right: 0; border-top: 0; } .area .c4 { right: 5px; bottom: 5px; border-left: 0; border-top: 0; }
.a-serve { grid-area: serve; align-self: stretch; background: var(--c-serve); padding: 8px 4px 6px; }

  box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); align-items: end; }

.bslot { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3px 2px; border-radius: 3px; border: 1.5px solid rgba(255,255,255,.18); justify-self: stretch; }
.bslot.bside .slot { width: calc(var(--slot) * .82); }

.bslot:nth-child(1) { grid-area: s1; } .bslot.bcenter { grid-area: c; } .bslot:nth-child(3) { grid-area: s2; }

.area.hot { z-index: 2; box-shadow: 0 0 0 3px #fff3b0, 0 0 0 6px var(--ball), 0 0 22px 6px rgba(255,210,63,.65); animation: hotpulse 1.2s ease-in-out infinite; }
@keyframes hotpulse { 50% { box-shadow: 0 0 0 3px #fff3b0, 0 0 0 6px rgba(255,210,63,.45), 0 0 10px 2px rgba(255,210,63,.3); } }
/* 세트·덱·드롭·이벤트: 더미 옆에 이름·장수 (세로 공간 절약) */
.zone { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; justify-content: center; align-items: center; align-content: center; column-gap: 7px; row-gap: 0; padding: 5px 4px; border-radius: 6px; background: rgba(255,255,255,.35); border: 1.5px solid rgba(0,0,0,.08); }
.zone .pile { grid-row: 1 / 3; align-self: center; }
.zone .zl { align-self: end; } .zone b { align-self: start; font-size: 17px !important; }
.zone .zl { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--mat-ink-2); white-space: nowrap; }
.zone b { font-family: var(--f-display); font-size: 15px; line-height: 1; font-weight: 400; font-variant-numeric: tabular-nums; }
.z-set { grid-area: set; } .z-deck { grid-area: deck; } .z-drop { grid-area: drop; cursor: pointer; } .z-event { grid-area: event; cursor: pointer; align-self: start; }
.z-drop { background: #5a5a5a; color: #fff; } .z-drop .zl { color: #ddd; }
.pile { position: relative; width: calc(var(--slot) * .5); aspect-ratio: 744 / 1039; }

@keyframes pulse { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
/* 스킬 · 이벤트 발동 기록 (오른쪽 아래에 쌓임) */

  background: linear-gradient(100deg, color-mix(in srgb, var(--tc) 30%, #0d0f16) 0%, rgba(13,15,22,.94) 60%); border: 1.5px solid color-mix(in srgb, var(--tc) 70%, transparent);
  box-shadow: 0 8px 22px rgba(0,0,0,.5); opacity: .82; transition: opacity .3s; }

.fxlayer { position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: visible; }
.vball { z-index: 5; } .vshadow { z-index: 4; } .vghost { z-index: 3; } .vburst, .vring, .vpart { z-index: 6; } .vbanner { z-index: 8; }

/* ── カード ── */
.card { position: relative; width: var(--slot); aspect-ratio: 744 / 1039; border-radius: 4px; overflow: hidden; border: 0; padding: 0; background: #222; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.45); flex: 0 0 auto; }

/* ── 手札 ── */

  position: absolute; left: 50%; bottom: 16px; width: var(--hw); z-index: calc(10 + var(--i)); pointer-events: auto;
  transform: translateX(var(--tx)) translateY(calc(var(--off) * var(--off) * var(--dr, 1.4px))) rotate(calc(var(--off) * var(--rot, 4deg)));

<script>
// バボカ BREAK ルールエンジン（総合ルール ver.1.06 準拠・スターターデッキ HV-D01/HV-D02 範囲）
// 進行は async 関数で直線的に書き、プレイヤーの判断は agent.decide(game, request) を await して受け取る。
(function (G) {
  'use strict';
  const PARAMS = ['serve', 'block', 'receive', 'toss', 'attack'];
  const AREAS = ['serve', 'block', 'receive', 'toss', 'attack'];
  const AREA_KO = { serve: '서브', block: '블록', receive: '리시브', toss: '토스', attack: '어택', side: '사이드 블록' };
  const PARAM_KO = { serve: '서브', block: '블록', receive: '리시브', toss: '토스', attack: '어택' };
  const PHASE_KO = { setup: '준비', serve: '서브 페이즈', start: '스타트 페이즈', block: '블록 페이즈', draw: '드로우 페이즈',
    receive: '리시브 페이즈', toss: '토스 페이즈', attack: '어택 페이즈', end: '엔드 페이즈', interval: '인터벌', gameover: '게임 종료' };
  const TIMING_KO = { serve: '서브', block: '블록', draw: '드로우', receive: '리시브', toss: '토스', attack: '어택' };

  class LostSignal { constructor(player, reason) { this.player = player; this.reason = reason; } }
  class AbortSignal {}

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  class Game {
    constructor(opts) {
      this.DB = opts.DB;
      this.seed = opts.seed ?? (Date.now() >>> 0);
      this.rng = mulberry32(this.seed);
      this.agents = opts.agents;
      this.onChange = opts.onChange || (() => {});
      this.animator = opts.animator || null;
      this.preset = opts.preset || null;       // 튜토리얼: 盤面を直接用意し、指定したターンから開始
      this.presetStart = null;   // 演出フック (UI 側)。無ければ即時進行
      this.names = opts.names || ['P1', 'P2'];
      this.uidSeq = 0;
      this.log = [];
      this.players = [0, 1].map(i => this.makePlayer(i, opts.decks[i]));
      this.turnNo = 0; this.setNo = 0;
      this.effects = [];      // 継続効果・遅発型効果
      this.pending = [];      // 待機状態のパッシブ型スキル
      this.offense = null;    // { owner, value, type: 'serve'|'block'|'attack' }
      this.defense = null;
      this.phase = 'setup'; this.turnPlayer = null; this.turnKind = null;
      this.turnFlags = {};
      this.winner = null; this.request = null; this.aborted = false;
      this.history = [];      // セット結果
      this.maxDecisions = opts.maxDecisions || 100000; this.decisions = 0;
    }

    // ───────── 基本ユーティリティ ─────────
    makePlayer(i, deck) {
      const cards = [];
      for (const [no, n, ver] of deck.list) for (let k = 0; k < n; k++) cards.push({ uid: ++this.uidSeq, no, ver, owner: i, mods: [] });
      return { idx: i, deckInfo: deck, deck: cards, hand: [], drop: [], setArea: [], event: [],
        areas: { serve: [], block: [], receive: [], toss: [], attack: [] }, sides: [] };
    }
    c(card) { return this.DB[card.no]; }
    cname(card) { return this.c(card).name; }               // ルール判定用 (カード名・日本語原文)
    dname(card) { return this.c(card).kr || this.c(card).name; } // 表示用 (韓国語)
    isChar(card) { return this.c(card).type === 'C'; }
    shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(this.rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    say(text, player = null, kind = '') { this.log.push({ text, player, kind, turn: this.turnNo, set: this.setNo }); this.emit(); }
    emit() { if (!this.aborted) this.onChange(this); }
    pname(p) { return this.names[p]; }
    other(p) { return 1 - p; }

    base(card, p) { const v = this.c(card).params?.[p]; return v === undefined ? null : v; }
    param(card, p) {
      const b = this.base(card, p);
      if (b === null) return null;                          // 「－」は修正を受けない (1-3-2-1-2)
      return b + card.mods.filter(m => m.param === p).reduce((s, m) => s + m.delta, 0);
    }
    addMod(card, p, delta, src) {
      if (this.base(card, p) === null) { this.say(`${this.dname(card)}은(는) ${PARAM_KO[p]} 포인트가 「－」라 수정되지 않습니다.`); return; }
      card.mods.push({ param: p, delta, src });
      this.say(`${this.dname(card)}의 ${PARAM_KO[p]} 포인트 ${delta > 0 ? '+' : ''}${delta} → ${this.param(card, p)}`, card.owner, 'mod');
    }

    top(p, area) { const a = this.players[p].areas[area]; return a.length ? a[a.length - 1] : null; }
    guts(p, area) { const a = this.players[p].areas[area]; return a.slice(0, Math.max(0, a.length - 1)); }
    // コート上のキャラ一覧 [{card, area}]
    chars(p) {
      const out = [];
      for (const a of AREAS) { const t = this.top(p, a); if (t) out.push({ card: t, area: a }); }
      for (const s of this.players[p].sides) out.push({ card: s, area: 'side' });
      return out;
    }
    blockChars(p) { const out = []; const t = this.top(p, 'block'); if (t) out.push(t); return out.concat(this.players[p].sides); }
    charArea(card) {
      const pl = this.players[card.owner];
      for (const a of AREAS) if (this.top(card.owner, a) === card) return a;
      if (pl.sides.includes(card)) return 'side';
      return null;
    }
    // カードの所在
    where(card) {
      const pl = this.players[card.owner];
      for (const k of ['hand', 'deck', 'drop', 'setArea', 'event']) if (pl[k].includes(card)) return k;
      if (pl.sides.includes(card)) return 'side';
      for (const a of AREAS) if (pl.areas[a].includes(card)) return a;
      return null;
    }
    removeFromAnywhere(card) {
      const pl = this.players[card.owner];
      for (const k of ['hand', 'deck', 'drop', 'setArea', 'event', 'sides']) { const i = pl[k].indexOf(card); if (i >= 0) { pl[k].splice(i, 1); return; } }
      for (const a of AREAS) { const i = pl.areas[a].indexOf(card); if (i >= 0) { pl.areas[a].splice(i, 1); return; } }
    }
    toDrop(card) { this.removeFromAnywhere(card); card.mods = []; this.players[card.owner].drop.push(card); }

    draw(p, n = 1, why = '') {
      const pl = this.players[p]; let got = 0;
      for (let i = 0; i < n; i++) {
        if (!pl.deck.length) { this.say(`${this.pname(p)}: 덱이 0장이라 카드를 뽑지 못하고 계속 진행합니다.`, p); break; }
        pl.hand.push(pl.deck.pop()); got++;
      }
      if (got) this.say(`${this.pname(p)}: 카드 ${got}장을 뽑았습니다${why ? ' (' + why + ')' : ''}. 패 ${pl.hand.length}장`, p, 'draw');
      return got;
    }

    // ───────── 継続効果 ─────────
    addEffect(e) { this.effects.push({ ...e, setNo: this.setNo }); this.emit(); }
    activeEffects(kind, target) { return this.effects.filter(e => e.kind === kind && e.setNo === this.setNo && e.turnNo === this.turnNo && (target === undefined || e.target === target)); }
    blockMax(p) { let m = 3; for (const e of this.activeEffects('blockMax', p)) m = Math.min(m, e.max); return m; }

    // ───────── 演出 ─────────
    async anim(ev) {
      if (!this.animator || this.aborted) return;
      try { await this.animator(this, ev); } catch (e) { if (!this.aborted) console.error(e); }
      if (this.aborted) throw new AbortSignal();
    }

    // ───────── 判断要求 ─────────
    async ask(player, req) {
      if (this.aborted) throw new AbortSignal();
      if (++this.decisions > this.maxDecisions) throw new Error('decision limit exceeded');
      this.request = { ...req, player };
      this.emit();
      const ans = await this.agents[player].decide(this, this.request);
      if (this.aborted) throw new AbortSignal();
      this.request = null;
      return ans;
    }

    // ───────── ゲーム全体 ─────────
    async run() {
      try {
        await this.setup();
        let server = this.firstServer;
        let start = this.presetStart;
        for (;;) {
          this.setNo++;
          this.say(`━━ 세트 ${this.setNo} 시작 · 서브권: ${this.pname(server)} ━━`, null, 'set');
          await this.anim({ type: 'setStart', server, setNo: this.setNo });
          const loser = await this.playSet(server, start); start = null;
          const winner = this.other(loser);
          // 敗北条件: セットカード0枚の状態でロストを宣言する (0-1-3-1-1)
          if (this.players[loser].setArea.length === 0) {
            this.winner = winner;
            this.history.push({ set: this.setNo, winner });
            this.phase = 'gameover';
            this.say(`${this.pname(loser)}의 세트 카드가 0장인 상태에서 로스트 → ${this.pname(winner)} 승리!`, winner, 'win');
            await this.anim({ type: 'gameover', winner });
            break;
          }
          this.history.push({ set: this.setNo, winner });
          await this.interval(loser);
          server = winner;
        }
      } catch (e) {
        if (e instanceof AbortSignal) return;
        throw e;
      }
      this.request = null; this.emit();
    }

    async setup() {
      this.phase = 'setup';
      if (this.preset) {                           // 튜토리얼 등: 패·덱·코트를 직접 배치
        const st = this.preset(this) || {};
        this.firstServer = st.server ?? 0;
        if (st.start) this.presetStart = st.start;  // { p, offense }
        this.emit(); return;
      }
      // サーブ権の決定 (4-2-1-2 の無作為な決定を、コイントスの結果がそのままサーブ権になる形で行う)
      this.firstServer = this.rng() < 0.5 ? 0 : 1;
      await this.anim({ type: 'coin', winner: this.firstServer });
      this.say(`코인 토스 → ${this.pname(this.firstServer)}이(가) 첫 서브권을 가집니다.`);
      for (const pl of this.players) { this.shuffle(pl.deck); }
      for (const p of [0, 1]) this.draw(p, 6, '첫 패');
      // 引き直し (サーブ権を持つプレイヤーから順に一度だけ)
      for (const p of [this.firstServer, this.other(this.firstServer)]) {
        const pl = this.players[p];
        const ret = await this.ask(p, { type: 'mulligan', title: '패 다시 뽑기', text: '덱으로 되돌릴 카드를 고르세요. (0장이면 그대로 진행)', options: pl.hand.map(c => c.uid), min: 0, max: pl.hand.length });
        const uids = Array.isArray(ret) ? ret : [];
        if (uids.length) {
          for (const u of uids) { const c = pl.hand.find(x => x.uid === u); if (c) { pl.hand.splice(pl.hand.indexOf(c), 1); pl.deck.push(c); } }
          this.shuffle(pl.deck);
          this.say(`${this.pname(p)}: ${uids.length}장을 덱으로 되돌리고 셔플했습니다.`, p);
          this.draw(p, 6 - pl.hand.length, '다시 뽑기');
        } else this.say(`${this.pname(p)}: 다시 뽑지 않습니다.`, p);
      }
      // セットカード
      for (const pl of this.players) for (let i = 0; i < 2 && pl.deck.length; i++) pl.setArea.push(pl.deck.pop());
      this.say('양쪽 모두 덱 위 2장을 세트 에리어에 뒷면으로 놓았습니다.');
    }

    async playSet(server, start = null) {
      this.offense = null; this.defense = null; this.pending = [];
      let p = server; let first = true;
      if (start) { p = start.p; first = false; this.offense = start.offense ? { ...start.offense } : null; await this.anim({ type: 'resume', offense: this.offense }); }
      for (;;) {
        try {
          if (first) await this.serveTurn(p); else await this.normalTurn(p);
        } catch (e) {
          if (e instanceof LostSignal) { await this.lostSetStep(e.player, e.reason); return e.player; }
          throw e;
        }
        first = false; p = this.other(p);
      }
    }

    beginTurn(p, kind) {
      this.turnNo++; this.turnPlayer = p; this.turnKind = kind; this.turnFlags = { blockAppear: 0 };
      this.effects = this.effects.filter(e => e.setNo === this.setNo && e.turnNo >= this.turnNo);
      this.say(`▶ ${this.pname(p)}의 턴`, p, 'turn');
    }
    setPhase(ph) { this.phase = ph; this.say(`[${PHASE_KO[ph]}]`, this.turnPlayer, 'phase'); }

    lost(p, reason) { throw new LostSignal(p, reason); }

    // 0-1-3-2: 投了はいつでも宣言でき、ただちに敗北する
    concede(p) {
      if (this.winner != null) return;
      this.winner = this.other(p); this.phase = 'gameover'; this.request = null;
      this.history.push({ set: this.setNo, winner: this.winner, concede: true });
      this.say(`${this.pname(p)} 기권 → ${this.pname(this.winner)} 승리!`, this.winner, 'win');
      this.aborted = true;
    }

    async lostSetStep(p, reason) {
      this.say(`${this.pname(p)} 로스트 — ${reason}`, p, 'lost');
      await this.anim({ type: 'lost', p, reason });
      this.offense = null; this.defense = null; this.pending = [];
      for (const s of [...this.players[p].sides]) this.toDrop(s);   // サイドブロッカーはドロップ
      this.request = null;
    }

    async interval(loser) {
      this.phase = 'interval';
      this.say('[인터벌]', null, 'phase');
      for (const p of [0, 1]) { const need = 6 - this.players[p].hand.length; if (need > 0) this.draw(p, need, '인터벌'); }
      const pl = this.players[loser];
      if (pl.setArea.length) { pl.hand.push(pl.setArea.pop()); this.say(`${this.pname(loser)}: 세트 카드 1장을 패에 넣었습니다. (남은 세트 카드 ${pl.setArea.length}장)`, loser); }
      // 継続効果・修正の終了
      this.effects = [];
      for (const p of [0, 1]) for (const { card } of this.chars(p)) card.mods = [];
      this.emit();
      await this.anim({ type: 'interval', loser });
    }

    // ───────── ターン ─────────
    async serveTurn(p) {
      this.beginTurn(p, 'serve');
      this.setPhase('serve');
      await this.checkProcess();
      await this.deployStep(p, 'serve');
      await this.freeStep(p, 'serve');
      const sc = this.top(p, 'serve');
      await this.setOffense(p, this.param(sc, 'serve'), 'serve');
      await this.endPhase(p);
    }

    async normalTurn(p) {
      this.beginTurn(p, 'normal');
      this.setPhase('start');
      await this.checkProcess();
      const opp = this.other(p);
      const canBlock = !!(this.offense && this.offense.owner === opp && this.offense.type === 'attack');
      if (!canBlock) this.say(`직전 상대가 어택하지 않았으므로(${this.offense ? (this.offense.type === 'serve' ? '서브' : '블록') : '-'}) 리시브만 선택할 수 있습니다.`, p);
      for (;;) {
        let choice = 'receive';
        if (canBlock) {
          choice = await this.ask(p, { type: 'start', title: '블록 / 리시브 선택', text: `상대 어택의 오펜스 포인트 ${this.offense.value}. 블록할지 리시브할지 고르세요.`, canBlock });
          if (choice !== 'block') choice = 'receive';
        }
        this.say(`${this.pname(p)}: ${choice === 'block' ? '블록' : '리시브'} 선택`, p);
        this.turnKind = choice;
        await this.anim({ type: choice === 'block' ? 'toBlock' : 'toReceive', p, from: this.offense ? this.offense.type : null });
        if (choice === 'block') {
          // 블록 캐릭터를 내기 전에는 취소하고 블록/리시브 선택으로 돌아갈 수 있다 (아직 아무 카드도 움직이지 않았으므로)
          if (await this.blockPhase(p) === 'cancel') { this.say(`${this.pname(p)}: 블록 취소 — 다시 고릅니다`, p); this.turnKind = 'normal'; this.setPhase('start'); continue; }
        } else { await this.drawPhase(p); await this.receivePhase(p); await this.tossPhase(p); await this.attackPhase(p); }
        break;
      }
      await this.endPhase(p);
    }

    async drawPhase(p) {
      this.setPhase('draw');
      await this.checkProcess();
      this.draw(p, 1, '리시브 드로우');
      await this.checkProcess();
      await this.freeStep(p, 'draw');
    }

    async receivePhase(p) {
      this.setPhase('receive');
      await this.checkProcess();
      await this.deployStep(p, 'receive');
      await this.freeStep(p, 'receive');
      const rc = this.top(p, 'receive');
      this.defense = this.param(rc, 'receive');
      this.say(`디펜스 포인트 산출: ${this.defense} (리시브)`, p, 'calc');
      await this.judge(p, 'receive');
    }

    async tossPhase(p) {
      this.setPhase('toss');
      await this.checkProcess();
      const rc = this.top(p, 'receive'); const rname = rc ? this.cname(rc) : null;
      await this.deployStep(p, 'toss', c => this.cname(c) !== rname, rc ? `리시브 캐릭터와 같은 이름(${this.dname(rc)})은 불가` : '');
      await this.anim({ type: 'toss', p });
      await this.freeStep(p, 'toss');
    }

    async attackPhase(p) {
      this.setPhase('attack');
      await this.checkProcess();
      const tc = this.top(p, 'toss'); const tname = tc ? this.cname(tc) : null;
      await this.deployStep(p, 'attack', c => this.cname(c) !== tname, tc ? `토스 캐릭터와 같은 이름(${this.dname(tc)})은 불가` : '');
      await this.anim({ type: 'set', p });
      await this.freeStep(p, 'attack');
      const t = this.param(this.top(p, 'toss'), 'toss'), a = this.param(this.top(p, 'attack'), 'attack');
      await this.setOffense(p, t + a, 'attack', `토스 ${t} + 어택 ${a}`);
    }

    async blockPhase(p) {
      this.setPhase('block');
      await this.checkProcess();
      // 登場ステップ
      const pl = this.players[p];
      const max = this.blockMax(p);
      const candidates = pl.hand.filter(c => this.isChar(c) && this.base(c, 'block') !== null);
      const ans = await this.ask(p, { type: 'blockDeploy', title: '블록 캐릭터 등장', text: `블록 캐릭터를 1~${max}장 고르세요 (같은 이름 불가). 첫 번째로 고른 카드가 센터 블로커가 됩니다. 상대 OP ${this.offense.value}`,
        options: candidates.map(c => c.uid), max, cancelable: true });
      if (ans && ans.cancel) return 'cancel';
      const picked = (ans && ans.uids ? ans.uids : []).map(u => pl.hand.find(c => c.uid === u)).filter(Boolean);
      const names = new Set(picked.map(c => this.cname(c)));
      if (!picked.length || picked.length > max || names.size !== picked.length) this.lost(p, '블록 캐릭터를 등장시키지 않음');
      const centerUid = ans.center && picked.some(c => c.uid === ans.center) ? ans.center : picked[0].uid;
      const appeared = [];
      for (const c of picked) {
        pl.hand.splice(pl.hand.indexOf(c), 1);
        if (c.uid === centerUid) this.placeOnTop(p, 'block', c); else pl.sides.push(c);
        appeared.push(c);
      }
      this.turnFlags.blockAppear += appeared.length;
      this.say(`${this.pname(p)}: 블록 등장 — 센터 ${this.dname(appeared.find(c => c.uid === centerUid))}${appeared.length > 1 ? ' / 사이드 ' + appeared.filter(c => c.uid !== centerUid).map(c => this.dname(c)).join(', ') : ''}`, p, 'deploy');
      for (const c of appeared) this.onAppear(p, c, 'block');
      await this.checkProcess();
      await this.freeStep(p, 'block');
      // ディフェンスポイント算出
      const bc = this.blockChars(p);
      this.defense = bc.reduce((s, c) => s + (this.param(c, 'block') ?? 0), 0);
      this.say(`디펜스 포인트 산출: ${this.defense} (블록 ${bc.map(c => this.dname(c) + ' ' + this.param(c, 'block')).join(' + ')})`, p, 'calc');
      const ok = await this.judge(p, 'block');
      // ドシャット (ブロック成功時)
      if (ok && this.turnFlags.doshutArmed) {
        this.turnFlags.doshut = this.turnFlags.doshutArmed;
        this.say(`블록 성공! 【도샷(${this.turnFlags.doshut})】 — 이 턴 종료 시 오펜스 포인트가 ${this.turnFlags.doshut}가 됩니다.`, p, 'skill');
      }
      // オフェンスポイント算出 (ブロックは 0 基準)
      await this.setOffense(p, 0, 'block');
      // フェイズ終了: サイドブロッカーはドロップ
      for (const s of [...pl.sides]) { this.toDrop(s); this.say(`사이드 블로커 ${this.dname(s)} → 드롭`, p); }
      await this.checkProcess();
    }

    async judge(p, kind) {
      const op = this.offense ? this.offense.value : 0;
      const ok = this.defense >= op;
      this.say(`저지: 디펜스 ${this.defense} vs 오펜스 ${op} → ${kind === 'block' ? '블록' : '리시브'} ${ok ? '성공' : '실패'}`, p, ok ? 'ok' : 'fail');
      await this.anim({ type: 'judge', p, kind, ok, dp: this.defense, op, doshut: ok && kind === 'block' ? (this.turnFlags.doshutArmed || 0) : 0 });
      await this.checkProcess();
      this.offense = null; this.defense = null; this.emit();
      if (!ok) this.lost(p, `${kind === 'block' ? '블록' : '리시브'} 실패`);
      return ok;
    }

    async setOffense(p, v, type, detail = '') {
      this.offense = { owner: p, value: v, type };
      this.say(`오펜스 포인트 산출: ${v} (${type === 'serve' ? '서브' : type === 'block' ? '블록' : '어택'}${detail ? ' · ' + detail : ''})`, p, 'calc');
      await this.anim({ type: 'offense', p, kind: type, value: v });
    }

    async endPhase(p) {
      this.setPhase('end');
      if (this.turnFlags.doshut != null && this.offense && this.offense.owner === p) {
        this.offense.value = this.turnFlags.doshut;
        this.say(`【도샷】 해결: ${this.pname(p)}의 블록 오펜스 포인트가 ${this.turnFlags.doshut}가 되었습니다.`, p, 'skill');
        await this.anim({ type: 'doshut', p, value: this.turnFlags.doshut });
      }
      await this.checkProcess();
      // クリンナップ: 数値修正の終了
      for (const q of [0, 1]) for (const { card } of this.chars(q)) card.mods = [];
      this.effects = this.effects.filter(e => !(e.setNo === this.setNo && e.turnNo === this.turnNo));
      this.emit();
    }

    // ───────── 登場 ─────────
    placeOnTop(p, area, card) {
      const stack = this.players[p].areas[area];
      const prev = stack[stack.length - 1];
      if (prev) prev.mods = [];          // キャラ→ガッツ: 継続効果は引き継がれない
      stack.push(card);
    }

    async deployStep(p, area, filter = () => true, note = '') {
      const pl = this.players[p];
      const candidates = pl.hand.filter(c => this.isChar(c) && this.base(c, area) !== null && filter(c));
      const opTxt = this.offense && this.offense.owner !== p ? ` · 상대 OP ${this.offense.value}` : '';
      const uid = await this.ask(p, { type: 'deploy', area, title: `${AREA_KO[area]} 캐릭터 등장`, text: `${AREA_KO[area]} 에리어에 등장시킬 캐릭터를 고르세요${opTxt}${note ? ' (' + note + ')' : ''}. 등장시키지 않으면 로스트합니다.`,
        options: candidates.map(c => c.uid) });
      const card = candidates.find(c => c.uid === uid);
      if (!card) this.lost(p, `${AREA_KO[area]} 캐릭터를 등장시키지 않음`);
      pl.hand.splice(pl.hand.indexOf(card), 1);
      this.placeOnTop(p, area, card);
      this.say(`${this.pname(p)}: ${AREA_KO[area]} 에리어에 ${this.dname(card)} 등장 (${PARAM_KO[area]} ${this.param(card, area)})`, p, 'deploy');
      this.onAppear(p, card, area);
      await this.checkProcess();
    }

    onAppear(p, card, area) {
      const d = this.c(card);
      // 自身の [登場][エリア] スキル
      if (d.trigger && d.trigger.kind === 'appear' && d.trigger.area === area) this.pending.push({ master: p, kind: 'appear', card, area });
      // 「自分のブロックキャラが登場した時」(灰羽 リエーフ)
      if (area === 'block') {
        const at = this.top(p, 'attack');
        if (at && this.c(at).trigger?.kind === 'ownBlockAppear') this.pending.push({ master: p, kind: 'lev', card: at });
      }
      // 孤爪 研磨の遅発効果: 相手のアタックキャラが登場するたび －2
      if (area === 'attack') for (const e of this.activeEffects('kenmaDebuff', p)) this.pending.push({ master: e.owner, kind: 'kenma', card, from: e.src });
    }

    // ───────── チェックプロセス ─────────
    // 5-4: ターンプレイヤー → 非ターンプレイヤーの順。同じプレイヤーの待機状態が複数ある場合、解決する 1 つはそのプレイヤーが任意に選ぶ (Q&A 1439)
    async checkProcess() {
      for (;;) {
        const tp = this.turnPlayer;
        const who = this.pending.some(x => x.master === tp) ? tp : this.pending.length ? this.other(tp) : null;
        if (who === null) return;
        const mine = this.pending.filter(x => x.master === who);
        let item = mine[0];
        const kinds = new Set(mine.map(x => x.kind + ':' + x.card.uid));
        if (kinds.size > 1) {
          const seen = new Set(); const opts = [];
          mine.forEach((x, i) => { const k = x.kind + ':' + x.card.uid; if (!seen.has(k)) { seen.add(k); opts.push({ id: String(i), label: this.pendingLabel(x) }); } });
          const [id] = await this.chooseCards(who, { title: '스킬 해결 순서', text: '대기 중인 스킬이 여러 개입니다. 먼저 해결할 스킬을 고르세요.', options: opts, min: 1, max: 1, purpose: 'pendingOrder', textOptions: true });
          item = mine[+id] || mine[0];
        }
        this.pending.splice(this.pending.indexOf(item), 1);
        await this.resolvePending(item);
      }
    }
    pendingLabel(x) {
      if (x.kind === 'appear') return `${this.dname(x.card)} — 【등장】 스킬`;
      if (x.kind === 'lev') return `${this.dname(x.card)} — 블록 캐릭터 등장 시 스킬`;
      if (x.kind === 'kenma') return `코즈메 켄마의 효과 — ${this.dname(x.card)} 어택 포인트 −2`;
      return this.dname(x.card);
    }

    async resolvePending(item) {
      const { master: p, card } = item;
      if (item.kind === 'appear') {
        const loc = this.charArea(card);
        const okLoc = item.area === 'block' ? (loc === 'block' || loc === 'side') : loc === item.area;
        if (!okLoc) { this.say(`${this.dname(card)}의 스킬: 이미 해당 에리어의 캐릭터가 아니므로 해결되지 않습니다.`, p); return; }
        await SKILLS[this.c(card).skill](this, p, card, item);
      } else if (item.kind === 'lev') {
        await SKILLS.lev(this, p, card, item);
      } else if (item.kind === 'kenma') {
        if (this.charArea(card) !== 'attack') return;
        await this.anim({ type: 'skill', p, uid: item.from || null, text: `상대 어택 캐릭터 ${this.dname(card)} 어택 포인트 −2`, label: '코즈메 켄마의 효과' });
        this.say(`코즈메 켄마의 효과 (${this.pname(p)}): 상대 어택 캐릭터의 어택 포인트 −2`, p, 'skill');
        this.addMod(card, 'attack', -2, 'kenma');
      }
    }

    // ───────── フリーステップ ─────────
    playableEvents(p, phase) { return this.players[p].hand.filter(c => this.c(c).type === 'E' && (this.c(c).timing || []).includes(phase)); }

    async freeStep(p, phase) {
      for (;;) {
        await this.checkProcess();
        const playable = this.playableEvents(p, phase);
        const ans = await this.ask(p, { type: 'free', phase, title: `${PHASE_KO[phase]} · 프리 스텝`, text: playable.length ? '이벤트 카드를 플레이하거나 다음으로 진행하세요.' : '다음으로 진행하거나 로스트를 선언할 수 있습니다.', options: playable.map(c => c.uid) });
        if (ans && ans.action === 'play') {
          const card = playable.find(c => c.uid === ans.uid);
          if (!card) continue;
          await this.playEvent(p, card);
          continue;
        }
        if (ans && ans.action === 'lost') this.lost(p, '로스트 선언');
        return;
      }
    }

    async playEvent(p, card) {
      const pl = this.players[p];
      pl.hand.splice(pl.hand.indexOf(card), 1);
      pl.event.push(card);
      this.say(`${this.pname(p)}: 이벤트 「${this.dname(card)}」 플레이`, p, 'event');
      await this.anim({ type: 'skill', p, uid: card.uid, event: true });
      await SKILLS[this.c(card).skill](this, p, card, {});
    }

    // ───────── スキル補助 ─────────
    // ガッツ払いの対象エリア: サイドブロッカーはブロックエリア(センター下)のガッツを払う (よくある質問 Q11)
    gutsArea(card) { const a = this.charArea(card); return a === 'side' ? 'block' : a; }
    gutsCount(card) { const a = this.gutsArea(card); return a ? this.guts(card.owner, a).length : 0; }
    payGuts(card, n) {
      const p = card.owner, a = this.gutsArea(card), stack = this.players[p].areas[a];
      const paid = [];
      for (let i = 0; i < n; i++) {
        const idx = stack.length - 2; if (idx < 0) break;
        const g = stack.splice(idx, 1)[0]; g.mods = []; this.players[p].drop.push(g); paid.push(g);
      }
      this.say(`${this.pname(p)}: ${AREA_KO[a]} 에리어에서 ${paid.length}가츠 지불 (${paid.map(x => this.dname(x)).join(', ')})`, p, 'cost');
      return paid;
    }
    async chooseCards(p, req) { const r = await this.ask(p, { type: 'choose', ...req }); return Array.isArray(r) ? r : (r == null ? [] : [r]); }
    async discardFromHand(p, purpose) {
      const pl = this.players[p];
      const [u] = await this.chooseCards(p, { title: '드롭할 카드 선택', text: '패에서 드롭할 카드 1장을 고르세요.', options: pl.hand.map(c => c.uid), min: 1, max: 1, purpose });
      const card = pl.hand.find(c => c.uid === u) || pl.hand[0];
      this.toDrop(card);
      this.say(`${this.pname(p)}: 패에서 ${this.dname(card)}을(를) 드롭`, p, 'cost');
    }
    async chooseChar(p, filter, title, purpose) {
      const cands = this.chars(p).map(x => x.card).filter(filter);
      if (!cands.length) { this.say(`대상이 될 캐릭터가 없습니다.`, p); return null; }
      const [u] = await this.chooseCards(p, { title, text: '대상 캐릭터를 고르세요.', options: cands.map(c => c.uid), min: 1, max: 1, purpose, zone: 'court' });
      return cands.find(c => c.uid === u) || cands[0];
    }
    // 「Nガッツ払えば使える」型の任意スキル
    async optionalGuts(p, card, n, label, effect) {
      const have = this.gutsCount(card);
      if (have < n) { this.say(`${this.dname(card)}의 스킬: 가츠 ${have}/${n} — 지불할 수 없어 사용하지 않습니다.`, p); return false; }
      const yes = await this.ask(p, { type: 'yesno', title: `${this.dname(card)}의 스킬`, text: `${n}가츠를 지불하고 「${label}」을(를) 사용할까요? (가츠 ${have}장)`, card: card.uid, skill: this.c(card).skill });
      if (!yes) { this.say(`${this.dname(card)}의 스킬을 사용하지 않았습니다.`, p); return false; }
      this.payGuts(card, n);
      await this.anim({ type: 'skill', p, uid: card.uid, text: label });
      await effect();
      return true;
    }
  }

  // ───────── カード別スキル ─────────
  const SKILLS = {
    async hinataD01(g, p, card) {
      await g.optionalGuts(p, card, 2, '어택 포인트 +2', async () => g.addMod(card, 'attack', 2, card.uid));
    },
    async kageyamaD01(g, p, card) {
      await g.optionalGuts(p, card, 2, '토스 포인트 +2', async () => g.addMod(card, 'toss', 2, card.uid));
    },
    async tsukishimaD01(g, p, card) {
      const op = g.offense && g.offense.owner !== p ? g.offense.value : null;
      if (op === null || op > 4) { g.say(`츠키시마 케이의 스킬: 상대 오펜스 포인트가 4 이하가 아니라(${op ?? '-'}) 사용할 수 없습니다.`, p); return; }
      await g.optionalGuts(p, card, 1, '카드 1장 뽑기', async () => g.draw(p, 1, '츠키시마 케이'));
    },
    async nishinoyaD01(g, p, card) {
      await g.optionalGuts(p, card, 3, '카드 1장 뽑기 + 리시브 포인트 +2', async () => { g.draw(p, 1, '니시노야 유'); g.addMod(card, 'receive', 2, card.uid); });
    },
    async ennoshitaD01(g, p, card) { await discardSkill(g, p, card, 3); },
    async yakuD02(g, p, card) { await discardSkill(g, p, card, 2); },
    async kenmaD02(g, p, card) {
      await g.optionalGuts(p, card, 2, '토스 포인트 +1, 다음 상대 턴 상대 어택 캐릭터 −2', async () => {
        g.addMod(card, 'toss', 1, card.uid);
        g.addEffect({ kind: 'kenmaDebuff', owner: p, target: g.other(p), turnNo: g.turnNo + 1, src: card.uid });
        g.say('다음 상대 턴 동안 상대의 어택 캐릭터가 등장할 때마다 어택 포인트 −2.', p, 'skill');
      });
    },
    async kurooD02(g, p, card) {
      await g.optionalGuts(p, card, 1, '블록 성공 시 도샷(5)', async () => {
        g.turnFlags.doshutArmed = 5;
        g.say('이번 턴 블록에 성공하면 【도샷(5)】합니다.', p, 'skill');
      });
    },
    async shibayamaD02(g, p, card) {
      await g.optionalGuts(p, card, 2, '카드 1장 뽑기', async () => g.draw(p, 1, '시바야마 유키'));
    },
    async lev(g, p, card) {
      if (g.charArea(card) !== 'attack') { g.say('하이바 레프의 스킬: 이미 어택 캐릭터가 아니므로 해결되지 않습니다.', p); return; }
      const bc = g.blockChars(p);
      const blocked = bc.some(c => g.cname(c) === '灰羽 リエーフ') ? '이미 블록 캐릭터 「하이바 레프」가 있음'
        : bc.length >= 3 ? '블록 캐릭터가 이미 3명' : g.turnFlags.blockAppear >= g.blockMax(p) ? `이번 턴 블록 캐릭터는 ${g.blockMax(p)}명까지만 등장 가능` : '';
      const have = g.gutsCount(card);
      if (have < 2) {
        if (!g.turnFlags.levNotice) g.say(`하이바 레프의 스킬: 어택 에리어 가츠 ${have}/2 — 사용할 수 없습니다.`, p);
        g.turnFlags.levNotice = true; return;
      }
      const yes = await g.ask(p, { type: 'yesno', title: '하이바 레프의 스킬', text: `어택 에리어에서 2가츠를 지불하고 이 캐릭터를 사이드 블로커로 등장시킬까요?${blocked ? ` ⚠ ${blocked} → 가츠만 지불되고 이동하지 않습니다.` : ''}`, card: card.uid, skill: 'lev', allowed: !blocked });
      if (!yes) { g.say('하이바 레프의 스킬을 사용하지 않았습니다.', p); return; }
      g.payGuts(card, 2);
      await g.anim({ type: 'skill', p, uid: card.uid, text: blocked ? '사이드 블로커로 등장 (등장 불가 — 가츠만 지불)' : '사이드 블로커로 등장' });
      if (blocked) { g.say(`하이바 레프는 블록 에리어에 등장할 수 없습니다 (${blocked}).`, p); return; }
      const stack = g.players[p].areas.attack; stack.splice(stack.indexOf(card), 1);
      g.players[p].sides.push(card);
      g.turnFlags.blockAppear++;
      g.say(`하이바 레프가 사이드 블로커로 등장 (블록 ${g.param(card, 'block')})`, p, 'deploy');
      g.onAppear(p, card, 'block');
    },
    // イベント
    async evtUeWoMuku(g, p) {
      g.draw(p, 1, '이벤트');
      const t = await g.chooseChar(p, c => g.base(c, 'receive') !== null, '리시브 포인트 +1 대상', 'receiveBuff');
      if (!t) return;
      g.addMod(t, 'receive', 1, 'evt');
      if (g.param(t, 'receive') <= 4) { g.say('리시브 포인트가 4 이하이므로 추가로 +1', p); g.addMod(t, 'receive', 1, 'evt'); }
    },
    async evtBroad(g, p) {
      g.draw(p, 1, '이벤트');
      const t = await g.chooseChar(p, c => g.c(c).aff.includes('烏野') && g.base(c, 'attack') !== null, '어택 포인트 +1 대상 (카라스노)', 'attackBuff');
      if (t) g.addMod(t, 'attack', 1, 'evt');
      const tc = g.top(p, 'toss'), ac = g.top(p, 'attack');
      if (tc && ac && g.cname(tc) === '影山 飛雄' && g.cname(ac) === '日向 翔陽') {
        g.addEffect({ kind: 'blockMax', owner: p, target: g.other(p), max: 1, turnNo: g.turnNo + 1 });
        g.say('카게야마→히나타 브로드 공격! 다음 상대 턴 동안 상대는 블록 캐릭터를 1명까지만 등장시킬 수 있습니다.', p, 'skill');
      }
    },
    async evtNobukatsu(g, p) {
      g.draw(p, 1, '이벤트');
      const kuroo = g.blockChars(p).filter(c => g.cname(c) === '黒尾 鉄朗');
      const opts = [];
      if (kuroo.length) opts.push({ id: 'kuroo', label: '블록 캐릭터 「쿠로오 테츠로」 블록 포인트 +1' });
      if (g.chars(p).some(x => g.base(x.card, 'receive') !== null)) opts.push({ id: 'recv', label: '자신의 캐릭터 1명 리시브 포인트 +1' });
      if (!opts.length) return;
      const [pick] = await g.chooseCards(p, { title: '효과 선택', text: '다음 중 하나를 골라 사용할 수 있습니다.', options: opts, min: 0, max: 1, purpose: 'nobukatsu', textOptions: true });
      if (pick === 'kuroo') {
        let t = kuroo[0];
        if (kuroo.length > 1) t = await g.chooseChar(p, c => kuroo.includes(c), '블록 포인트 +1 대상', 'blockBuff');
        g.addMod(t, 'block', 1, 'evt');
      } else if (pick === 'recv') {
        const t = await g.chooseChar(p, c => g.base(c, 'receive') !== null, '리시브 포인트 +1 대상', 'receiveBuff');
        if (t) g.addMod(t, 'receive', 1, 'evt');
      } else g.say('효과를 사용하지 않았습니다.', p);
    },
    async evtButsuri(g, p) {
      g.draw(p, 1, '이벤트');
      const pl = g.players[p];
      const look = pl.deck.slice(-3).reverse();          // 上から順
      if (!look.length) return;
      const targets = look.filter(c => ['灰羽 リエーフ', '犬岡 走'].includes(g.cname(c)));
      g.say(`${g.pname(p)}: 덱 위 ${look.length}장을 확인합니다.`, p);
      const [u] = await g.chooseCards(p, { title: '덱 위 카드 확인', text: `덱 위 ${look.length}장입니다. 「하이바 레프」 또는 「이누오카 소」 1장까지 공개해 패에 넣을 수 있습니다.`, options: targets.map(c => c.uid), reveal: look.map(c => c.uid), min: 0, max: 1, purpose: 'butsuri', zone: 'look' });
      const picked = targets.find(c => c.uid === u);
      if (picked) { pl.deck.splice(pl.deck.indexOf(picked), 1); pl.hand.push(picked); g.say(`${g.pname(p)}: 「${g.dname(picked)}」을(를) 공개하고 패에 넣었습니다.`, p, 'draw'); }
      const rest = look.filter(c => c !== picked);
      let order = rest;
      if (rest.length > 1) {
        const r = await g.ask(p, { type: 'order', title: '덱 아래로 보낼 순서', text: '덱 아래에 둘 순서대로 카드를 누르세요. 먼저 고른 카드부터 덱 아래에 놓입니다(나중에 놓은 카드가 가장 아래).', options: rest.map(c => c.uid), zone: 'look' });
        if (Array.isArray(r) && r.length === rest.length) order = r.map(x => rest.find(c => c.uid === x)).filter(Boolean);
      }
      for (const c of order) pl.deck.splice(pl.deck.indexOf(c), 1);
      for (const c of order) pl.deck.unshift(c);   // 1枚ずつデッキの下へ: 先に置いたカードほど上側 (deck[0] が一番下)
      g.say(`${g.pname(p)}: 나머지 ${rest.length}장을 덱 아래에 놓았습니다.`, p);
    },
  };

  async function discardSkill(g, p, card, bonus) {
    const pl = g.players[p];
    if (!pl.hand.length) { g.say(`${g.dname(card)}의 스킬: 패가 없어 사용할 수 없습니다.`, p); return; }
    const yes = await g.ask(p, { type: 'yesno', title: `${g.dname(card)}의 스킬`, text: `패에서 카드 1장을 드롭하고 리시브 포인트 +${bonus}를 사용할까요?`, card: card.uid, skill: g.c(card).skill, bonus });
    if (!yes) { g.say(`${g.dname(card)}의 스킬을 사용하지 않았습니다.`, p); return; }
    await g.discardFromHand(p, 'cost');
    await g.anim({ type: 'skill', p, uid: card.uid, text: `리시브 포인트 +${bonus}` });
    g.addMod(card, 'receive', bonus, card.uid);
  }

  G.VobacaEngine = { Game, LostSignal, AbortSignal, PARAMS, AREAS, AREA_KO, PARAM_KO, PHASE_KO, TIMING_KO, SKILLS };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
// CPU プレイヤー（ヒューリスティック）
(function (G) {
  'use strict';

  function hand(g, p) { return g.players[p].hand; }
  function chars(g, list) { return list.filter(c => g.isChar(c)); }
  function opVal(g, p) { return g.offense && g.offense.owner !== p ? g.offense.value : 0; }
  function cardValue(g, c) {
    const d = g.c(c);
    if (d.type === 'E') return 3.5;
    const pr = d.params;
    return Math.max(pr.receive ?? 0, (pr.attack ?? 0) + 0.5, pr.block ?? 0, (pr.serve ?? 0) - 1, (pr.toss ?? 0) + 1.5);
  }
  // 登場後に期待できるパラメータ（自身のスキル込み）
  function potential(g, p, c, area, handAfter) {
    const v = g.base(c, area); if (v === null) return null;
    const stackLen = g.players[p].areas[area].length;  // 登場後のガッツ数
    const sk = g.c(c).skill;
    if (area === 'receive') {
      if (sk === 'nishinoyaD01' && stackLen >= 3) return v + 2;
      if (sk === 'ennoshitaD01' && handAfter >= 1) return v + 3;
      if (sk === 'yakuD02' && handAfter >= 1) return v + 2;
    }
    if (area === 'toss') {
      if (sk === 'kageyamaD01' && stackLen >= 2) return v + 2;
      if (sk === 'kenmaD02' && stackLen >= 2) return v + 1;
    }
    if (area === 'attack' && sk === 'hinataD01' && stackLen >= 2) return v + 2;
    return v;
  }
  function eventBoost(g, p, timing, exclude = []) {
    return hand(g, p).filter(c => !exclude.includes(c) && g.c(c).type === 'E' && (g.c(c).timing || []).includes(timing)).length;
  }
  function canContinueAfter(g, p, rest, recvName) {
    // 残りの手札でトス→アタックが組めるか
    const tossC = chars(g, rest).filter(c => g.base(c, 'toss') !== null && g.cname(c) !== recvName);
    for (const t of tossC) {
      if (chars(g, rest).some(a => a !== t && g.base(a, 'attack') !== null && g.cname(a) !== g.cname(t))) return true;
    }
    return false;
  }
  function receivePlan(g, p, extraDraw = 0) {
    const op = opVal(g, p);
    const h = hand(g, p);
    const cands = chars(g, h).filter(c => g.base(c, 'receive') !== null);
    let best = null;
    for (const c of cands) {
      const rest = h.filter(x => x !== c);
      const base = g.base(c, 'receive');
      const pot = potential(g, p, c, 'receive', rest.length);
      const ev = eventBoost(g, p, 'receive', [c]);
      const tier = base >= op ? 0 : pot >= op ? 1 : pot + ev >= op ? 2 : 9;
      if (tier === 9) continue;
      const cont = canContinueAfter(g, p, rest, g.cname(c)) || extraDraw > 0;
      const isLi = g.c(c).pos.includes('Li') ? 1 : 0;
      const score = tier * 100 + (cont ? 0 : 50) - isLi * 5 + cardValue(g, c);
      if (!best || score < best.score) best = { card: c, score, cont };
    }
    return best;
  }
  function blockPlan(g, p) {
    const op = opVal(g, p);
    const max = g.blockMax(p);
    const cands = chars(g, hand(g, p)).filter(c => g.base(c, 'block') !== null);
    const byName = new Map();
    for (const c of cands) { const n = g.cname(c); if (!byName.has(n) || g.base(c, 'block') > g.base(byName.get(n), 'block')) byName.set(n, c); }
    const uniq = [...byName.values()];
    let best = null;
    const rec = (start, picked) => {
      if (picked.length) {
        const sum = picked.reduce((s, c) => s + g.base(c, 'block'), 0);
        if (sum >= op) {
          const kuroo = picked.some(c => g.cname(c) === '黒尾 鉄朗') ? -0.5 : 0;
          const score = picked.length * 10 + picked.reduce((s, c) => s + cardValue(g, c), 0) * 0.5 + kuroo;
          if (!best || score < best.score) best = { cards: [...picked], score };
        }
      }
      if (picked.length >= max) return;
      for (let i = start; i < uniq.length; i++) { picked.push(uniq[i]); rec(i + 1, picked); picked.pop(); }
    };
    rec(0, []);
    return best;
  }

  const CPU = {
    decide(g, req) {
      const p = req.player;
      switch (req.type) {
        case 'serveChoice': return true;
        case 'mulligan': {
          const h = hand(g, p);
          const ev = h.filter(c => g.c(c).type === 'E');
          return ev.length > 2 ? ev.slice(2).map(c => c.uid) : [];
        }
        case 'start': {

          const rp = receivePlan(g, p, 1);

          if (!rp || bp.cards.length === 1 || (bp.cards.length === 2 && opVal(g, p) >= 7)) return 'block';

        }
        case 'blockDeploy': {
          const bp = blockPlan(g, p);
          if (!bp) return null;
          const kuroo = bp.cards.find(c => g.cname(c) === '黒尾 鉄朗');
          const center = kuroo || bp.cards.slice().sort((a, b) => g.base(b, 'block') - g.base(a, 'block'))[0];
          return { uids: bp.cards.map(c => c.uid), center: center.uid };
        }
        case 'deploy': {
          const opts = req.options.map(u => hand(g, p).find(c => c.uid === u)).filter(Boolean);
          if (!opts.length) return null;
          const h = hand(g, p);
          if (req.area === 'receive') {
            const rp = receivePlan(g, p);
            if (!rp || !rp.cont) return null;            // 返せない/続かないなら手札温存でロスト
            return rp.card.uid;
          }
          if (req.area === 'serve') {
            return opts.slice().sort((a, b) => (g.base(b, 'serve') - g.base(a, 'serve')) || (cardValue(g, a) - cardValue(g, b)))[0].uid;
          }
          if (req.area === 'toss') {
            let best = null;
            for (const c of opts) {
              const rest = h.filter(x => x !== c);
              const hasAtk = chars(g, rest).some(a => g.base(a, 'attack') !== null && g.cname(a) !== g.cname(c));
              if (!hasAtk) continue;
              const bestAtk = Math.max(...chars(g, rest).filter(a => g.base(a, 'attack') !== null && g.cname(a) !== g.cname(c)).map(a => potential(g, p, a, 'attack', 0)));
              const s = potential(g, p, c, 'toss', rest.length) + bestAtk - cardValue(g, c) * 0.01;
              if (!best || s > best.s) best = { c, s };
            }
            return (best ? best.c : opts[0]).uid;
          }
          if (req.area === 'attack') {
            return opts.slice().sort((a, b) => (potential(g, p, b, 'attack', 0) - potential(g, p, a, 'attack', 0)) || (cardValue(g, a) - cardValue(g, b)))[0].uid;
          }
          return opts[0].uid;
        }
        case 'yesno': {
          const op = opVal(g, p);
          if (req.skill === 'ennoshitaD01' || req.skill === 'yakuD02') {
            const rc = g.top(p, 'receive');
            return !!rc && g.param(rc, 'receive') < op;
          }
          if (req.skill === 'lev') {
            const dp = g.blockChars(p).reduce((s, c) => s + (g.param(c, 'block') ?? 0), 0);
            return !!req.allowed && dp < op;
          }
          return true;
        }
        case 'free': {
          const evs = req.options.map(u => hand(g, p).find(c => c.uid === u)).filter(Boolean);
          const op = opVal(g, p);
          const pick = no => evs.find(c => c.no === no);
          if (req.phase === 'draw' && pick('HV-D02-012')) return { action: 'play', uid: pick('HV-D02-012').uid };
          if (req.phase === 'receive') {
            const rc = g.top(p, 'receive');
            if (rc && g.param(rc, 'receive') < op) {
              const e = pick('HV-D01-011') || pick('HV-D02-011');
              if (e) return { action: 'play', uid: e.uid };
            }
          }
          if (req.phase === 'block') {
            const dp = g.blockChars(p).reduce((s, c) => s + (g.param(c, 'block') ?? 0), 0);
            if (dp < op && pick('HV-D02-011') && g.blockChars(p).some(c => g.cname(c) === '黒尾 鉄朗')) return { action: 'play', uid: pick('HV-D02-011').uid };
          }
          if (req.phase === 'attack' && pick('HV-D01-012')) return { action: 'play', uid: pick('HV-D01-012').uid };
          return { action: 'pass' };
        }
        case 'choose': {
          const min = req.min ?? 1, max = req.max ?? 1;
          if (req.textOptions) {
            const ids = req.options.map(o => o.id);
            if (req.purpose === 'nobukatsu') return [g.phase === 'block' && ids.includes('kuroo') ? 'kuroo' : ids.includes('recv') ? 'recv' : ids[0]];
            return ids.slice(0, Math.max(min, 1));
          }
          const cards = req.options.map(u => findCard(g, u)).filter(Boolean);
          if (!cards.length) return [];
          if (req.purpose === 'cost') return [cards.slice().sort((a, b) => cardValue(g, a) - cardValue(g, b))[0].uid];
          if (req.purpose === 'receiveBuff') { const rc = g.top(p, 'receive'); return [(cards.includes(rc) ? rc : cards[0]).uid]; }
          if (req.purpose === 'attackBuff') { const ac = g.top(p, 'attack'); return [(cards.includes(ac) ? ac : cards[0]).uid]; }
          if (req.purpose === 'butsuri') { const lev = cards.find(c => g.cname(c) === '灰羽 リエーフ'); return [(lev || cards[0]).uid]; }
          return cards.slice(0, Math.max(min, Math.min(max, 1))).map(c => c.uid);
        }
        case 'order': return req.options.slice();
        default: return null;
      }
    },
  };

  function findCard(g, uid) {
    for (const pl of g.players) {
      for (const k of ['hand', 'deck', 'drop', 'setArea', 'event', 'sides']) { const c = pl[k].find(x => x.uid === uid); if (c) return c; }
      for (const a of Object.values(pl.areas)) { const c = a.find(x => x.uid === uid); if (c) return c; }
    }
    return null;
  }

  G.VobacaAI = { CPU, findCard, receivePlan, blockPlan };
})(typeof window !== 'undefined' ? window : globalThis);

<script>

  function create(opts) {

    }
    const topCardEl = (p, area) => opts.cardsIn(p, area)[0] || null;
    const netDir = p => (opts.isTop(p) ? 1 : -1);          // 화면에서 네트 쪽 방향 (위 매트는 아래, 내 매트는 위)

    function hitPoint(p, area, tier) {

    }
    // 뛰어올라 공을 치는 동작. 타격 순간에 resolve, 착지 후 정리.
    function strike(p, area, tier) {
      const el = topCardEl(p, area);
      if (!el || !k()) return { hit: Promise.resolve(), done: Promise.resolve() };
      const cl = cardClone(el), S = SWING[tier], d = netDir(p), side = opts.isTop(p) ? -1 : 1;
      const up = d * cl.h * S.jump, total = S.crouch + S.rise + S.swing + S.land;
      const o1 = S.crouch / total, o2 = (S.crouch + S.rise) / total, o3 = (S.crouch + S.rise + S.swing) / total;
      const a = cl.c.animate([
        { transform: 'translateY(0) scale(1) rotate(0deg)', offset: 0, easing: 'ease-out' },
        { transform: `translateY(${-d * cl.h * .07}px) scale(.94, .9) rotate(${-side * 3}deg)`, offset: o1, easing: 'cubic-bezier(.2,.8,.3,1)' },
        { transform: `translateY(${up}px) scale(1.16) rotate(${-side * S.rot}deg)`, offset: o2, easing: 'cubic-bezier(.6,0,1,.6)' },
        { transform: `translateY(${up * 1.06}px) scale(1.2) rotate(${side * S.rot * .9}deg)`, offset: o3, easing: 'ease-in' },
        { transform: 'translateY(0) scale(1) rotate(0deg)', offset: 1 }], { duration: ms(total) });
      a.ready && cl.c.classList.add('air');
      const done = a.finished.catch(() => {}).then(() => cl.done());
      return { hit: sleep(ms(S.crouch + S.rise + S.swing * .55)), done, prep: ms(S.crouch + S.rise) };
    }
    // 받는 동작: 카드가 살짝 떠올라 공을 받아낸다 (여러 장이면 동시에)
    function lift(els, p, { h = .16, dur = 520, scale = 1.1 } = {}) {
      if (!k() || !els.length) return { peak: Promise.resolve(), done: Promise.resolve() };
      const d = netDir(p); const fins = [];
      for (const el of els) {
        const cl = cardClone(el);
        const a = cl.c.animate([
          { transform: 'translateY(0) scale(1)', easing: 'cubic-bezier(.2,.8,.3,1)' },
          { transform: `translateY(${d * cl.h * h}px) scale(${scale})`, offset: .42, easing: 'ease-in' },
          { transform: 'translateY(0) scale(1)' }], { duration: ms(dur) });
        fins.push(a.finished.catch(() => {}).then(() => cl.done()));
      }
      return { peak: sleep(ms(dur * .42)), done: Promise.all(fins) };
    }
    // 블록 후 도샷: 블로커들이 상대 쪽으로 내리꽂는 동작
    function slam(els, p) {
      if (!k() || !els.length) return { hit: Promise.resolve(), done: Promise.resolve() };
      const d = netDir(p); const fins = [];
      for (const [i, el] of els.entries()) {
        const cl = cardClone(el);
        const a = cl.c.animate([
          { transform: 'translateY(0) scale(1) rotate(0deg)' },
          { transform: `translateY(${d * cl.h * .22}px) scale(1.12) rotate(${(i - 1) * -4}deg)`, offset: .35, easing: 'cubic-bezier(.7,0,1,.5)' },
          { transform: `translateY(${d * cl.h * .5}px) scale(1.24) rotate(${(i - 1) * 6}deg)`, offset: .55, easing: 'ease-out' },
          { transform: 'translateY(0) scale(1) rotate(0deg)' }], { duration: ms(760) });
        fins.push(a.finished.catch(() => {}).then(() => cl.done()));
      }
      return { hit: sleep(ms(760 * .52)), done: Promise.all(fins) };
    }
    async function coinToss(g, winner) {
      if (!k()) { await showBanner(`<b>${opts.esc(g.pname(winner))}</b><span>서브권</span>`, 'set', 800); return; }
      // 멀리건 화면처럼 화면 전체를 어둡게 하고 가운데에서 코인을 던짐
      const el = document.createElement('div'); el.className = 'coinstage'; el.setAttribute('role', 'status');
      el.innerHTML = `<div class="mull-head"><b>코인 토스</b><span>나온 면의 팀이 첫 서브권을 가져요</span></div>
        <div class="vcoin"><div class="cf f0"><b>${opts.esc(opts.coinLabel(0))}</b></div><div class="cf f1"><b>${opts.esc(opts.coinLabel(1))}</b></div></div>
        <div class="vcoin-shadow"></div>
        <div class="vcoin-legend"><span><i style="background:var(--c0)"></i>${opts.esc(g.pname(0))}</span><span><i style="background:var(--c1)"></i>${opts.esc(g.pname(1))}</span></div>
        <div class="vcoin-cap">두근두근…</div>`;
      document.body.appendChild(el);
      const coin = el.querySelector('.vcoin'), sh = el.querySelector('.vcoin-shadow');
      const turns = 6 + (winner ? .5 : 0), hgt = Math.min(innerHeight * .2, 170);
      const a = coin.animate([
        { transform: 'translateY(0) rotateX(0deg) scale(1)' },
        { transform: `translateY(${-hgt}px) rotateX(${turns * 180}deg) scale(1.3)`, offset: .5 },
        { transform: `translateY(0) rotateX(${turns * 360}deg) scale(1)` }], { duration: ms(1600), easing: 'cubic-bezier(.3,.6,.4,1)', fill: 'forwards' });
      sh.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.55)', opacity: .4, offset: .5 }, { transform: 'scale(1)', opacity: 1 }], { duration: ms(1600), easing: 'cubic-bezier(.3,.6,.4,1)' });
      await a.finished.catch(() => {});
      coin.animate([{ transform: `rotateX(${turns * 360}deg) translateY(0)` }, { transform: `rotateX(${turns * 360}deg) translateY(-14px)`, offset: .4 }, { transform: `rotateX(${turns * 360}deg) translateY(0)` }], { duration: ms(320), easing: 'ease-out' });
      el.querySelector('.vcoin-cap').innerHTML = `<b>${opts.esc(g.pname(winner))}</b> 서브권!`;
      el.classList.add('done');
      await sleep(ms(1200));
      el.classList.add('out'); await sleep(260);
      el.remove();
    }

    // 스킬·이벤트 발동 기록: 화면 오른쪽 아래에 카드가 쌓임 (최신이 맨 아래 · 크게). 20초 뒤 또는 다음 턴에 사라짐
    const FEED_MAX = 4, FEED_LIFE = 20000;
    function feedBox() {
      let f = document.getElementById('skillfeed');
      if (!f) { f = document.createElement('div'); f.id = 'skillfeed'; f.className = 'skillfeed'; f.setAttribute('aria-live', 'polite'); f.setAttribute('aria-label', '스킬 · 이벤트 발동 기록'); document.body.appendChild(f); }
      return f;
    }
    function feedRemove(el) {
      if (!el || el.dataset.out) return; el.dataset.out = '1';
      el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(40px)' }], { duration: 260, easing: 'ease-in', fill: 'forwards' }).finished.catch(() => {}).then(() => el.remove());
    }
    function clearFeed(keepRecentMs = 0) {
      const f = document.getElementById('skillfeed'); if (!f) return;
      const now = Date.now();
      for (const el of [...f.children]) if (!keepRecentMs || now - +el.dataset.t > keepRecentMs) feedRemove(el);
    }
    async function skillCut(g, ev) {
      const info = opts.cardInfo(ev.uid); if (!info && !ev.text) return;
      const f = feedBox();
      const el = document.createElement('div'); el.className = 'sf-item' + (opts.isTop(ev.p) ? ' opp' : ''); el.dataset.t = String(Date.now());
      el.style.setProperty('--tc', opts.teamColor(ev.p));
      const eff = ev.text || (info && info.ko) || '';
      el.innerHTML = `${info ? `<div class="sf-card"><img src="${info.img}" alt=""></div>` : ''}
        <div class="sf-info"><span class="sf-who">${opts.esc(g.pname(ev.p))} · ${ev.event ? '이벤트' : '스킬'}</span><b>${opts.esc(ev.label || (info ? info.name : ''))}</b>
        ${eff ? `<p class="sf-eff">${opts.esc(eff)}</p>` : ''}${ev.text && info && info.ko && !ev.event ? `<p class="sf-ko">${opts.esc(info.ko)}</p>` : ''}</div>`;
      f.appendChild(el);
      const live = [...f.children].filter(x => !x.dataset.out);
      if (live.length > FEED_MAX) feedRemove(live[0]);
      el.animate([{ transform: 'translateX(110%)', opacity: 0 }, { transform: 'translateX(-4%)', opacity: 1, offset: .7 }, { transform: 'none', opacity: 1 }], { duration: 320, easing: 'cubic-bezier(.2,.9,.3,1)' });
      setTimeout(() => feedRemove(el), FEED_LIFE);
      // 필드 위의 그 카드도 반짝
      const src = ev.uid != null ? document.querySelector(`.mat .card[data-uid="${ev.uid}"]`) : null;
      if (src) src.animate([{ filter: 'brightness(1)', transform: 'scale(1)' }, { filter: 'brightness(1.8) drop-shadow(0 0 10px #fff)', transform: 'scale(1.12)', offset: .3 }, { filter: 'brightness(1)', transform: 'scale(1)' }], { duration: ms(900), easing: 'ease-out' });
      await sleep(ms(ev.event ? 1100 : 900));   // 읽을 틈만 잠깐 주고 진행 (기록은 남아 있음)
    }

    // ───── エンジンイベント → 演出 ─────
    async function play(g, ev) {
      const opp = p => 1 - p;
      switch (ev.type) {
        case 'setStart': {
          setOP(null); setVisible(false);
          await showBanner(`<b>세트 ${ev.setNo}</b><span>서브: ${opts.esc(g.pname(ev.server))}</span>`, 'set', 1000);
          return;
        }
        case 'offense': {
          const p = ev.p, o = opp(p), tier = tierOf(ev.kind, ev.value);
          if (ev.kind === 'serve') {
            // 공을 띄우고 → 카드가 뛰어올라 직접 친다
            place({ p, s: 'serve' }); setVisible(true); setOP(null);
            const tierS = Math.min(4, tier + (ev.value >= 4 ? 1 : 0));
            const hp = hitPoint(p, 'serve', tierS);
            if (hp) {
              await fly({ p, s: 'serveHit', pt: hp }, { dur: 380, arc: 0, lift: 1.25, easing: 'cubic-bezier(.2,.7,.4,1)' });
              const sk = strike(p, 'serve', tierS);
              hover(sk.prep || 1);
              await sk.hit;
            }
            impact(tier, 'serve'); setOP(ev.value, tier);
            // 서브는 블록할 수 없으므로 상대 리시브 에리어로 바로 날아간다
            await fly({ p: o, s: 'receive' }, { dur: TIER[tier].fly + 360, arc: 90, lift: 1.45, ghosts: TIER[tier].trail, easing: 'cubic-bezier(.3,.1,.5,1)' });
          } else if (ev.kind === 'attack') {
            // 토스로 띄운 공(타점)을 어택 카드가 뛰어올라 내리친다. OP가 클수록 높이·빠르게.
            setVisible(true); setOP(null);
            const hp = hitPoint(p, 'attack', tier);
            if (hp) {
              if (!st.spot || st.spot.s !== 'attackHit') place({ p, s: 'attackHit', pt: hp });
              const sk = strike(p, 'attack', tier);
              fly({ p, s: 'attackHit', pt: hp }, { dur: sk.prep || 1, arc: 4, lift: 1.12, easing: 'ease-out' });
              await sk.hit;
            } else place({ p, s: 'attack' });
            impact(tier, 'attack'); setOP(ev.value, tier);
            await fly({ p: o, s: 'net' }, { dur: TIER[tier].fly, arc: 18 - tier * 4, lift: 1.15, ghosts: TIER[tier].trail, easing: tier >= 3 ? 'cubic-bezier(.2,.6,.3,1)' : 'ease-in' });
          } else {                                         // 블록으로 튕겨낸 공도 블록 불가 → 바로 리시브 쪽으로
            setOP(ev.value, 1);
            if (!(st.spot && st.spot.p === o && st.spot.s === 'receive')) await fly({ p: o, s: 'receive' }, { dur: 640, arc: 90, lift: 1.45 });
          }
          await hover(380);                                // 어택은 블록 앞에서, 서브·블록은 리시브 앞에서 잠깐 멈춤
          spin.classList.add('bob');                       // 相手の判断待ちの間はふわふわ浮かせる
          return;
        }
        case 'resume': {                                   // 튜토리얼 등 랠리 도중부터 시작: 공을 받는 쪽 앞에 놓아 둔다
          const off = ev.offense; if (!off) return;
          place({ p: opp(off.owner), s: off.type === 'attack' ? 'net' : 'receive' }); setVisible(true);
          setOP(off.value, tierOf(off.type, off.value)); spin.classList.add('bob');
          return;
        }
        case 'toBlock': {
          spin.classList.remove('bob');
          await hover(300);
          spin.classList.add('bob');
          return;
        }
        case 'toReceive': {
          spin.classList.remove('bob');
          if (ev.from !== 'attack') return;                // 서브·블록 공은 이미 리시브 에리어에 와 있다
          await sleep(ms(120));
          await fly({ p: ev.p, s: 'receive' }, { dur: 380, arc: -10, lift: 1.05, easing: 'ease-in' });
          return;
        }
        case 'judge': {
          spin.classList.remove('bob');
          const p = ev.p, o = opp(p), d = netDir(p);
          if (ev.kind === 'block') {
            // 블로커 전원이 동시에 떠올라 공을 막는다
            const els = opts.cardsIn(p, 'block');
            const lf = lift(els, p, { h: .3, dur: 600, scale: 1.14 });
            await lf.peak;
            if (ev.ok) {
              const tier = ev.doshut ? 3 : 2;
              shake(TIER[tier].shake, 320); ring(TIER[tier].ring, '#7fe0ff'); particles(TIER[tier].parts, '#bdf1ff');
              burst('블록!', { cls: 'ok', size: 1.1 });
              setOP(null);
              await fly({ p, s: 'blockBounce', pt: { x: st.x, y: st.y + d * size() * 1.2 } }, { dur: 220, arc: 20, lift: 1.15, easing: 'ease-out' });
              await lf.done;
              if (ev.doshut) {
                // 도샷: 막아낸 뒤 블로커들이 내리꽂아 상대 코트로 공격
                const sl = slam(opts.cardsIn(p, 'block'), p);
                await sl.hit;
                const T = TIER[3];
                shake(T.shake, 400); doFlash(.35, '#cfefff'); ring(T.ring, '#7fe0ff'); particles(T.parts, '#7fe0ff');
                burst('도샷!!', { cls: 't3', size: 1.4 });
                await fly({ p: o, s: 'receive' }, { dur: 300, arc: 6, lift: 1.12, ghosts: 2, easing: 'cubic-bezier(.2,.6,.3,1)' });
                await sl.done;
              }
            } else {
              shake(TIER[3].shake, 380); doFlash(.3, '#ff9a8a');
              burst('블록 실패', { cls: 'bad', size: 1 });
              await fly({ p, s: 'floor' }, { dur: 300, arc: -6, lift: 1.0, easing: 'ease-in' });
              particles(10, '#ffffff'); setOP(null);
              await lf.done;
            }
          } else {
            // 리시브 카드가 살짝 떠올라 공을 받아낸다
            const lf = lift(opts.cardsIn(p, 'receive').slice(0, 1), p, { h: .16, dur: 520, scale: 1.1 });
            await lf.peak;
            if (ev.ok) {
              setOP(null);
              burst('리시브!', { cls: 'ok', size: .9 });
              await hop(54, 460, 1.35);
            } else {
              shake(6, 300);
              burst('리시브 실패', { cls: 'bad', size: 1 });
              setOP(null);
              await fly({ p, s: 'out' }, { dur: 480, arc: 26, lift: 1.1, easing: 'ease-out' });
            }
            await lf.done;
          }
          return;
        }
        case 'toss': {
          await fly({ p: ev.p, s: 'toss' }, { dur: 560, arc: 80, lift: 1.55 });
          return;
        }
        case 'set': {
          // 세터가 공을 밀어 올리고, 공은 어택 카드 앞 타점에 떠서 기다린다
          const lf = lift(opts.cardsIn(ev.p, 'toss').slice(0, 1), ev.p, { h: .12, dur: 420, scale: 1.08 });
          await lf.peak;
          const hp = hitPoint(ev.p, 'attack', 2);
          await fly(hp ? { p: ev.p, s: 'attackHit', pt: hp } : { p: ev.p, s: 'attack' }, { dur: 620, arc: 110, lift: 1.7, easing: 'ease-in-out' });
          spin.classList.add('bob');
          await lf.done;
          return;
        }
        case 'doshut': {                                   // 턴 종료 시 OP가 바뀌는 순간 (모션은 블록 판정 때 이미 보여 줌)
          setOP(ev.value, 3); ring(1.4, '#7fe0ff');
          burst(`OP ${ev.value}`, { cls: 't3', size: 1 });
          await sleep(ms(500));
          return;
        }
        case 'skill': {
          await skillCut(g, ev);   // 연출 끄기에서도 기록은 남김 (기다림만 0)
          return;
        }
        case 'coin': {
          setVisible(false); setOP(null);
          await coinToss(g, ev.winner);
          return;
        }
        case 'lost': {
          setOP(null);
          const w = opp(ev.p);
          await showBanner(`<b>로스트</b><span>${opts.esc(g.pname(w))} 세트 획득 · ${opts.esc(ev.reason)}</span>`, 'lost', 1300);
          setVisible(false);
          return;
        }
        case 'gameover': {
          setVisible(false);
          return;
        }
      }
    }

    return { play, place, relayout, setVisible, setOP, clearFeed, get state() { return st; } };
  }

  G.VobacaFX = { create, tierOf };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  'use strict';
  const { DB, DECKS, AFF_KO, GRADE_KO } = window.VobacaCards;
  const KN = no => DB[no].kr || DB[no].name;   // 표시용 카드 이름 (한국어)
  const { Game, AREA_KO, PARAM_KO, PHASE_KO, TIMING_KO } = window.VobacaEngine;
  const { CPU, findCard } = window.VobacaAI;
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const TEAM_COLOR = { karasuno: 'var(--karasuno)', nekoma: 'var(--nekoma)', alt: 'var(--alt)' };
  const ST = {
    game: null, mode: 'cpu', myDeck: 'karasuno', speed: 'normal',
    viewer: 0, pending: null, sel: [], detail: null, handoff: null, autoPass: true, logOpen: false,
    lostConfirm: false, prevTops: {}, lastOp: null, logLen: 0, seenSides: new Set(), dragJustEnded: false,
    teams: ['karasuno', 'nekoma'], tut: null, tutRestrict: null,
  };
  const isHuman = p => ST.mode === 'pvp' || p === 0;
  try { const pr = JSON.parse(localStorage.getItem('vobaca-prefs') || 'null'); if (pr) { if (pr.speed) ST.speed = pr.speed; if (typeof pr.autoPass === 'boolean') ST.autoPass = pr.autoPass; } } catch {}
  function savePrefs() { try { localStorage.setItem('vobaca-prefs', JSON.stringify({ speed: ST.speed, autoPass: ST.autoPass })); } catch {} }

  // ───────── 카드 이미지 미리 불러오기 ─────────
  // 카드가 처음 나올 때 이미지가 늦게 뜨지 않도록, 두 덱의 모든 이미지를 시작 시 받아서 디코딩해 둔다.
  const IMG_CACHE = [];
  const PRELOAD = { done: 0, total: 0, ready: false };
  const preloadPromise = (() => {
    const srcs = [...new Set(Object.values(DECKS).flatMap(d => d.list.map(([no, , ver]) => `img/${no}-${ver}.webp`)))];
    PRELOAD.total = srcs.length;
    return Promise.all(srcs.map(src => new Promise(res => {
      const im = new Image(); im.decoding = 'async'; IMG_CACHE.push(im);
      const fin = () => { PRELOAD.done++; updatePreload(); res(); };
      im.onload = () => { (im.decode ? im.decode() : Promise.resolve()).catch(() => {}).then(fin); };
      im.onerror = fin;
      im.src = src;
    }))).then(() => { PRELOAD.ready = true; updatePreload(); });
  })();
  function updatePreload() {
    const el = document.getElementById('preloadNote'); if (!el) return;
    el.textContent = PRELOAD.ready ? '카드 이미지 준비 완료' : `카드 이미지 불러오는 중… ${PRELOAD.done}/${PRELOAD.total}`;
    el.classList.toggle('ready', PRELOAD.ready);
  }

  // ───────── 演出 (ボール) ─────────
  function matOf(p) { return document.querySelector(`.mat[data-p="${p}"]`); }
  function centerOf(el) { if (!el) return null; const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r }; }
  const FX = window.VobacaFX.create({
    arena: $('#arena'), shakeEl: $('#arena'),
    speed: () => ST.speed, esc,
    coinLabel: p => (p === ST.viewer ? '나' : 'CPU'),
    teamColor: p => TEAM_COLOR[teamOf(p)],
    cardInfo: uid => { const g = ST.game; const c = g && uid != null && findCard(g, uid); return c ? { img: imgOf(c), name: KN(c.no), ko: DB[c.no].ko || '', event: DB[c.no].type === 'E' } : null; },
    isTop: p => p !== ST.viewer,
    cardsIn: (p, area) => [...document.querySelectorAll(`.area[data-area="${area}"][data-p="${p}"] .card`)],
    locate(p, s) {
      const top = p !== ST.viewer;
      if (['serve', 'receive', 'toss', 'attack'].includes(s)) {
        const c = centerOf(document.querySelector(`.area[data-area="${s}"][data-p="${p}"] .slot`));
        return c && { x: c.x, y: c.y - c.r.height * .12 };
      }
      const blk = centerOf(document.querySelector(`.area[data-area="block"][data-p="${p}"]`));
      if (!blk) return null;
      if (s === 'net') return { x: blk.x, y: top ? blk.r.bottom - blk.r.height * .34 : blk.r.top + blk.r.height * .34 };

  // ───────── ゲーム開始 ─────────

  // ── 넘김식 점수판: 큰 숫자 = 따낸 세트, 가운데 작은 숫자 = 남은 세트 카드 ──
  const FLIP_MS = 170;
  function flipHtml(cls) { return `<span class="flip ${cls}" data-v=""><span class="fl-t"><i></i></span><span class="fl-b"><i></i></span></span>`; }
  function setFlip(el, v, animate) {

  function renderScore() {

  const STAT_KEYS = [['serve', '서'], ['block', '블'], ['receive', '리'], ['toss', '토'], ['attack', '어']];

  function handWidth() { const vw = window.innerWidth, vh = window.innerHeight; return vw <= 760 ? Math.max(56, Math.min(76, vw * .15)) : Math.max(58, Math.min(96, vw * .07, vh * .09)); }
  function renderHand() {

  function paramFor(purpose) { return purpose === 'attackBuff' ? 'attack' : purpose === 'blockBuff' ? 'block' : purpose === 'receiveBuff' ? 'receive' : null; }

  // 키워드 설명: 카드 텍스트에 키워드가 있는데 설명이 없으면 옆에 따로 보여 준다
  const KEYWORDS = [
    { k: '【등장】', re: /【등장】/, d: '이 카드가 코트에 등장했을 때 발동하는 스킬입니다. 등장 직후 체크 프로세스에서 해결됩니다.' },
    { k: '에리어 아이콘', re: /【(서브|블록|리시브|토스|어택) 에리어】/, d: '이 카드가 해당 에리어에 있을 때만 스킬이 발동합니다. 예) 【어택 에리어】 = 어택 캐릭터로 등장했을 때.' },
    { k: '이벤트 플레이 타이밍', re: /^【(서브|블록|드로우|리시브|토스|어택)】/, d: '자신의 해당 페이즈 프리 스텝에 패에서 플레이할 수 있습니다. 같은 페이즈에 여러 장도 가능합니다.' },
    { k: '「〜하면 사용할 수 있다」', re: /사용할 수 있다/, d: '앞의 행동(가츠 지불·드롭 등)을 할지 고를 수 있습니다. 하면 뒤의 효과를 반드시 적용하고, 할 수 없으면 사용할 수 없습니다.' },
    { k: '가츠', re: /가츠/, skip: /캐릭터 아래/, d: '각 에리어에서 맨 위 캐릭터 아래에 깔린 카드입니다. 같은 에리어에 새 캐릭터가 등장하면 원래 캐릭터는 가츠가 됩니다.' },
    { k: '가츠를 지불', re: /가츠를 지불/, d: '이 캐릭터가 있는 에리어의 가츠를 지정한 장수만큼 드롭 에리어에 놓습니다. 사이드 블로커는 블록 에리어(센터 아래)의 가츠를 씁니다.' },

    { k: '사이드 블로커', re: /사이드 블로커/, d: '센터 블로커와 함께 블록 에리어에 등장한 캐릭터(최대 2명). 블록 포인트가 디펜스에 더해지고, 블록 페이즈가 끝나면 드롭됩니다.' },
    { k: '블록 캐릭터', re: /블록 캐릭터/, d: '블록 에리어의 캐릭터(센터 + 사이드). 블록할 때 이들의 블록 포인트 합계가 디펜스 포인트입니다. 한 번에 최대 3명, 같은 이름은 불가.' },
    { k: '토스·어택 캐릭터', re: /(토스|어택|리시브) 캐릭터/, d: '각 에리어 맨 위의 캐릭터. 어택의 오펜스 포인트 = 토스 캐릭터의 토스 포인트 + 어택 캐릭터의 어택 포인트.' },
    { k: '오펜스 포인트', re: /오펜스 포인트/, d: '상대에게 보낸 공의 위력. 서브 = 서브 포인트, 어택 = 토스 + 어택, 블록 = 0. 상대는 이 값 이상의 디펜스 포인트로 받아야 합니다.' },

  function renderDetail() {

<script>
// 체험형 튜토리얼: 챕터마다 판을 미리 깔아 두고(preset), 코치 말풍선이 페이즈별로 할 일을 안내한다.
// 플레이어는 실제 엔진 위에서 직접 카드를 내고, 안내된 선택지만 고를 수 있게 제한한다.
(function (G) {
  'use strict';
  const { DECKS } = G.VobacaCards;
  const K = n => 'HV-D01-' + String(n).padStart(3, '0');   // 카라스노
  const N = n => 'HV-D02-' + String(n).padStart(3, '0');   // 네코마

  // ───── 판 배치 ─────
  function take(g, p, no) {
    const pl = g.players[p];
    let i = pl.deck.findIndex(c => c.no === no && c.ver === 'D');
    if (i < 0) i = pl.deck.findIndex(c => c.no === no);
    if (i < 0) throw new Error('tutorial: card not in deck ' + no);
    return pl.deck.splice(i, 1)[0];
  }
  function arrange(g, spec) {
    for (const p of [0, 1]) {
      const sp = spec['p' + p] || {}; const pl = g.players[p];
      g.shuffle(pl.deck);
      for (const no of sp.hand || []) pl.hand.push(take(g, p, no));
      for (const [a, nos] of Object.entries(sp.areas || {})) for (const no of nos) pl.areas[a].push(take(g, p, no));
      const top = (sp.deckTop || []).map(no => take(g, p, no));
      for (let i = 0; i < (sp.set ?? 2); i++) pl.setArea.push(pl.deck.shift());
      for (const c of top.reverse()) pl.deck.push(c);           // deck.pop() 이 위 → 목록 첫 장이 먼저 뽑힌다
    }
    return { server: spec.server ?? 0, start: spec.start || null };
  }

  // ───── CPU 대본 ─────
  function cpuDecider(script) {
    const used = new Set();
    return (g, req) => {
      for (let i = 0; i < script.length; i++) {
        if (used.has(i)) continue;
        const r = script[i];
        if (r.type !== req.type || (r.area && r.area !== req.area) || (r.phase && r.phase !== req.phase)) continue;
        used.add(i);
        if (req.type === 'deploy') {
          const c = req.options.map(u => g.players[req.player].hand.find(x => x.uid === u)).find(x => x && x.no === r.no);
          return c ? c.uid : undefined;
        }
        if ('answer' in r) return r.answer;
      }
      if (req.type === 'yesno') return false;
      if (req.type === 'free') return { action: 'pass' };
      if (req.type === 'start') return 'receive';
      return undefined;
    };
  }

  class Director {
    constructor(chIndex, hooks) {
      this.idx = chIndex; this.ch = CHAPTERS[chIndex]; this.i = 0; this.hooks = hooks;
      this.cpuDecide = cpuDecider(this.ch.cpu || []);
      this.cur = null; this.shown = null; this.finished = false;
    }
    get step() { return this.ch.steps[this.i]; }
    async advance(kind, x, when) {
      while (!this.finished && this.step && stepMatches(this.step, kind, x, when)) {
        const st = this.step;
        if (st.act) return st;
        await this.show(st, true);
        this.i++;
        if (st.end) { this.finish(); return null; }
      }
      return null;
    }
    async onAnim(g, ev, when) { await this.advance('anim', ev, when); }
    async onRequest(g, req) {
      const st = await this.advance('req', req);
      if (!st || this.finished) return;
      const UI = G.VobacaUI; const R = {};
      if (st.allow) {
        const ok = new Set(st.allow);
        const pl = g.players[req.player];
        if (Array.isArray(req.options) && !req.textOptions) {
          const keep = req.options.filter(u => { const c = pl.hand.find(x => x.uid === u) || G.VobacaAI.findCard(g, u); return c && ok.has(c.no); });
          req.options.splice(0, req.options.length, ...keep);
        }
      }
      if (st.lostOnly) { req.options.splice(0, req.options.length); R.lostOnly = true; }
      if (st.only) R.only = st.only;
      if (st.forcePlay) R.forcePlay = true;
      if (st.minSum) R.minSum = st.minSum;
      UI.ST.tutRestrict = R;
      this.cur = st;
      this.show(st, false);
    }
    onAnswered() {
      if (!this.cur) return;
      this.cur = null; this.i++;
      this.hide();
    }
    finish() {
      if (this.finished) return;
      this.finished = true; this.hide();
      const g = G.VobacaUI.ST.game; if (g) g.aborted = true;
      this.hooks.onFinish(this.idx);
    }
    // 코치 말풍선
    show(st, waitNext) {
      this.shown = st;
      const el = document.getElementById('coach'); const UI = G.VobacaUI;
      el.innerHTML = `<div class="co-head"><span class="co-ch">튜토리얼 ${this.idx + 1}/${CHAPTERS.length} · ${UI.esc(this.ch.title)}</span></div>
        <div class="co-body"><div class="co-ball" aria-hidden="true"></div><div><h3>${UI.esc(st.title)}</h3><p>${st.text}</p></div></div>
        <div class="co-foot">${waitNext ? `<button class="btn primary co-next" type="button">${st.end ? '완료' : '다음 ▶'}</button>` : '<span class="co-hint">👉 직접 해 보세요</span>'}</div>`;
      el.hidden = false; el.classList.toggle('acting', !waitNext);
      el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
      this.decorate();
      if (!waitNext) return Promise.resolve();
      return new Promise(res => { el.querySelector('.co-next').addEventListener('click', () => res(), { once: true }); });
    }
    hide() { this.shown = null; const el = document.getElementById('coach'); if (el) el.hidden = true; this.decorate(); }
    decorate() {
      for (const e of document.querySelectorAll('.tut-hl')) e.classList.remove('tut-hl');
      const st = this.shown; if (!st || !st.hl) return;
      for (const sel of st.hl) for (const e of document.querySelectorAll(sel)) e.classList.add('tut-hl');
    }
  }

  function decksFor() { return [DECKS.karasuno, DECKS.nekoma]; }

  G.VobacaTutorial = { CHAPTERS, arrange, cpuDecider, stepMatches, Director, decksFor };
})(typeof window !== 'undefined' ? window : globalThis);

    { id: 32, cat: 'skill', date: '2025-11-12', q: '캐릭터 스킬로 「이 턴 동안」이 기한인 효과를 쓴 뒤 그 캐릭터가 코트에서 없어지면 효과도 사라지나요?', a: '아니요, 사라지지 않습니다. 「이 턴 동안」이나 「다음 상대 턴 동안」처럼 기간이 적힌 스킬의 효과는 한 번 사용하면 그 기간 동안 사라지지 않습니다. (퍼머넌트형 스킬은 기간이 적혀 있어도 카드가 영역을 이동하면 사라질 수 있습니다.)' },
    { id: 33, cat: 'skill', date: '2025-11-12', q: '내 턴에 내 리시브 캐릭터가 등장했습니다. 나의 「자신의 리시브 캐릭터가 등장했을 때」 스킬과 상대의 「상대의 리시브 캐릭터가 등장했을 때」 스킬이 쓰였다면 어느 쪽을 먼저 실행하나요?', a: '자신이 쓴 스킬입니다. 여러 스킬의 효과가 동시에 발휘되면 먼저 자신(턴 플레이어)의 카드 스킬을 모두 해결한 뒤, 상대(비턴 플레이어)의 카드 스킬을 모두 해결합니다.' },
