  grid-template-columns: var(--colL) minmax(0, 1fr) var(--col);   /* 왼쪽(세트 · 서브)은 넓게 */
  grid-template-areas: "set court deck" "serve court drop" "serve court event"; grid-template-rows: 1fr 1fr 1fr; }
/* 상대 매트: 위아래 뒤집고, 메인 줄은 어택 · 토스 · 리시브 순서 (상대 어택이 내 리시브 바로 위) */

.phases { display: flex; gap: 3px; flex-wrap: nowrap; }

@media (max-width: 1180px) { .tb-left .ph:not(.on) { display: none; } }
.ph { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid rgba(255,255,255,.22); color: #bbb; }
.ph.on { background: #fff; color: #111; border-color: transparent; font-weight: 700; }
.ph.skip { opacity: .3; }

/* 다음으로 (하스스톤의 턴 종료 버튼처럼 네트 오른쪽) */
.netbtns { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); z-index: 32; display: flex; align-items: center; gap: 8px; }
.lostbtn { font: inherit; font-weight: 800; font-size: 13px; padding: 7px 14px; border-radius: 10px; cursor: pointer; color: #fff; border: 2px solid #ff8a8a;
  background: linear-gradient(180deg, #e2483f, #a8221c); box-shadow: 0 0 0 2px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.4); }
.lostbtn:hover { filter: brightness(1.1); }
.nextbtn { position: relative; z-index: 32; display: none; font-family: var(--f-display); font-size: clamp(14px, 1.7cqi, 19px); letter-spacing: .03em;
  padding: 9px 22px; border-radius: 12px; cursor: pointer; color: #2a1d00; border: 2px solid #8a6200;
  background: linear-gradient(180deg, #ffe680, #f5b912); box-shadow: 0 0 0 3px rgba(0,0,0,.35), 0 0 22px rgba(255,210,63,.55); animation: nextglow 1.6s ease-in-out infinite; }
.nextbtn.on { display: block; }
.nextbtn:hover { filter: brightness(1.08); }
@keyframes nextglow { 50% { box-shadow: 0 0 0 3px rgba(0,0,0,.35), 0 0 34px rgba(255,210,63,.85); } }
/* 지시 문구 (화면 위 가운데) */
.pill { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 33; max-width: min(560px, 54%); display: none; align-items: center; gap: 8px;
  padding: 6px 16px; border-radius: 999px; font-size: 13px; text-align: center; background: rgba(10,12,20,.88); border: 1.5px solid var(--team, var(--ball)); box-shadow: 0 8px 22px rgba(0,0,0,.45); pointer-events: none; }
.pill.on { display: flex; }
.pill b { color: var(--team, var(--ball)); white-space: nowrap; }
.pill span { color: #dfe4ee; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--team, var(--muted)); animation: blink 1s infinite; flex: 0 0 auto; }
/* 블록 / 리시브 선택 창 */
.cbox.start { gap: 10px; padding: 18px 22px 20px; }
.st-op { font-size: 13px; font-weight: 700; color: #c7cede; }
.st-op b { font-family: var(--f-display); font-weight: 400; font-size: 20px; color: #1b1600; background: var(--ball); padding: 0 12px; border-radius: 999px; margin-left: 4px; }
.st-choice { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.stc { display: grid; gap: 4px; justify-items: center; min-width: 200px; padding: 14px 20px; border-radius: 16px; cursor: pointer; color: #fff; font: inherit; text-align: center; border: 2px solid rgba(255,255,255,.3); transition: transform .12s, filter .12s; }
.stc:hover { transform: translateY(-2px); filter: brightness(1.1); }
.stc b { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.stc span { font-size: 12px; color: rgba(255,255,255,.85); line-height: 1.45; }
.stc-block { background: linear-gradient(160deg, #6a6461, #3b3533); border-color: #cfc8c4; }
.stc-receive { background: linear-gradient(160deg, #2a7be0, #134a9a); border-color: #8fc4ff; }
/* 블록 에리어에 올려 둔 카드 (결정 전) */
.staged { position: relative; }
.staged .card { outline: 2.5px dashed var(--ball); outline-offset: 2px; box-shadow: 0 0 18px rgba(255,210,63,.55); animation: drop-in .25s ease-out; }
.stg-acts { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); z-index: 5; display: flex; flex-direction: column; gap: 3px; align-items: center; }
.stg-acts .btn { padding: 1px 8px; font-size: 10.5px; font-weight: 800; line-height: 1.5; white-space: nowrap; color: #fff; background: rgba(10,12,20,.92); border-color: rgba(255,255,255,.45); box-shadow: 0 3px 8px rgba(0,0,0,.5); }
.stg-acts .btn:hover { border-color: var(--ball); color: var(--ball); }
.blkcancel { padding: 8px 16px; font-weight: 800; }
.nextbtn:disabled { filter: grayscale(.8) brightness(.7); animation: none; cursor: not-allowed; }
.bc-ok { color: var(--ok); font-weight: 800; } .bc-bad { color: var(--bad); font-weight: 800; }
/* 가운데 선택 창 */
.center { position: fixed; inset: 0; z-index: 48; display: none; place-items: center; padding: 16px; pointer-events: none; }
.center.on { display: grid; }
.center.dim { background: rgba(5,7,12,.62); pointer-events: auto; }
.center.up { place-items: start center; padding-top: max(70px, 14dvh); }
.cbox { pointer-events: auto; display: grid; justify-items: center; gap: 12px; padding: 18px 22px; border-radius: 16px; max-width: min(680px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto;
  background: rgba(16,20,31,.96); border: 1.5px solid rgba(255,210,63,.45); box-shadow: 0 20px 50px rgba(0,0,0,.6); text-align: center; animation: cbox-in .18s ease-out; }
@keyframes cbox-in { from { opacity: 0; transform: scale(.94); } }
.cbox .who2 { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; color: var(--team, var(--muted)); }
.cbox h2 { margin: -6px 0 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(20px, 3vw, 28px); letter-spacing: .02em; }
.cbox p { margin: 0; color: #c7cede; font-size: 13.5px; max-width: 52ch; }
.cbox .acts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.cbox .acts .btn { padding: 9px 22px; font-size: 15px; }
.cbox .bigchoice { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.cbox .bigchoice .btn { min-width: 140px; padding: 14px 24px; font-family: var(--f-display); font-weight: 400; font-size: 20px; border-radius: 14px; }
.cbox .opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.cbox .opt:hover { border-color: var(--ball); }
.cbox .tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.cbox .tiles .card { width: 86px; }
.cbox > .acts { position: sticky; bottom: -18px; margin: 0 -22px -18px; padding: 10px 22px 14px; width: calc(100% + 44px); justify-content: center; background: linear-gradient(180deg, transparent, var(--cbox-bg, rgba(14,16,24,.97)) 30%); }
.cbox .tiles .card.sel { outline: 3px solid var(--ball); outline-offset: 2px; }
.cbox .tiles .card.dim { filter: grayscale(.85) brightness(.55); cursor: default; }
.cbox .skcard { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; }
.cbox .skcard img { width: 110px; border-radius: 8px; display: block; }
.cbox.start { border-color: var(--team); background: rgba(16,20,31,.9); }
/* 멀리건: 정면에 크게 */
.mull-head { display: grid; justify-items: center; gap: 2px; padding: 8px 40px; border-radius: 12px; background: linear-gradient(180deg, #f6e3a7, #d6b25e); color: #2c1d00; border: 2px solid #8c6a1c; box-shadow: 0 0 30px rgba(140,180,255,.45); }
.mull-head b { font-family: var(--f-display); font-weight: 400; font-size: clamp(22px, 3.4vw, 32px); }
.mull-head span { font-size: 13px; font-weight: 700; color: #5b4205; }
.mull-cards { display: flex; gap: clamp(8px, 1.6vw, 20px); justify-content: center; flex-wrap: wrap; max-width: 1100px; }
.mcard { position: relative; width: clamp(64px, 10.5vw, 150px); border-radius: 10px; cursor: pointer; transition: transform .15s; box-shadow: 0 0 0 3px #3ad15a, 0 0 22px rgba(58,209,90,.6); }
.mcard img { width: 100%; display: block; border-radius: 10px; }
.mcard:hover { transform: translateY(-6px); }
.mcard .kn { position: absolute; left: 0; right: 0; bottom: -24px; font-size: 12px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcard.out { box-shadow: 0 0 0 3px var(--bad), 0 0 18px rgba(255,95,109,.5); }
.mcard.out img { filter: grayscale(.7) brightness(.55); }
.mcard.out::after { content: "✕ 교환"; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: clamp(18px, 2.4vw, 28px); color: #ff8a8a; text-shadow: 0 2px 0 #000; }
.mull-ok { margin-top: 20px; padding: 12px 40px; font-family: var(--f-display); font-size: 20px; border-radius: 999px; cursor: pointer; border: 2px solid #6fb4ff; color: #fff;
  background: radial-gradient(ellipse at 50% 30%, #6fb7ff, #1d5fc9); box-shadow: 0 0 24px rgba(111,183,255,.7); }
/* 로그: 왼쪽 아래 흐릿하게, 누르면 채팅창처럼 확대 */
.logbox { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; z-index: 30; width: 270px; max-height: 128px; overflow: hidden; border-radius: 10px; padding: 6px 8px; cursor: pointer;
  background: rgba(30,15,6,.5); border: 1px solid rgba(255,220,170,.12); opacity: .6; transition: opacity .15s; display: flex; flex-direction: column; justify-content: flex-end;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 40%); mask-image: linear-gradient(180deg, transparent 0, #000 40%); }
.logbox:hover { opacity: .9; }
.logbox .loghead { display: none; }
.logbox.open { width: min(420px, calc(100vw - 24px)); max-height: none; height: min(62dvh, 560px); opacity: 1; cursor: default; background: rgba(12,15,24,.97); border-color: var(--line); padding: 10px 12px; -webkit-mask-image: none; mask-image: none; z-index: 46; box-shadow: 0 16px 40px rgba(0,0,0,.6); justify-content: flex-start; }
.logbox.open .loghead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.logbox .log { overflow: hidden; }
.logbox.open .log { overflow-y: auto; flex: 1 1 auto; }

/* ── 공 · 연출 ── */
.vcard { position: absolute; z-index: 2; border-radius: 5px; overflow: hidden; pointer-events: none; transform-origin: 50% 65%; box-shadow: 0 14px 26px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.55); will-change: transform; }
.vcard img { width: 100%; height: 100%; display: block; object-fit: cover; }
/* 코인 토스: 멀리건처럼 화면 가운데, 주변은 어둡게 */
.coinstage { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; align-content: center; gap: clamp(14px, 3dvh, 26px); background: rgba(5,7,12,.74); animation: cs-in .25s ease-out; perspective: 900px; }
.coinstage.out { animation: cs-out .3s ease-in forwards; }
@keyframes cs-in { from { opacity: 0; } } @keyframes cs-out { to { opacity: 0; } }
.coinstage .mull-head { padding: 8px 46px; }
.vcoin { position: relative; width: clamp(130px, min(24vw, 28dvh), 230px); aspect-ratio: 1; transform-style: preserve-3d; }
.vcoin .cf { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; backface-visibility: hidden; border: clamp(6px, 1vw, 10px) solid #f6d77a;
  box-shadow: inset 0 0 0 5px rgba(0,0,0,.25), inset 0 0 30px rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.6); }
.vcoin .cf b { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, min(5vw, 6dvh), 54px); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.4); }
.vcoin .f0 { background: radial-gradient(circle at 35% 30%, #fff5, transparent 50%), var(--c0); }
.vcoin .f1 { background: radial-gradient(circle at 35% 30%, #fff5, transparent 50%), var(--c1); transform: rotateX(180deg); }
.vcoin-shadow { width: clamp(100px, 18vw, 180px); height: 18px; margin-top: -10px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.6), transparent); }
.vcoin-legend { display: flex; gap: 18px; font-size: 14px; font-weight: 700; color: #dfe4ee; }
.vcoin-legend span { display: flex; align-items: center; gap: 7px; }
.vcoin-legend i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #f6d77a; }
.vcoin-cap { font-family: var(--f-display); font-size: clamp(22px, 3.4vw, 34px); color: #fff; padding: 8px 28px; border-radius: 999px; background: rgba(10,12,20,.9); border: 2px solid var(--ball); white-space: nowrap; }
.vcoin-cap b { color: var(--ball); font-weight: 400; }
.coinstage.done .vcoin-cap { animation: pulse .5s ease-out; }
@keyframes pulse { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
/* 스킬 · 이벤트 발동 기록 (오른쪽 아래에 쌓임) */
.skillfeed { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); z-index: 47; width: min(300px, calc(100vw - 24px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.sf-item { --tc: var(--ball); display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 7px; border-radius: 12px; overflow: hidden;
  background: linear-gradient(100deg, color-mix(in srgb, var(--tc) 30%, #0d0f16) 0%, rgba(13,15,22,.94) 60%); border: 1.5px solid color-mix(in srgb, var(--tc) 70%, transparent);
  box-shadow: 0 8px 22px rgba(0,0,0,.5); opacity: .82; transition: opacity .3s; }
.sf-card { flex: 0 0 auto; width: 40px; padding: 0; border: 0; background: none; border-radius: 5px; overflow: hidden; box-shadow: 0 0 0 1.5px rgba(255,255,255,.7); pointer-events: auto; cursor: pointer; transition: transform .12s; }
.sf-card:hover { transform: scale(1.06) rotate(0deg) !important; box-shadow: 0 0 0 2px var(--ball); }
.sf-card img { width: 100%; aspect-ratio: 744 / 1039; display: block; object-fit: cover; }
.sf-info { display: grid; gap: 2px; min-width: 0; }
.sf-who { justify-self: start; font-size: 10px; font-weight: 900; padding: 0 7px; border-radius: 999px; background: var(--tc); color: #160c00; }
.sf-info b { font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sf-eff { margin: 0; font-size: 11.5px; font-weight: 700; color: var(--ball); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sf-ko { display: none; margin: 0; font-size: 11px; color: #c4cada; line-height: 1.45; }
/* 가장 최근 것은 크게 */
.sf-item:last-child { opacity: 1; padding: 10px 14px 10px 10px; border-width: 2px; box-shadow: 0 14px 34px rgba(0,0,0,.6), 0 0 26px color-mix(in srgb, var(--tc) 40%, transparent); }
.sf-item:last-child .sf-card { width: clamp(78px, 7vw, 104px); transform: rotate(-3deg); }
.sf-item:last-child .sf-info b { font-family: var(--f-display); font-weight: 400; font-size: 19px; white-space: normal; }
.sf-item:last-child .sf-eff { font-size: 13px; -webkit-line-clamp: 4; }
.sf-item:last-child .sf-ko { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 760px) { .skillfeed { width: min(250px, calc(100vw - 24px)); top: 52px; bottom: auto; right: 8px; transform: none; } .sf-item:last-child .sf-card { width: 60px; } .sf-item:last-child .sf-ko { display: none; } .sf-item:not(:last-child):not(:nth-last-child(2)) { display: none; } }
.fxlayer { position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: visible; }
.vball { z-index: 5; } .vshadow { z-index: 4; } .vghost { z-index: 3; } .vburst, .vring, .vpart { z-index: 6; } .vbanner { z-index: 8; }
.vball, .vshadow, .vghost { position: absolute; left: 0; top: 0; width: clamp(22px, 4.6cqi, 40px); aspect-ratio: 1; will-change: transform; }
.vball, .vshadow { opacity: 0; transition: opacity .2s; }
.fxlayer.on .vball { opacity: 1; } .fxlayer.on .vshadow { opacity: .55; }
.vball svg, .vghost svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.vshadow { border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.55), transparent); height: auto; aspect-ratio: 2.2 / 1; }
.vb-spin.spinning { animation: vspin .38s linear infinite; }
@keyframes vspin { to { transform: rotate(360deg); } }
.vb-spin.bob { animation: vbob .9s ease-in-out infinite; }
@keyframes vbob { 50% { transform: translateY(-5px) rotate(12deg); } }
.vb-op { position: absolute; right: -60%; top: -45%; min-width: 1.7em; padding: 0 .4em; border-radius: 999px; font-family: var(--f-display); font-size: clamp(12px, 2.2cqi, 18px); line-height: 1.5; text-align: center;
  background: var(--tc, #fff); color: #1b1200; box-shadow: 0 0 0 2px #1b1200; opacity: 0; transform-origin: 30% 70%; }
.vb-op.on { opacity: 1; }
.vflash { position: absolute; inset: -10px; border-radius: 14px; opacity: 0; mix-blend-mode: screen; }
.vburst { position: absolute; white-space: nowrap; font-family: var(--f-display); font-size: calc(clamp(16px, 3.4cqi, 30px) * var(--sz, 1)); color: #fff;
  -webkit-text-stroke: 1.5px #1b1200; paint-order: stroke fill; text-shadow: 0 3px 0 #1b1200; font-style: italic; letter-spacing: .02em; }
.vburst.t2 { color: #ffe36b; } .vburst.t3 { color: #ffb02e; } .vburst.t4 { color: #ff5b3a; text-shadow: 0 3px 0 #1b1200, 0 0 18px rgba(255,91,58,.8); }
.vburst.ok { color: #7fe0ff; } .vburst.bad { color: #ff8a80; }
.vpart { position: absolute; width: 7px; height: 7px; border-radius: 2px; }
.vring { position: absolute; width: 40px; height: 40px; border-radius: 50%; border: 4px solid #fff; }
.vbanner { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); display: none; text-align: center; padding: 12px 28px; border-radius: 10px;
  background: rgba(14,16,24,.88); border: 2px solid var(--ball); color: #fff; }
.vbanner.on { display: grid; gap: 2px; }
.vbanner b { font-family: var(--f-display); font-weight: 400; font-size: clamp(22px, 5cqi, 40px); color: var(--ball); font-style: italic; }
.vbanner span { font-size: 13px; color: #ddd; }
.vbanner.lost { border-color: var(--bad); } .vbanner.lost b { color: var(--bad); }

/* ── カード ── */
.card { position: relative; width: var(--slot); aspect-ratio: 744 / 1039; border-radius: 4px; overflow: hidden; border: 0; padding: 0; background: #222; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.45); flex: 0 0 auto; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .pv { position: absolute; right: 2px; bottom: 2px; min-width: 20px; padding: 0 4px; border-radius: 4px; background: rgba(10,12,20,.88); font-family: var(--f-display); font-size: 13px; line-height: 20px; text-align: center; color: #fff; }
.card .pv.up { color: var(--ok); } .card .pv.down { color: var(--bad); }
.card .badge { position: absolute; left: 2px; top: 2px; padding: 0 5px; border-radius: 4px; background: var(--ball); color: #1b1600; font-weight: 900; font-size: 11px; line-height: 17px; }
.card .badge.nm { background: #fff; color: #222; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.card.enter { animation: drop-in .35s ease-out; }
/* 한국어 카드 이름 캡션 (카드 이미지 아래) */
.card.cap { aspect-ratio: auto; overflow: visible; background: none; box-shadow: none; border-radius: 0; }
.card.cap img { height: auto; aspect-ratio: 744 / 1039; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.45); }
.card.cap .pv { bottom: 22px; }
.card .kn { display: block; margin-top: 3px; font-size: 11px; line-height: 14px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
.prompt .tiles .card .kn { font-size: 10px; }
@keyframes drop-in { from { transform: translateY(-10px) scale(.92); opacity: .2; } to { transform: none; opacity: 1; } }
.back { background: repeating-linear-gradient(135deg, #1b1b1f 0 7px, #26262c 7px 14px); display: grid; place-items: center; }
.back::after { content: "VOBACA"; font-family: var(--f-display); font-size: 9px; color: var(--karasuno); letter-spacing: .08em; transform: rotate(-90deg); }

/* ── 手札 ── */
/* ── 패: 화면 아래 가운데 부채꼴 ── */
.handwrap { overflow-x: clip; position: relative; z-index: 25; width: min(100%, 1100px); margin: 10px auto 0; pointer-events: none; flex: 0 0 auto; }
.handhead { position: absolute; left: 6px; bottom: 6px; z-index: 0; display: grid; gap: 1px; font-size: 11px; color: var(--muted); pointer-events: auto;
  background: rgba(14,18,28,.82); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
.handhead b { color: var(--fg); font-size: 12px; }
.hand { position: relative; height: calc(var(--handh) - 10px); pointer-events: none; }
.hc { --off: calc(var(--i) - var(--mid)); --tx: calc(-50% + var(--off) * var(--sp, 70px));
  position: absolute; left: 50%; bottom: 16px; width: var(--hw); z-index: calc(10 + var(--i)); pointer-events: auto;
  transform: translateX(var(--tx)) translateY(calc(var(--off) * var(--off) * var(--dr, 1.4px))) rotate(calc(var(--off) * var(--rot, 4deg)));

<div class="rotatehint" id="rotateHint" role="dialog" aria-label="화면 방향"><div class="rh-phone" aria-hidden="true"></div><b>세로로 돌려 주세요</b><p>휴대폰은 세로 화면에 맞춰져 있어요. 가로에서는 카드가 아주 작게 보여요.</p><button class="btn" type="button" id="allowLand">그래도 가로로 보기</button></div>

<script>
// 효과음 · 배경음 (Web Audio)
// 기본음은 모두 코드로 합성한다(파일 없음). 관리자가 항목별로 파일을 올리면 그 소리로 바뀐다(사이트 전용 audioadmin.js).
(function (G) {
  'use strict';

  // ───── 소리 항목 (관리자 화면에서 이 순서 · 이 묶음으로 보임) ─────
  const CATS = [
    ['bgm', '배경음'],
    ['rally', '랠리 — 공 소리'],
    ['judge', '판정 · 세트 · 경기'],
    ['card', '카드 · 스킬'],
    ['ui', '화면 조작'],
  ];
  const ITEMS = [
    { id: 'bgm_lobby', cat: 'bgm', label: '로비 배경음', desc: '메인 화면 · 메뉴 · 덱 편집 · 카드 목록에서 반복 재생', bgm: true },
    { id: 'bgm_battle', cat: 'bgm', label: '대전 배경음', desc: 'AI 대전 · 튜토리얼 경기 중 반복 재생', bgm: true },
    { id: 'serve', cat: 'rally', label: '서브', desc: '서브 캐릭터가 공을 칠 때 (OP가 클수록 세게)' },
    { id: 'receive', cat: 'rally', label: '리시브', desc: '리시브 성공 — 팔로 받아 올리는 소리' },
    { id: 'toss', cat: 'rally', label: '토스', desc: '세터가 손끝으로 공을 올릴 때' },
    { id: 'spike', cat: 'rally', label: '스파이크 (어택)', desc: '어택 캐릭터가 내리칠 때 (OP가 클수록 세게)' },
    { id: 'block', cat: 'rally', label: '블록', desc: '블록 성공 — 손바닥에 막히는 소리' },
    { id: 'doshut', cat: 'rally', label: '도샷', desc: '도샷으로 상대 코트에 내리꽂을 때' },
    { id: 'onetouch', cat: 'rally', label: '원터치', desc: '원터치 · 블록 페이즈 종료 효과' },
    { id: 'floor', cat: 'rally', label: '공이 바닥에 떨어짐', desc: '리시브 · 블록 실패' },
    { id: 'squeak', cat: 'rally', label: '농구화 끼익', desc: '블록 / 리시브를 고를 때 코트를 박차는 소리' },
    { id: 'whistle', cat: 'judge', label: '휘슬 (짧게)', desc: '세트 시작 · 득점' },
    { id: 'coin', cat: 'judge', label: '코인 토스', desc: '경기 시작 서브권 코인 토스' },
    { id: 'cheer', cat: 'judge', label: '관중 환호', desc: '내가 세트를 땄을 때' },
    { id: 'aww', cat: 'judge', label: '관중 탄식', desc: '상대가 세트를 땄을 때' },
    { id: 'win', cat: 'judge', label: '승리', desc: '경기 승리 결과 화면' },
    { id: 'lose', cat: 'judge', label: '패배', desc: '경기 패배 결과 화면' },
    { id: 'card_draw', cat: 'card', label: '카드 뽑기', desc: '덱에서 카드를 뽑을 때 (한 장마다)' },
    { id: 'card_place', cat: 'card', label: '캐릭터 등장', desc: '코트에 캐릭터 카드를 놓을 때' },
    { id: 'event_play', cat: 'card', label: '이벤트 플레이', desc: '이벤트 카드 효과가 적용될 때' },
    { id: 'skill', cat: 'card', label: '스킬 발동', desc: '캐릭터 스킬 효과가 적용될 때' },
    { id: 'ui_click', cat: 'ui', label: '버튼 클릭', desc: '버튼을 누를 때 (작게)' },
  ];
  const BY = Object.fromEntries(ITEMS.map(x => [x.id, x]));

  // ───── 사용자 설정 (이 브라우저 · 로그인 시 계정에 저장) ─────
  const PREF_KEY = 'vobaca-sound';
  const prefs = { bgm: 0.5, sfx: 0.8, mute: false };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) {}
  function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} }

  // ───── 오디오 그래프 ─────
  let ctx = null, master, sfxBus, bgmBus, NOISE = null, shaper = null;
  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    try { ctx = new AC(); } catch (e) { return null; }
    master = ctx.createGain();
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
    master.connect(comp); comp.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.connect(master);
    bgmBus = ctx.createGain(); bgmBus.connect(master);
    NOISE = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    shaper = ctx.createWaveShaper(); const k = 18, n = 1024, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; curve[i] = (1 + k) * x / (1 + k * Math.abs(x)); }
    shaper.curve = curve;
    applyVol();
    return ctx;
  }
  function applyVol() {
    if (!ctx) return;
    const t = ctx.currentTime;
    sfxBus.gain.setTargetAtTime(prefs.mute ? 0 : prefs.sfx, t, 0.02);
    bgmBus.gain.setTargetAtTime(prefs.mute ? 0 : prefs.bgm * 0.55, t, 0.05);
  }
  // 브라우저는 사용자가 한 번 누르기 전에는 소리를 못 내게 하므로, 첫 조작에서 켠다
  let unlocked = false;
  function unlock() {
    if (!ensure()) return;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    if (!unlocked) { unlocked = true; if (want) startBgm(want, true); }
  }
  ['pointerdown', 'keydown', 'touchend'].forEach(ev => document.addEventListener(ev, unlock, { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => {   // 다른 탭으로 가면 멈춤
    if (!ctx) return;
    if (document.hidden) ctx.suspend().catch(() => {}); else if (unlocked) ctx.resume().catch(() => {});
  });

  // ───── 교체 소리 (관리자가 올린 파일) ─────
  const over = {};      // id -> { buffer, name }
  const itemVol = {};   // id -> 배율 (관리자가 조절, 기본 1)
  function setOverride(id, o) { if (o && o.buffer) over[id] = o; else delete over[id]; if (BY[id] && BY[id].bgm && (want === id || preview.id === id)) restartBgm(); }
  function setItemVol(id, v) { itemVol[id] = Math.max(0, Math.min(3, +v || 0)); if (curSong && curSong.id === id) curSong.gain.gain.setTargetAtTime(itemVol[id] ?? 1, ctx.currentTime, 0.05); }
  async function decode(arrayBuffer) {
    const c = ensure() || new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, 44100, 44100);
    return await new Promise((res, rej) => { const p = c.decodeAudioData(arrayBuffer.slice(0), res, rej); if (p && p.then) p.then(res, rej); });
  }

  // ───── 합성 도구 ─────
  function out(vol, target) { const g = ctx.createGain(); g.gain.value = vol; g.connect(target || sfxBus); return g; }
  function envGain(t, a, peak, d, dest) {
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    g.connect(dest); return g;
  }
  function noise(t, dur, dest, type, freq, Q = 1, freq2) {
    const s = ctx.createBufferSource(); s.buffer = NOISE;
    let node = s;
    if (type) { const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); if (freq2) f.frequency.exponentialRampToValueAtTime(freq2, t + dur); f.Q.value = Q; s.connect(f); node = f; }
    node.connect(dest);
    s.start(t, Math.random() * 1.2, dur + 0.05); return s;
  }
  function burst(t, dur, peak, dest, type, freq, Q, freq2, a = 0.002) { noise(t, dur + a, envGain(t, a, peak, dur, dest), type, freq, Q, freq2); }
  function osc(t, dur, type, f0, f1, dest) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    o.connect(dest); o.start(t); o.stop(t + dur + 0.05); return o;
  }
  function thump(t, f0, f1, dur, peak, dest, type = 'sine', a = 0.002) { osc(t, dur + a, type, f0, f1, envGain(t, a, peak, dur, dest)); }
  function note(t, freq, dur, peak, dest, type = 'triangle', a = 0.005) { osc(t, dur + a, type, freq, freq, envGain(t, a, peak, dur, dest)); }
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // 공을 손바닥으로 치는 「팡」: 짧고 날카로운 파열음 + 몸통 울림 (power 0~1)
  function hit(t, p, dest) {
    const d = ctx.createGain(); d.gain.value = 0.33; d.connect(dest);
    let snapDest = d;
    if (p > 0.55) { const sh = ctx.createWaveShaper(); sh.curve = shaper.curve; const post = ctx.createGain(); post.gain.value = 0.6 + p * 1.4; sh.connect(post); post.connect(d); const pre = ctx.createGain(); pre.gain.value = 0.7 + p; pre.connect(sh); snapDest = pre; }   // 강타는 살짝 찢어지는 소리
    burst(t, 0.022 + p * 0.03, 0.9, snapDest, 'bandpass', 1500 + p * 900, 0.7);
    burst(t, 0.012, 0.55 + p * 0.3, d, 'highpass', 3800, 0.7);
    thump(t, 190 + p * 70, 72, 0.1 + p * 0.09, 0.55 + p * 0.5, d);
    if (p > 0.75) thump(t + 0.004, 85, 42, 0.26, 0.5 * p, d);   // 강타는 바닥이 울리는 저음
  }
  function whistle(t, len, dest) {
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.24, t + 0.025);
    g.gain.setValueAtTime(0.24, t + len - 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + len); g.connect(dest);
    const trem = ctx.createGain(); trem.gain.value = 0.65; trem.connect(g);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 31; const lg = ctx.createGain(); lg.gain.value = 0.35; lfo.connect(lg); lg.connect(trem.gain); lfo.start(t); lfo.stop(t + len + 0.05);
    osc(t, len, 'sine', 3150, 3080, trem); const o2 = ctx.createGain(); o2.gain.value = 0.25; o2.connect(trem); osc(t, len, 'sine', 3340, 3300, o2);
    burst(t, len, 0.12, g, 'bandpass', 3200, 6);
  }
  function crowd(t, len, dest, f0, f1, peak) {
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + len * 0.18); g.gain.exponentialRampToValueAtTime(0.0001, t + len); g.connect(dest);
    for (const [f, q] of [[f0, 0.8], [f0 * 1.9, 1.2], [f0 * 3.1, 2]]) noise(t, len, g, 'bandpass', f, q, f1 ? f1 * f / f0 : undefined);
  }

  // ───── 기본 효과음 (합성) ─────
  const SYN = {
    serve(t, o, x) { hit(t, 0.35 + (x.power || 0.3) * 0.5, o); burst(t + 0.01, 0.22, 0.06, o, 'bandpass', 2400, 1, 700); },
    spike(t, o, x) { hit(t, 0.55 + (x.power || 0.5) * 0.45, o); },
    receive(t, o) { thump(t, 150, 92, 0.15, 0.7, o); burst(t, 0.05, 0.32, o, 'lowpass', 700, 0.7); burst(t, 0.012, 0.16, o, 'bandpass', 2400, 1); },
    toss(t, o) { thump(t, 420, 270, 0.05, 0.5, o); burst(t, 0.016, 0.3, o, 'bandpass', 2600, 1.2); thump(t + 0.012, 380, 260, 0.04, 0.25, o); },
    block(t, o) { hit(t, 0.62, o); hit(t + 0.02, 0.4, o); thump(t, 120, 70, 0.18, 0.35, o); },
    doshut(t, o) { hit(t, 1, o); burst(t + 0.02, 0.35, 0.15, o, 'highpass', 5000, 0.5); },
    onetouch(t, o) { burst(t, 0.018, 0.45, o, 'highpass', 2600, 0.8); thump(t, 330, 210, 0.05, 0.35, o); burst(t + 0.03, 0.18, 0.08, o, 'bandpass', 1400, 1, 600); },
    floor(t, o) { thump(t, 115, 52, 0.24, 0.75, o); burst(t, 0.06, 0.35, o, 'lowpass', 500, 0.7); thump(t + 0.3, 105, 60, 0.12, 0.42, o); thump(t + 0.5, 100, 64, 0.08, 0.2, o); thump(t + 0.63, 98, 66, 0.05, 0.1, o); },
    squeak(t, o) { const g = envGain(t, 0.01, 0.5, 0.09, o); const s = ctx.createOscillator(); s.type = 'sawtooth'; s.frequency.setValueAtTime(1900, t); s.frequency.linearRampToValueAtTime(2700, t + 0.05); s.frequency.linearRampToValueAtTime(2300, t + 0.1); const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 3; s.connect(f); f.connect(g); s.start(t); s.stop(t + 0.12); },
    whistle(t, o, x) { whistle(t, x.long ? 0.75 : 0.42, o); },
    coin(t, o) { burst(t, 0.25, 0.06, o, 'bandpass', 3000, 2, 6000); for (const [f, d, v] of [[2637, 0.9, 0.18], [3951, 0.6, 0.12], [5274, 0.4, 0.08], [7040, 0.25, 0.05]]) note(t + 0.22, f, d, v, o, 'sine', 0.002); },
    cheer(t, o) { crowd(t, 2.2, o, 900, 1300, 0.45); for (let i = 0; i < 22; i++) { const tt = t + 0.1 + Math.random() * 1.5; burst(tt, 0.012, 0.16 + Math.random() * 0.1, o, 'bandpass', 1500 + Math.random() * 1200, 1.4); } whistle(t, 0.3, o); },
    aww(t, o) {
      const g = envGain(t, 0.25, 0.25, 1.2, o);
      for (const [f0, f1] of [[310, 190], [330, 205], [295, 180]]) { const s = ctx.createOscillator(); s.type = 'sawtooth'; s.frequency.setValueAtTime(f0, t); s.frequency.exponentialRampToValueAtTime(f1, t + 1.3); s.detune.value = (Math.random() - 0.5) * 30; const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(600, t + 1.3); f.Q.value = 2; s.connect(f); f.connect(g); s.start(t); s.stop(t + 1.5); }
      crowd(t, 1.4, o, 500, 350, 0.12);
    },
    win(t, o) {
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.connect(o);
      const seq = [[0, 67, 0.12], [0.13, 67, 0.12], [0.26, 67, 0.12], [0.4, 72, 0.7]];
      for (const [dt, m, d] of seq) for (const [k, det] of [[0, -6], [4, 4], [7, 0]]) { const g = envGain(t + dt, 0.015, 0.11, d, lp); const s = ctx.createOscillator(); s.type = 'sawtooth'; s.frequency.value = mtof(m + k); s.detune.value = det; s.connect(g); s.start(t + dt); s.stop(t + dt + d + 0.05); }
      burst(t + 0.4, 1.1, 0.14, o, 'highpass', 6000, 0.5); thump(t + 0.4, 90, 45, 0.4, 0.5, o);
    },
    lose(t, o) { [[0, 64], [0.28, 62], [0.56, 60], [0.84, 55]].forEach(([dt, m], i) => note(t + dt, mtof(m), i === 3 ? 1.1 : 0.32, 0.3, o, 'triangle', 0.01)); },
    card_draw(t, o) { burst(t, 0.13, 0.5, o, 'bandpass', 1400, 1.4, 5200, 0.03); },
    card_place(t, o) { thump(t, 230, 120, 0.06, 0.45, o); burst(t, 0.045, 0.42, o, 'lowpass', 1900, 0.7); },
    event_play(t, o) { [1046.5, 1318.5, 1568, 2093].forEach((f, i) => note(t + i * 0.055, f, 0.5, 0.12, o, 'triangle', 0.003)); burst(t, 0.3, 0.05, o, 'highpass', 7000, 0.6); },
    skill(t, o) { thump(t, 660, 1320, 0.16, 0.22, o, 'triangle', 0.01); note(t + 0.09, 1760, 0.35, 0.16, o, 'sine'); burst(t + 0.05, 0.25, 0.05, o, 'highpass', 6500, 0.6); },
    ui_click(t, o) { thump(t, 1000, 760, 0.03, 0.12, o, 'sine', 0.001); },
  };

  // ───── 재생 ─────
  const last = {};
  const GAP = { card_draw: 0.05, skill: 0.18, event_play: 0.18, card_place: 0.05, ui_click: 0.04 };
  function play(id, x = {}) {
    if (!ctx || !unlocked || prefs.mute || prefs.sfx <= 0) return;
    const it = BY[id]; if (!it || it.bgm) return;
    const now = ctx.currentTime;
    if (now - (last[id] || -1) < (GAP[id] ?? 0.03)) return;
    last[id] = now;
    playItem(id, x, sfxBus);
  }
  function playItem(id, x, bus, mode) {
    const t = ctx.currentTime + 0.01;
    const vol = (itemVol[id] ?? 1) * (x.vol ?? 1);
    const o = out(vol, bus);
    const ov = mode === 'default' ? null : over[id];
    if (ov) { const s = ctx.createBufferSource(); s.buffer = ov.buffer; const pv = x.power != null ? 0.65 + x.power * 0.5 : 1; o.gain.value = vol * pv; s.connect(o); s.start(t); setTimeout(() => o.disconnect(), (ov.buffer.duration + 0.5) * 1000); return; }
    try { SYN[id](t, o, x); } catch (e) { console.warn(e); }
    setTimeout(() => o.disconnect(), 4000);
  }

  // ───── 배경음 ─────
  // 기본 배경음: 간단한 시퀀서로 실시간 합성 (8마디 반복)
  const SONGS = {
    // 로비: 100 BPM, 가볍고 산뜻하게 (Fmaj7 - Em7 - Dm7 - Cmaj7)
    bgm_lobby: {
      bpm: 100,
      chords: [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59], [53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 62], [55, 59, 62, 65]],
